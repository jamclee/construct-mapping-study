<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Listings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .scenario { font-size: 15px; margin: 0 0 8px; }
  .scenario p { margin: 0 0 11px; }

  /* ATTRIBUTE PREAMBLE.
     Every attribute is one row of one table, rendered from a single template
     with identical weight, spacing and type. There is no callout box, no accent
     border and no emphasis on any row — the Neighborhood Index has to look like
     one ordinary entry in a standard conjoint attribute table. */
  .attrlist { margin: 14px 0 0; }
  table.attrtable { border-collapse: collapse; width: 100%; }
  table.attrtable th {
    text-align: left; font-size: 12px; font-weight: 600; color: #737b82;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0 14px 7px 0; border-bottom: 1px solid #c8ced4;
  }
  table.attrtable td {
    font-size: 14px; padding: 11px 14px 11px 0;
    border-bottom: 1px solid #e6ebf0; vertical-align: top;
  }
  table.attrtable tr:last-child td { border-bottom: none; }
  table.attrtable td.an { font-weight: 600; width: 172px; }
  table.attrtable td.ad { color: #33383d; }
  @media (max-width: 560px) { table.attrtable td.an { width: 118px; } }

  .units { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0 0; }
  .card { border: 1px solid #dfe3e7; border-radius: 7px; padding: 14px 15px; background: #fff; }

  /* two lines are reserved for the property name so that a long name wrapping
     in one card does not push its attribute rows out of line with the other
     card's. Below ~700px "Marlow Court Apartments and Townhouses" wraps while
     "Deerfield Apartments" does not, and unaligned rows make the pair much
     harder to compare — which is the one thing a choice-task example must not
     do. Keep this if you rename the properties. */
  .name { font-size: 15.5px; font-weight: 600; margin: 0 0 2px; min-height: 3em; }
  .addr { font-size: 12.5px; color: #737b82; margin: 0 0 8px; }
  .price { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .price span { font-size: 12.5px; font-weight: 400; color: #737b82; }

  .prow { display: flex; gap: 10px; font-size: 13px; padding: 2.5px 0; }
  .plab { flex: 0 0 104px; color: #737b82; }
  .pval { color: #1f2328; }

  /* the index row on a card is styled exactly like every other attribute row —
     no divider, no larger type, no accent */
  .nilab { flex: 0 0 104px; color: #737b82; }

  .decision { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }

  #comp { display: none; }
  #comp.open { display: block; }
  /* single-screen layout: the items sit directly under the material they refer
     to, so they need a rule to separate them from the stimulus */
  #comp.inline { margin-top: 26px; padding-top: 20px; border-top: 1px solid #e6e8eb; }
  .compintro { font-size: 14px; margin: 0 0 18px; }
  .compq { margin-bottom: 20px; }
  .compq p { font-size: 14.5px; margin: 0 0 9px; }
  .opts { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 8px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  @media (max-width: 560px) { .units { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="stimulus">
    <div class="scenario" id="scenario"></div>
    <div class="attrlist" id="attrlist"></div>
    <div class="scenario" id="exampleLead"></div>
    <div class="units" id="units"></div>
    <div class="decision" id="continueWrap">
      <button type="button" class="choicebtn" id="continueBtn">Next</button>
    </div>
  </div>

  <div id="comp"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     NOVEL-ATTRIBUTE COMPREHENSION PROBE — "Neighborhood Index"

     PURPOSE. Introduce an attribute the respondent has no prior experience
     with, then test whether two things are understood: (a) WHAT the attribute
     refers to, and (b) WHICH DIRECTION of the scale is favourable. This is a
     comprehension check on newly presented information, not a knowledge test —
     everything needed to answer is on the screen while the items are answered.

     THE INDEX IS CAMOUFLAGED IN TWO PLACES, AND THE REASON IS THE SAME BOTH
     TIMES. A respondent who can tell which attribute the study cares about will
     attend to it differently from how they would in the real choice tasks, and
     the probe then measures compliance with a cue rather than the comprehension
     it is supposed to measure. So:

       (1) IN THE PREAMBLE. The index is one row of an ordinary conjoint
           attribute table (Attribute | Description), rendered from the same
           template as the other five, with no callout box, accent rule or bold.
           Descriptions are deliberately terse and kept within a narrow length
           band — the index cell has to carry a definition AND a direction
           sentence, so it is the longest, and the others are written to sit
           close enough that it does not read as the odd row out. Being visibly
           the longest cell is itself a cue; if you edit this copy, keep the
           band even. It sits FIFTH of eight — buried rather than first or last,
           both of which are recall-privileged positions. Critically, the direction
           sentence is NOT emphasised: bolding it would tell the respondent
           exactly which clause is about to be tested, which is precisely the
           thing the direction item must not do.

           An earlier version gave three attributes a "More detail" expander so
           the index would not be the only expandable row — a lone expander on
           one attribute is itself a cue. The expanders are gone now for
           brevity, which is fine BECAUSE all three went: uniformity is what
           mattered, not the expanders themselves. If you ever add one back, add
           it to several rows or not at all.

       (2) IN THE ITEM BLOCK. Three filler items about rent, lease and size are
           interleaved with the three index items, and the block opens and
           closes on a filler. The framing text refers to "the content that will
           be presented", not to any one attribute.

     FILLERS ARE SCORED, BUT SEPARATELY. `filler_n_correct` is reported and is
     worth keeping — it is a serviceable general-attentiveness covariate, and a
     respondent who misses the rent item has told you something. But it is NOT
     part of `passed`, and the index items are NOT pooled with it. Pooling would
     dilute the direction asymmetry described below, which is the whole point of
     the instrument.

     WHY THE SCALE RUNS THE "WRONG" WAY. A 0-100 attribute recruits a strong lay
     prior (school grades: higher is better, 100 is the ceiling). If the stated
     direction matched that prior, the direction item would be passed by every
     respondent who never read the preamble — it could not fail, so it could not
     measure. The scale therefore runs the other way:

         "Lower numbers mean a better-rated neighborhood."

     This is not a trick. Real-world indices run both ways (golf handicap,
     air-quality index, crime rate per 1,000), and the name "Index" rather than
     "Score" was chosen because it is directionally neutral in ordinary usage.
     The sentence is stated plainly, once, unemphasised, in the index row.

     THIS DIRECTION MUST MATCH THE REAL CHOICE TASKS. The probe is a preamble;
     whatever it states is what participants carry into the conjoint. If the
     study's index runs higher-is-better, this file is wrong and will train
     respondents incorrectly. Change both together or neither.

     NOT RANDOMISED. An earlier version assigned direction by coin flip and read
     the diagnostic off the between-subjects asymmetry (higher_worse accuracy
     minus higher_better accuracy). That is gone: every respondent now sees
     identical text, so all variance in the item is reading variance rather than
     assignment. The diagnostic survives at the item level instead — see below.

     THE PRIOR-DRIVEN ERROR IS TRACKED SEPARATELY. On the direction item the
     "78" option is not an ordinary distractor: it is the specific answer
     produced by ignoring the text and applying the higher-is-better prior. It
     is recorded as `comp_direction_prior_error`. Report its share alongside
     accuracy — wrong answers CONCENTRATED on 78 indicate the prior firing,
     wrong answers SCATTERED across "about the same" and "does not say" indicate
     guessing or disengagement. Accuracy alone cannot separate those.

     DECONFOUNDING. No attribute on the cards other than the index speaks to the
     surrounding area, and building quality is deliberately CROSSED with the
     index rather than aligned with it: the cheaper, older, less equipped
     building sits in the better-rated area, and the newer, better equipped one
     sits in the worse-rated area. If quality and area ran together, a
     respondent could answer index questions from "nicer building, nicer
     neighborhood" without reading the definition, and the index would carry no
     information the other attributes do not. Card position is randomised
     independently of which building carries which index. Lease term is held
     constant across both cards so the lease filler cannot be answered by
     comparing them — it has to come from the preamble, like the other fillers.

     WHY SEVERAL ATTRIBUTES ARE RANGES. The alternative is a whole building, not
     one apartment, so rent, size, laundry and lease vary across the units
     inside it and a single figure would misrepresent what is being chosen.
     Deposit and pet fee stay single values because they are building-wide
     policies rather than unit characteristics, and each says so in its own
     description — otherwise their being the only flat numbers would look like
     an oversight.

     The rent and size ranges are deliberately NON-OVERLAPPING between the two
     buildings. Overlapping ranges are more realistic but make "which is
     cheaper" genuinely ambiguous, and nothing in this probe asks respondents to
     resolve that — it is an example pair, so clarity beats realism. If you
     reuse these cards in the real choice tasks, let the ranges overlap there.

     NO MEMORY DEMAND, BUT A GATE. The items are hidden until the respondent
     clicks Next, and the stimulus then STAYS on screen beneath nothing and
     above the questions. So nothing has to be held in mind — the table is still
     there while the items are answered — but the respondent has to pass through
     a deliberate commit step first, which is what makes `t_continue` a usable
     reading-time measure. This is deliberate. A respondent who fails an item
     here has not forgotten
     the definition — it is directly above the question — so failure is
     attributable to not reading or not understanding rather than to retention.
     That is the cleaner comprehension construct, and it is also the fairer one:
     retention failures would otherwise be scored as comprehension failures,
     which inflates exclusion rates and correlates with working memory rather
     than with effort.

     WHAT CO-VISIBILITY COSTS, AND WHY THE ITEMS STILL DISCRIMINATE. Open-book
     presentation makes the `meaning` item close to a verbatim match against the
     index row — it will run near ceiling, and should be read as a floor check
     ("did they engage with the screen at all") rather than as a graded measure.
     The same is true of the three fillers. The discriminating power sits in the
     other two index items, and neither is weakened by co-visibility:

       direction — cannot be answered from the lay prior in the higher_worse
                   condition no matter how long the preamble is on screen, so it
                   separates reading from assuming. Camouflage matters most
                   here: an emphasised direction sentence would be found by
                   search rather than read in passing.
       scope     — requires an inference (the index attaches to an address, so
                   two units in one building share it) that is not stated
                   verbatim anywhere, so it cannot be satisfied by matching.

     TIMING: THREE FIELDS, AND THEY MEAN DIFFERENT THINGS.

       t_continue      dwell on the stimulus before Next was clicked, with no
                       questions visible. The cleanest reading-time measure in
                       the file — nothing else could have occupied that time.
       t_first_answer  from load to the first option clicked.
       t_comp_done     from load to the last option clicked.

     The interval (t_comp_done − t_continue) is time spent with both the
     stimulus and the items visible, i.e. answering with the option to look
     back. A respondent with a very short `t_continue` and a long interval read
     nothing up front and used the table as a lookup; one with a long
     `t_continue` and a short interval read first and answered from memory even
     though they did not have to. Those are different people and only the gated
     layout can tell them apart.

     To make this a RETENTION test instead, set HIDE_STIMULUS true: the stimulus
     is withdrawn on Next. Both numbers referenced by the direction item are
     restated inside the question stem, so withdrawal never makes an item
     unanswerable. Be clear that this changes the construct — retention
     failures would then be scored as comprehension failures, which inflates
     exclusion rates and correlates with working memory rather than with effort.
     ------------------------------------------------------------------ */

  var PROBE_ID = "NI_COMP";

  /* ---------------- configuration ---------------- */

  /* LAYOUT — read these two together, they interact.

       SINGLE_SCREEN false  items are hidden until the respondent clicks Next.
       HIDE_STIMULUS false  the stimulus STAYS on screen after that click.

     That combination is the default and is the one you almost certainly want.
     The respondent reads the attribute table and the example pair, commits by
     clicking Next, and only then sees the questions — which appear BELOW the
     material, still fully visible. So there is still no memory demand (nothing
     has to be held in mind; the table is right there), but unlike a pure
     single-screen layout it yields `t_continue`: dwell on the stimulus before
     any question was visible. That is a clean reading-time measure, and it is
     not available when the items render immediately, because there the
     respondent can start answering before reading and the clock is polluted.

     SINGLE_SCREEN true   → no gate at all, items visible from load.
     HIDE_STIMULUS true   → withdraw the stimulus on Next, making it a memory
                            test rather than a comprehension test. Every item is
                            written to survive this, but it changes the
                            construct — see the note further down. */

  var SINGLE_SCREEN = false;  // false = gate the items behind a Next button
  var HIDE_STIMULUS = false;  // false = stimulus stays visible once items appear
  var SHUFFLE_ITEMS = false;  // false keeps the fixed filler/index interleave below
  var PASS_KEYS = ["meaning", "direction"];  // scope is the hard item; not in the criterion

  /* ---------------- fixed scale direction ----------------
     ONE DIRECTION, NOT RANDOMISED. Lower numbers mean a better neighborhood.
     This must match the direction used in the real choice tasks — the probe is
     a preamble, so whatever it states is what participants carry forward. Do
     not change it here without changing it there.

     Recorded in the data as a constant so the exported file documents which
     version respondents saw. */

  var direction = "higher_worse";
  var dirText = "Lower numbers mean a better-rated neighborhood.";

  /* ---------------- randomisation ---------------- */

  function coin() { return Math.random() < 0.5; }

  var highLeft = coin();   // does the high-index unit sit on the left?

  var HIGH_NI = 78;
  var LOW_NI = 34;

  /* ---------------- attribute preamble ----------------
     Eight attributes, one template, terse descriptions kept in a narrow length
     band. The index sits FIFTH — buried, and never first or last. */

  var ATTRIBUTES = [
    {
      key: "rent",
      name: "Monthly rent",
      body: "The range of base rents for one-bedroom units at the property, excluding " +
            "utilities."
    },
    {
      key: "deposit",
      name: "Deposit fee",
      body: "A one-time refundable amount paid when you sign. It is the same for every " +
            "unit at the property."
    },
    {
      key: "pet",
      name: "Pet fee",
      body: "A monthly charge added to the rent for each pet living in the unit."
    },
    {
      key: "size",
      name: "Apartment size",
      body: "The range of floor areas for one-bedroom units at the property, excluding " +
            "balconies."
    },
    {
      key: "ni",
      name: "Neighborhood Index",
      body: "A 0 to 100 rating of the area around the property, based on crime, noise " +
            "levels, transit access, and nearby amenities. " + dirText
    },
    {
      key: "age",
      name: "Year built",
      body: "The year the property was built, and whether it has been renovated since."
    },
    {
      key: "laundry",
      name: "Laundry",
      body: "Whether units have a washer and dryer inside, a shared laundry room on " +
            "site, or no laundry on site."
    },
    {
      key: "lease",
      name: "Lease term",
      body: "The lease lengths the property offers. You agree to rent for the full " +
            "term, and leaving early normally costs a fee."
    }
  ];

  /* ---------------- the two buildings ----------------
     THE INDEX CROSS-CUTS BUILDING QUALITY, DELIBERATELY. Marlow Court is the
     cheaper, older, less equipped building AND sits in the better-rated area
     (index 34, and lower is better). Deerfield Place is newer and better
     equipped AND sits in the worse-rated area (index 78). Neither alternative
     dominates, and — the point — general building quality does NOT predict the
     index in either direction.

     That matters because the alternative arrangement, where the nicer building
     also has the better area, would let a respondent answer index questions
     from "nicer building must be in a nicer neighborhood" without reading the
     definition at all. Crossing them means the index carries information no
     other attribute carries, which is the whole premise of putting it in the
     study.

     Lease is held constant across both, so the lease filler item cannot be
     answered by comparing the cards — it has to come from the preamble, like
     the other fillers. Card position is randomised independently of which
     building carries which index. */

  var BUILDINGS = {
    high: {                            // higher index = WORSE area under this scale
      key: "high",
      name: "Deerfield Apartments",
      addr: "88 Deerfield Court",
      price: "$1,540 – $1,690",
      priceNote: "per month",
      rows: [
        ["Deposit", "$800"],
        ["Pet fee", "$25/month per pet"],
        ["Apartment size", "760 – 840 sq ft"],
        ["Year built", "2015"],
        ["Laundry", "In unit (most units)"],
        ["Lease", "12 or 18 months"]
      ],
      ni: HIGH_NI
    },
    low: {                             // lower index = BETTER area under this scale
      key: "low",
      name: "Marlow Court Apartments and Townhouses",
      addr: "512 Marlow Street",
      price: "$1,380 – $1,520",
      priceNote: "per month",
      rows: [
        ["Deposit", "$1,200"],
        ["Pet fee", "$50/month per pet"],
        ["Apartment size", "580 – 660 sq ft"],
        ["Year built", "1968"],
        ["Laundry", "Shared room (all units)"],
        ["Lease", "12 or 18 months"]
      ],
      ni: LOW_NI
    }
  };

  var displayOrder = highLeft ? ["high", "low"] : ["low", "high"];

  /* ---------------- index items ----------------
     meaning   — what the attribute refers to. The critical distractor is the
                 BUILDING-level reading: an attribute of the building rather
                 than of the area around it. That confusion, not blank
                 ignorance, is the common failure mode for aggregate location
                 attributes, and it is sharper here than in an apartment-choice
                 frame — when the alternatives themselves ARE buildings, "a
                 rating attached to this building" is a very natural misreading.
     direction — application form ("which of these two is better") rather than
                 abstract form ("does higher mean better"). Application is
                 harder to satisfy by parroting the definition sentence and is
                 the form the attribute would actually be used in.
     scope     — the boundary item, and the one most changed by the shift to a
                 building-choice frame. It asks what a full renovation of a
                 building would do to its index. The answer — nothing much — is
                 stated verbatim nowhere and has to be derived from the fact
                 that the index is computed from the ADDRESS and describes the
                 surrounding area. The modelled error ("it would show a better
                 rating") is the building/area conflation, recorded as
                 `comp_scope_prior_error`.

                 The earlier version of this item asked whether two apartments
                 in one building share an index. That tested the same
                 underlying idea, but it no longer fits: when the alternatives
                 are buildings, a question about apartments inside a building is
                 a frame shift, and the within-building granularity it probed is
                 no longer the granularity the respondent is reasoning at. The
                 renovation form keeps the inference and matches the frame.

                 Harder than the other two and excluded from PASS_KEYS by
                 default; keep it as a graded comprehension measure. */

  var NI_ITEMS = [
    {
      key: "meaning",
      text: "What does the Neighborhood Index describe?",
      opts: [
        ["area",     "The area around the property — things like crime, noise, transit, and nearby amenities"],
        ["building", "The condition and features of the property itself"],
        ["rent",     "How much the rent has changed over the past year"],
        ["landlord", "How current tenants rated their landlord"]
      ],
      correct: "area"
    },
    {
      key: "direction",
      text: "One property has a Neighborhood Index of " + HIGH_NI + ". Another has " + LOW_NI +
            ". Which one is in the better-rated neighborhood?",
      opts: [
        ["high",  "The one with " + HIGH_NI],
        ["low",   "The one with " + LOW_NI],
        ["equal", "They are rated about the same"],
        ["cant",  "The index does not say which neighborhood is better"]
      ],
      correct: "low",
      priorError: "high"   // the school-grades prior: bigger number must be better
    },
    {
      key: "scope",
      text: "Suppose one of these properties were fully renovated, inside and out. " +
            "What would you expect to happen to its Neighborhood Index?",
      /* Three options, not four. "There is no way to tell" was removed because
         it is ambiguous in a way the other options are not: a respondent who
         understands the index perfectly can still read it as "it depends", so
         picking it is not evidence of misunderstanding and scoring it wrong is
         unfair. The cost is a 1/3 guess rate rather than 1/4 — acceptable,
         because an unfairly-keyed option damages the item more than a slightly
         higher floor does. */
      opts: [
        ["same",   "It would stay the same"],
        ["better", "It would show a better rating"],
        ["worse",  "It would show a worse rating"]
      ],
      correct: "same",
      priorError: "better"   // conflating the property with the area around it
    }
  ];

  /* ---------------- filler items ----------------
     Camouflage first, covariate second. Each is answerable from its own row in
     the preamble and from nothing else — in particular the lease item cannot be
     answered by comparing the two cards, because both carry the same term. They
     are deliberately easy: a filler that is hard would draw attention to itself
     and would also add noise to the general-attentiveness covariate. Scored
     into `filler_n_correct`, never into `passed`. */

  var FILLER_ITEMS = [
    {
      key: "rent",
      text: "The monthly rent shown for each property:",
      opts: [
        ["excl",    "Does not include utilities"],
        ["incl",    "Includes all utilities"],
        ["heat",    "Includes heat, but not electricity"],
        ["deposit", "Includes the deposit fee"]
      ],
      correct: "excl"
    },
    {
      key: "lease",
      text: "What does the lease term tell you?",
      opts: [
        ["months",  "How many months you agree to rent for"],
        ["listed",  "How long the property has been listed"],
        ["tenant",  "How long the current tenant has lived there"],
        ["notice",  "How much notice you must give before moving out"]
      ],
      correct: "months"
    },
    {
      key: "size",
      text: "The apartment size shown for each property measures:",
      opts: [
        ["inside",  "The floor area inside the unit"],
        ["shared",  "The floor area including shared hallways"],
        ["building","The total size of the property"],
        ["rooms",   "The number of rooms in the unit"]
      ],
      correct: "inside"
    }
  ];

  /* Fixed interleave: opens and closes on a filler, no two index items adjacent
     except scope/size at the tail. Set SHUFFLE_ITEMS true to randomise instead,
     which trades this guaranteed spacing for protection against order effects. */

  var ORDER = ["f:rent", "n:meaning", "f:lease", "n:direction", "n:scope", "f:size"];

  function byKey(list, k) {
    for (var i = 0; i < list.length; i++) if (list[i].key === k) return list[i];
    return null;
  }

  var ALL_ITEMS = ORDER.map(function (tag) {
    var kind = tag.charAt(0);
    var key = tag.slice(2);
    var item = kind === "n" ? byKey(NI_ITEMS, key) : byKey(FILLER_ITEMS, key);
    return { kind: kind === "n" ? "ni" : "filler", item: item };
  });

  if (SHUFFLE_ITEMS) {
    for (var s = ALL_ITEMS.length - 1; s > 0; s--) {
      var sj = Math.floor(Math.random() * (s + 1));
      var st = ALL_ITEMS[s]; ALL_ITEMS[s] = ALL_ITEMS[sj]; ALL_ITEMS[sj] = st;
    }
  }

  function fieldFor(entry) {
    return (entry.kind === "ni" ? "comp_" : "filler_") + entry.item.key;
  }

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    direction: direction,                 // constant, not a factor: "higher_worse"
    high_index_left: highLeft ? 1 : 0,
    ni_high: HIGH_NI,
    ni_low: LOW_NI,
    layout: SINGLE_SCREEN ? "single_screen"
          : (HIDE_STIMULUS ? "gated_hidden" : "gated_covisible"),
    item_order: ALL_ITEMS.map(function (e) { return fieldFor(e); }).join(","),
    n_items: ALL_ITEMS.length,

    t_continue: null,                     // sequential mode: dwell before the items appear
    stimulus_hidden: (!SINGLE_SCREEN && HIDE_STIMULUS) ? 1 : 0,

    n_answered: 0,
    answer_changes: 0,

    /* --- index items: THE MEASUREMENT --- */
    comp_n_correct: 0,                    // 0-3, index items only
    comp_n_correct_first: 0,              // first-pass accuracy, before revisions
    passed: null,                         // meaning AND direction correct

    /* --- fillers: covariate, never part of `passed` --- */
    filler_n_correct: 0,

    t_first_answer: null,
    t_comp_done: null
  };

  /* per-item fields are generated from the item lists, so the exported schema
     always matches whatever is actually asked */
  ALL_ITEMS.forEach(function (e) {
    var f = fieldFor(e);
    state[f] = null;
    state[f + "_first"] = null;
    state[f + "_correct"] = null;
    if (e.item.priorError) state[f + "_prior_error"] = null;
  });
  /* ---------------- stimulus ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>Imagine you are looking for a one-bedroom apartment and are deciding which ' +
    'rental property to live in. In the tasks that follow you will be shown pairs ' +
    'of properties and asked which one you would prefer.</p>' +
    '<p>Every property listing includes the following attributes:</p>';

  document.getElementById("attrlist").innerHTML =
    '<table class="attrtable"><thead><tr>' +
      '<th scope="col">Attribute</th><th scope="col">Description</th>' +
    '</tr></thead><tbody>' +
    ATTRIBUTES.map(function (a) {
      return '<tr class="attr" data-attr="' + a.key + '">' +
               '<td class="an">' + a.name + '</td>' +
               '<td class="ad"><span class="attrbody">' + a.body + '</span></td>' +
             '</tr>';
    }).join("") +
    '</tbody></table>';

  document.getElementById("exampleLead").innerHTML =
    '<p style="margin-top:18px">Here is an example of a pair of properties.</p>';

  function rows(pairs) {
    return pairs.map(function (p) {
      return '<div class="prow"><span class="plab">' + p[0] +
             '</span><span class="pval">' + p[1] + '</span></div>';
    }).join("");
  }

  document.getElementById("units").innerHTML = displayOrder.map(function (k) {
    var u = BUILDINGS[k];
    return '<div class="card" data-unit="' + k + '">' +
             '<p class="name">' + u.name + '</p>' +
             '<p class="addr">' + u.addr + '</p>' +
             '<div class="price">' + u.price + ' <span>' + u.priceNote + '</span></div>' +
             '<div style="margin-top:8px">' + rows(u.rows) +
               '<div class="prow"><span class="nilab">Neighborhood Index</span>' +
               '<span class="pval">' + u.ni + ' / 100</span></div>' +
             '</div>' +
           '</div>';
  }).join("");

  /* ---------------- items appear ----------------
     Single-screen: rendered immediately, below the listings, with the Continue
     step removed entirely — the respondent never leaves the page holding the
     preamble. Sequential: gated behind Continue, which also yields a dwell
     measure the single-screen layout does not have. */

  if (SINGLE_SCREEN) {
    // showComprehension() closes over vars declared below, so the call itself
    // is made at the end of the IIFE; only the Continue step is removed here.
    document.getElementById("continueWrap").style.display = "none";
  } else {
    document.getElementById("continueBtn").addEventListener("click", function () {
      state.t_continue = Date.now() - t0;
      if (HIDE_STIMULUS) {
        document.getElementById("stimulus").style.display = "none";
      } else {
        // the gate has served its purpose; leaving a dead button on screen
        // beside the questions invites a second click and looks broken
        document.getElementById("continueWrap").style.display = "none";
      }
      showComprehension();
      report();
      reportHeight();
      window.scrollTo(0, document.body.scrollHeight);
    });
  }

  /* ---------------- comprehension block ---------------- */

  var compEl = document.getElementById("comp");
  var compShown = false;

  function showComprehension() {
    if (compShown) return;
    compShown = true;

    compEl.innerHTML =
      '<p class="compintro">' +
        'To be sure you understand the content that will be presented in the subsequent ' +
        'choice tasks, we will ask you a few questions before proceeding.' +
      '</p>' +
      ALL_ITEMS.map(function (entry) {
        var q = entry.item;
        return '<div class="compq" data-q="' + fieldFor(entry) + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="opts">' + q.opts.map(function (o) {
                   return '<button type="button" class="opt" data-val="' + o[0] + '">' +
                          o[1] + '</button>';
                 }).join("") + '</div>' +
               '</div>';
      }).join("");
    compEl.classList.add("open");
    // the rule above the items separates them from the stimulus, so it is
    // wanted whenever the stimulus is still on screen — not only when the
    // items rendered with it at load
    if (SINGLE_SCREEN || !HIDE_STIMULUS) compEl.classList.add("inline");
  }

  compEl.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var block = opt.closest(".compq");
    var field = block.getAttribute("data-q");
    var val = opt.getAttribute("data-val");
    var prev = state[field];

    if (prev !== null && prev !== val) state.answer_changes += 1;
    if (state[field + "_first"] === null) state[field + "_first"] = val;

    block.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("picked", b === opt);
    });
    state[field] = val;

    if (state.t_first_answer === null) state.t_first_answer = Date.now() - t0;

    var answered = 0, niCorrect = 0, niCorrectFirst = 0, fillerCorrect = 0;
    ALL_ITEMS.forEach(function (entry) {
      var f = fieldFor(entry);
      var a = state[f];
      var first = state[f + "_first"];
      state[f + "_correct"] = a === null ? null : (a === entry.item.correct ? 1 : 0);
      if (entry.item.priorError) {
        state[f + "_prior_error"] = a === null ? null : (a === entry.item.priorError ? 1 : 0);
      }
      if (a !== null) {
        answered += 1;
        if (a === entry.item.correct) {
          if (entry.kind === "ni") niCorrect += 1; else fillerCorrect += 1;
        }
      }
      if (entry.kind === "ni" && first !== null && first === entry.item.correct) {
        niCorrectFirst += 1;
      }
    });
    state.n_answered = answered;
    state.comp_n_correct = niCorrect;
    state.comp_n_correct_first = niCorrectFirst;
    state.filler_n_correct = fillerCorrect;

    if (answered === ALL_ITEMS.length) {
      state.t_comp_done = Date.now() - t0;
      state.passed = PASS_KEYS.every(function (k) {
        return state["comp_" + k + "_correct"] === 1;
      }) ? 1 : 0;
    }

    report();
    reportHeight();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  if (SINGLE_SCREEN) showComprehension();

  report();
  reportHeight();
})();
</script>
</body>
</html>
