<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Preferences</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  #scenario { margin: 0 0 18px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }
  #scenario ul { margin: 0 0 11px; padding-left: 20px; }
  #scenario li { margin-bottom: 4px; }

  .cat { padding: 14px 0; border-top: 1px solid #eceef0; }
  .cat:first-of-type { border-top: 1px solid #e6e8eb; }
  .catname {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: #737b82; margin: 0 0 9px;
  }
  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 11px 12px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 13.5px; font-weight: 600; margin: 0 0 4px; }
  .odesc { font-size: 12.5px; color: #4a5158; margin: 0; }

  .foot {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid #e6e8eb;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .count { font-size: 13px; color: #737b82; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 22px; border-radius: 5px;
    border: 1px solid #2f6fb0; background: #2f6fb0; color: #fff; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { background: #275e97; }
  .navbtn:disabled { background: #b7c9db; border-color: #b7c9db; cursor: default; }

  #done { display: none; margin-top: 14px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="scenario"></div>
  <div id="cats"></div>
  <div class="foot">
    <span class="count" id="counter"></span>
    <button type="button" class="navbtn" id="doneBtn">Done</button>
  </div>
  <div id="done">Your answers have been recorded. Please continue.</div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE — PHASE 1 OF 2 (BOX FOR YOURSELF)

     Elicits the participant's OWN preferences across six categories. Nothing
     here is scored and nothing mentions choosing for anyone else. It reads as
     an ordinary build-your-own promotion, which is what it should look like.

     THE TWO PHASES NO LONGER SHARE A COVER STORY. An earlier version framed
     this half as a build-your-own box promotion, on the reasoning that an
     identical framing gives phase 2 a natural licence to repeat: you are filling
     a second box, not answering the same question twice.

     That reasoning traded concealment for licence, and the trade was a bad one.
     Phase 2 prints Sam's preferences on screen, so a participant who recognises
     the parallel gains nothing they need — but they do gain the inference that
     the study is comparing what they chose for themselves against what they
     choose for Sam. That inference IS the manipulation, and once it is made,
     demand characteristics push toward hyper-adoption, inflating the very
     measure the probe exists to take. A shared cover story licenses the
     repetition without concealing the comparison.

     So this half is now ordinary survey furniture — a short preference block
     with no shop, no box, and nothing to assemble — on the same principle as the
     relocation circumstances block. Phase 2 keeps the care-package framing.

     CATEGORY LABELS DIVERGE BETWEEN THE PHASES, and this matters more than the
     products do. Both files previously used the same six phrases — "Something to
     eat", "Something to drink" and so on — which is a distinctive scaffold and
     the most recognisable thing in either task. Changing the products while
     leaving that intact concealed very little. Phase 1 now uses plain category
     names; phase 2 keeps the "Something to ..." set.

     THE IDS STILL HAVE TO MATCH EXACTLY, along with which side of each dimension
     x and y sit on. Labels are display only. Changing an id here silently
     misaligns the tailoring in care-package-friend.html.

     FOUR DIAGNOSTIC CATEGORIES, TWO DECOYS. Phase 2 states the friend's
     preferences for only four of the six categories. The other two carry no
     guidance at all and are never scored — so a third of the choices have no
     right answer, which is what keeps the task from reading as graded
     throughout. Own-choices on the decoys are still recorded: they give a
     baseline projection rate against which behaviour on the guided categories
     can be compared.

     THE PRODUCTS DIFFER FROM PHASE 2 ON PURPOSE, so that a participant does not
     recognise the later task as this one repeated. What must stay aligned is
     the CATEGORY IDS and the DIMENSION each category encodes, with x and y on
     the same side of that dimension in both files:

       eat       x = familiar flavour     y = novel flavour
       drink     x = one good thing       y = a variety
       comfort   x = practical            y = indulgent
       activity  x = alone                y = with someone

     Changing an id, or flipping which side x and y sit on, WILL silently
     misalign the tailoring in care-package-friend.html.

     FOUR FILLER PAIRS SIT AMONG THE LIVE SIX. Without them this block is a
     one-to-one map of the care package: every pair answered here comes back
     later with the same category and different products, and perfect
     correspondence is itself a signature. Four of the ten pairs answered here
     now have no counterpart in phase 2 at all. They are never piped and
     never scored. Same device as the fillers in the relocation circumstances
     block, and the same reason.

     HANDOFF. The field to pipe forward is `self_map`, formatted as
       eat:x,drink:y,comfort:x,activity:y,read:x,extra:y
     ------------------------------------------------------------------ */

  var PROBE_ID = "BOX_SELF";

  var CATEGORIES = [
    { id: "eat", label: "Chocolates", role: "diagnostic",
      x: { kind: "x", name: "Classic chocolate assortment", desc: "Familiar flavours, traditional box" },
      y: { kind: "y", name: "Unusual flavour selection",    desc: "Chilli, miso and other uncommon pairings" } },

    { id: "drink", label: "Tea", role: "diagnostic",
      x: { kind: "x", name: "One tin of single-origin tea", desc: "A larger tin of one carefully sourced leaf" },
      y: { kind: "y", name: "Sampler of twelve sachets",    desc: "Twelve different blends, one of each" } },

    { id: "comfort", label: "Around the house", role: "diagnostic",
      x: { kind: "x", name: "Thick wool socks",  desc: "Hard-wearing, warm, plain grey" },
      y: { kind: "y", name: "Scented candle",    desc: "Hand-poured, cedar and orange" } },

    { id: "activity", label: "Games and puzzles", role: "diagnostic",
      x: { kind: "x", name: "Crossword book",     desc: "A hundred puzzles, graded by difficulty" },
      y: { kind: "y", name: "Card game for two",  desc: "Quick rounds, plays in twenty minutes" } },

    /* Decoys: no stated preference in phase 2, never scored. */
    { id: "read", label: "Books", role: "decoy",
      x: { kind: "x", name: "Short story collection", desc: "Twelve stories by different authors" },
      y: { kind: "y", name: "Nature photography book", desc: "Large-format landscape photography" } },

    { id: "extra", label: "Stationery", role: "decoy",
      x: { kind: "x", name: "Set of fine-tip pens", desc: "Four pens in black and blue" },
      y: { kind: "y", name: "Pocket notebook",      desc: "Cloth-bound, ruled, fits in a jacket" } },

    /* FILLERS. Never piped, never scored, and no counterpart in phase 2 — their
       ids appear in no category list there, so nothing downstream can reference
       them. They exist to break the one-to-one correspondence between this
       block and the care package: four of the ten pairs a participant answers
       here never reappear.

       THEY ARE DELIBERATELY NOT GIFTABLE SMALL TREATS. The six live pairs are
       chocolates, tea, socks, a candle, a puzzle book and pens — a set that
       reads as the contents of a box even with no box around it. Bags,
       headphones, a watch and wall art pull the block back toward a general
       consumer preference battery, which is what it is now supposed to look
       like. Earlier drafts also had plants and toiletries; both were dropped
       when the count came down, because cut flowers and hand cream are the two
       things here a participant would most readily picture inside a care
       package, and a filler that reads as care-package contents does half its
       job at best.

       Adding or removing fillers is safe. Touching the six live ids is not. */
    { id: "f_bag", label: "Bags", role: "filler",
      x: { kind: "x", name: "Canvas tote",    desc: "Plain, unlined, folds flat" },
      y: { kind: "y", name: "Leather satchel", desc: "Structured, buckled flap" } },

    { id: "f_audio", label: "Listening", role: "filler",
      x: { kind: "x", name: "Over-ear headphones", desc: "Padded, wired, folds for travel" },
      y: { kind: "y", name: "Portable speaker",    desc: "Palm-sized, rechargeable" } },

    { id: "f_watch", label: "Watches", role: "filler",
      x: { kind: "x", name: "Simple analog watch", desc: "Plain face, leather strap" },
      y: { kind: "y", name: "Fitness tracker",     desc: "Step count, sleep, silicone band" } },

    { id: "f_art", label: "Wall art", role: "filler",
      x: { kind: "x", name: "Framed photograph", desc: "Black and white, simple frame" },
      y: { kind: "y", name: "Woven wall hanging", desc: "Undyed cotton, hung from a dowel" } }
  ];

  /* The six the handoff is built from. Everything else on screen is camouflage. */
  var LIVE = CATEGORIES.filter(function (c) { return c.role !== "filler"; });

  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  var order = shuffle(CATEGORIES);
  var N = order.length;
  var sideOrder = order.map(function () { return coin(); });

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    category_order: order.map(function (c) { return c.id; }).join(","),
    side_order: sideOrder.map(function (v) { return v ? "x" : "y"; }).join(","),
    self_map: null,        // "eat:x,drink:y,..." — the LIVE SIX; pipe this to phase 2
    filler_map: null,      // recorded, read by nothing
    n_answered: 0,         // all twelve pairs
    n_answered_live: 0,    // the six that matter
    t_first_interaction: null,
    t_last_choice: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  document.getElementById("scenario").innerHTML =
    '<p>Before we get to the main part of the study, we would like to know a ' +
    'little about your own tastes.</p>' +
    '<p>For each pair below, choose the option you would prefer.</p>';

  function optCard(o) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + o.name + '</p>' +
             '<p class="odesc">' + o.desc + '</p>' +
           '</div>';
  }

  document.getElementById("cats").innerHTML = order.map(function (c, i) {
    var first = sideOrder[i] ? c.x : c.y;
    var second = sideOrder[i] ? c.y : c.x;
    return '<div class="cat" data-cat="' + c.id + '">' +
             '<p class="catname">' + c.label + '</p>' +
             '<div class="opts2">' + optCard(first) + optCard(second) + '</div>' +
           '</div>';
  }).join("");

  var picks = {};
  var doneBtn = document.getElementById("doneBtn");

  function refresh() {
    var n = 0;
    order.forEach(function (c) { if (picks[c.id]) n += 1; });
    state.n_answered = n;
    /* self_map carries the LIVE SIX ONLY, so phase 2's contract is unchanged by
       the fillers. Phase 2 would ignore unknown ids anyway — it iterates its own
       category list — but a handoff that silently carried six ids nothing reads
       is an invitation to misread the data later. Filler answers are recorded
       separately, the way the relocation block keeps chain_qs and
       filler_answers apart. */
    state.self_map = LIVE.map(function (c) {
      return c.id + ":" + (picks[c.id] || "");
    }).join(",");
    state.n_answered_live = LIVE.reduce(function (k, c) {
      return k + (picks[c.id] ? 1 : 0);
    }, 0);
    state.filler_map = CATEGORIES.filter(function (c) { return c.role === "filler"; })
      .map(function (c) { return c.id + ":" + (picks[c.id] || ""); }).join(",");
    document.getElementById("counter").textContent = n + " of " + N + " chosen";
    doneBtn.disabled = n < N;
    reportHeight();
  }

  document.getElementById("cats").addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;
    markInteraction();
    var cat = card.closest(".cat");
    cat.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[cat.getAttribute("data-cat")] = card.getAttribute("data-kind");
    state.t_last_choice = Date.now() - t0;
    refresh();
    report();
  });

  doneBtn.addEventListener("click", function () {
    if (doneBtn.disabled) return;
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    doneBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  refresh();
  report();
  reportHeight();
})();
</script>
</body>
</html>
