<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appliance Choices</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .tname { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .orow { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  .olab { flex: 0 0 108px; color: #737b82; }
  .oval { color: #1f2328; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scenario"></div>

  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>

  <div id="done">Your answers have been recorded. Please continue.</div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE

     Tests whether a participant can generate judgments from an assigned
     standpoint rather than their own. Their own orientation is measured
     upstream by the pump preference task: choosing the efficient pump implies
     an environmental orientation, choosing the basic pump implies an
     upfront-price orientation.

     CONGRUENCE IS THE DESIGN. Assigning a goal that matches the participant's
     own orientation cannot test adoption — they would answer consistently by
     doing what they would do anyway. Assigning only incongruent goals cannot
     separate adoption from noise, because there is no baseline. Both cells are
     needed, so assignment is CROSSED with measured orientation by default.

     FIRST-PERSON FRAMING, SITUATIONAL GOALS. Participants imagine holding the
     goal themselves, which is the stricter reading of perspective adoption.
     Both goals are framed as situations rather than dispositions — a budget
     already committed, or an efficiency target already set — because "you are
     someone who values price" is an identity claim a participant can reject,
     and rejection would be indistinguishable from failure to adopt.

     Interpretively: a response generated from the participant's own standpoint
     rather than the assigned one is a perspective-adoption failure whether the
     cause was could-not or would-not. The probe cannot separate those.

     FOUR DIAGNOSTIC TRIALS. In each, the two goals point to different options.
     Necessarily, the cheaper option is the less efficient one — that confound
     is what makes a trial discriminate between standpoints at all.

     KNOWN LIMITATION. Because every trial has this structure, "always pick the
     expensive one" is learnable after a single item and produces a perfect
     environmental-goal score without reading anything. n_own_goal_consistent
     and the congruent/incongruent contrast still identify participants who
     answered by their own orientation throughout, and trial_dwell catches
     participants moving too fast to have read. But a rule-follower who happens
     to match the assigned goal is not separable here.

     DISTRACTOR ATTRIBUTES. Colour and controls vary across options and are
     irrelevant to both goals. They keep the choice from reducing to a
     two-number comparison, and are balanced so neither systematically favours
     the goal-consistent option.

     ONE ITEM PER SCREEN. Items advance in a horizontal carousel while the
     scenario stays fixed above, so the assigned standpoint is continuously
     available and the task never becomes a memory test.

     NO GATED INFORMATION. All attributes are visible. This probe targets
     standpoint, not acquisition; gating would confound the two links.

     GOAL SOURCE. Reads `goal` from the query string, e.g.
       goal-perspective-task.html?goal=environmental&own=price
     In Qualtrics, pipe embedded data into the iframe src. If `goal` is absent
     it is derived from `own` using ASSIGNMENT_MODE; if both are absent it is
     randomised, so the file is testable standalone.
     ------------------------------------------------------------------ */

  var PROBE_ID = "GOAL_PERSP";

  // "crossed" — random assignment, yielding both congruent and incongruent
  // "incongruent" — always the goal opposite the participant's own
  // "congruent" — always the participant's own goal
  var ASSIGNMENT_MODE = "crossed";

  var BRIEFS = {
    price: "A large unexpected expense a few months ago has left you with very " +
           "little room this year, and whatever you spend has to come out of a " +
           "fixed budget you have already set. What matters to you here is " +
           "keeping the purchase price as low as you can.",
    environmental: "You are committed to cutting your household's energy use " +
           "this year, and you expect to keep these appliances for a long time. " +
           "What matters to you here is keeping energy use as low as you can."
  };

  /* kinds: "price" = the option a price goal favours, "env" = the option an
     energy goal favours. Colour and controls are distractors. */
  var TRIALS = [
    { item: "Dishwasher",
      a: { kind: "price", buy: "$420", energy: "320 kWh per year",
           run: "About $51 per year", color: "White", controls: "Dial controls" },
      b: { kind: "env",   buy: "$680", energy: "180 kWh per year",
           run: "About $29 per year", color: "Stainless steel", controls: "Digital display" } },

    { item: "Water heater",
      a: { kind: "price", buy: "$650", energy: "4,100 kWh per year",
           run: "About $656 per year", color: "Slate", controls: "Digital display" },
      b: { kind: "env",   buy: "$1,150", energy: "2,200 kWh per year",
           run: "About $352 per year", color: "White", controls: "Dial controls" } },

    { item: "Washing machine",
      a: { kind: "price", buy: "$530", energy: "210 kWh per year",
           run: "About $34 per year", color: "Stainless steel", controls: "Touch panel" },
      b: { kind: "env",   buy: "$840", energy: "95 kWh per year",
           run: "About $15 per year", color: "White", controls: "Push-button" } },

    { item: "Refrigerator",
      a: { kind: "price", buy: "$780", energy: "590 kWh per year",
           run: "About $94 per year", color: "Black", controls: "Push-button" },
      b: { kind: "env",   buy: "$1,240", energy: "340 kWh per year",
           run: "About $54 per year", color: "Slate", controls: "Touch panel" } }
  ];

  /* ---------------- goal assignment ---------------- */

  function qparam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function coin() { return Math.random() < 0.5; }
  function flip(g) { return g === "price" ? "environmental" : "price"; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  var ownGoal = qparam("own");
  if (ownGoal !== "price" && ownGoal !== "environmental") ownGoal = null;

  var assignedGoal = qparam("goal");
  if (assignedGoal !== "price" && assignedGoal !== "environmental") {
    if (ownGoal && ASSIGNMENT_MODE === "incongruent")    assignedGoal = flip(ownGoal);
    else if (ownGoal && ASSIGNMENT_MODE === "congruent") assignedGoal = ownGoal;
    else assignedGoal = coin() ? "price" : "environmental";
  }

  var congruent = ownGoal === null ? null : (assignedGoal === ownGoal ? 1 : 0);

  // Item order randomised per participant.
  var order = shuffle(TRIALS);

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    assigned_goal: assignedGoal,
    own_goal: ownGoal,
    congruent: congruent,
    goal_source: qparam("goal") ? "url" : (ownGoal ? ASSIGNMENT_MODE : "random"),
    item_order: order.map(function (t) { return t.item; }).join(","),
    side_order: null,
    choices: null,                // kind chosen, in presentation order
    n_goal_consistent: 0,         // 0-4 — the perspective-adoption score
    n_own_goal_consistent: 0,     // 0-4 — answered per their OWN orientation
    n_answered: 0,
    trial_dwell: null,
    n_back: 0,
    max_item_reached: 0,
    t_first_interaction: null,
    t_last_choice: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>Imagine that you are replacing several appliances in your home this year. ' +
    BRIEFS[assignedGoal] + '</p>' +
    '<p>For each item, choose the model you would prefer.</p>';

  /* ---------------- render ---------------- */

  var sideOrder = order.map(function () { return coin(); });   // true = a first
  state.side_order = sideOrder.map(function (x) { return x ? "a" : "b"; }).join(",");

  /* Labels are POSITIONAL: Model A is whichever option is shown first, Model B
     second. Since side order is already randomised per item, the letters carry
     no information about which option a given goal favours. Scoring keys on
     data-kind, never on the label; side_order records the mapping. */
  function optCard(o, label) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + label + '</p>' +
             '<div class="orow"><span class="olab">Purchase price</span><span class="oval">' + o.buy + '</span></div>' +
             '<div class="orow"><span class="olab">Energy use</span><span class="oval">' + o.energy + '</span></div>' +
             '<div class="orow"><span class="olab">Running cost</span><span class="oval">' + o.run + '</span></div>' +
             '<div class="orow"><span class="olab">Color</span><span class="oval">' + o.color + '</span></div>' +
             '<div class="orow"><span class="olab">Controls</span><span class="oval">' + o.controls + '</span></div>' +
           '</div>';
  }

  document.getElementById("track").innerHTML = order.map(function (tr, i) {
    var first = sideOrder[i] ? tr.a : tr.b;
    var second = sideOrder[i] ? tr.b : tr.a;
    return '<div class="slide" data-trial="' + i + '">' +
             '<p class="tname">' + tr.item + '</p>' +
             '<div class="opts2">' + optCard(first, "Model A") + optCard(second, "Model B") + '</div>' +
           '</div>';
  }).join("");

  document.getElementById("dots").innerHTML =
    order.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(order.length).fill(null);
  var dwell = new Array(order.length).fill(0);
  var index = 0;
  var enteredAt = Date.now();

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    document.getElementById("counter").textContent =
      "Item " + (index + 1) + " of " + order.length;
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && picks[i] !== null);
    });
    backBtn.disabled = index === 0;
    nextBtn.disabled = picks[index] === null;
    nextBtn.textContent = index === order.length - 1 ? "Done" : "Next";
    if (index > state.max_item_reached) state.max_item_reached = index;
    reportHeight();
  }

  function goTo(i) {
    accrue(); index = i; enteredAt = Date.now(); render(); report();
  }

  backBtn.addEventListener("click", function () {
    if (index === 0) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < order.length - 1) { goTo(index + 1); return; }
    accrue();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;

    markInteraction();
    var slide = card.closest(".slide");
    var idx = parseInt(slide.getAttribute("data-trial"), 10);

    slide.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[idx] = card.getAttribute("data-kind");

    var wantAssigned = assignedGoal === "price" ? "price" : "env";
    var wantOwn = ownGoal === null ? null : (ownGoal === "price" ? "price" : "env");
    var answered = 0, consistent = 0, ownConsistent = 0;

    picks.forEach(function (p) {
      if (p === null) return;
      answered += 1;
      if (p === wantAssigned) consistent += 1;
      if (wantOwn !== null && p === wantOwn) ownConsistent += 1;
    });

    state.choices = picks.join(",");
    state.n_answered = answered;
    state.n_goal_consistent = consistent;
    state.n_own_goal_consistent = ownConsistent;
    state.t_last_choice = Date.now() - t0;

    render();
    report();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
