<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment Purchasing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .tname { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  .tsub { font-size: 12.5px; color: #737b82; margin: 0 0 12px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .orow { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  .olab { flex: 0 0 106px; color: #737b82; }
  .oval { color: #1f2328; }

  .fq { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
  .fopts { display: flex; flex-direction: column; gap: 8px; }
  .fopt {
    font-family: inherit; font-size: 14px; text-align: left;
    padding: 10px 13px; border-radius: 6px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .fopt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .fopt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .ftext {
    font-family: inherit; font-size: 14px; line-height: 1.5; color: #1f2328;
    width: 100%; min-height: 78px; padding: 9px 11px; resize: vertical;
    border: 1px solid #c8ced4; border-radius: 6px; background: #fff;
  }
  .ftext:focus { outline: none; border-color: #2f6fb0; }
  .fnote { font-size: 12.5px; color: #737b82; margin: 8px 0 0; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scenario"></div>

  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>

  <div id="done">Your answers have been recorded. Please continue.</div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     COMPLIANCE-THRESHOLD PROBE — COST TITRATION

     WHAT THIS MEASURES THAT THE OTHER PROBES DO NOT. Every other perspective
     probe in this set scores adoption as a count out of four: did the choice
     match the assigned standpoint. That is a binary applied at a single, fixed
     cost of complying — the goal-consistent option is simply the worse one on
     the other dimension, by roughly the same amount each time. A count of four
     such items tells you WHETHER someone complied, never HOW MUCH they would
     give up to do so.

     Willingness is a threshold, not a state. This probe measures where it sits.

     THE DESIGN. An objective is assigned as company policy with exactly one
     referent — lower purchase price, or lower ten-year cost. Across the
     titration items the objective-consistent option is progressively slower to
     arrive, from one week behind the alternative up to thirteen. The scenario
     makes delay genuinely costly (rented equipment covering a late opening,
     charged to the participant's own budget) without ever telling the
     participant to minimise lead time. The point at which they stop obeying is
     the measure.

     WHY LEAD TIME IS NOT THE SECOND CRITERION THAT ROLE-BUYER REJECTED. An
     earlier version of the role probe added a project deadline so that lead
     time would pull against the objective, and it was removed because
     participants then had two things to satisfy at once and "goal-consistent"
     became ambiguous. That objection does not apply here. Lead time is not a
     goal — nothing asks the participant to minimise it, and the objective still
     has exactly one referent on every item. Lead time is a COST attached to
     obeying, which is what makes obedience gradable rather than binary.

     WHY A NEUTRAL ATTRIBUTE RATHER THAN PRICE. Titrating on price cannot work
     across both conditions: under the upfront objective the compliant option IS
     the cheap one, so there is nothing to escalate. Lead time is irrelevant to
     both objectives and escalates identically in both cells, which is what
     makes the congruent and incongruent thresholds comparable numbers.

     THREE ANCHOR ITEMS, AND WHY THEY MATTER TWICE. On three of the nine items
     the objective-consistent option arrives SOONER than the alternative, or at
     the same time. They contribute nothing to the threshold, and they buy two
     separate things:

       1. A FLOOR CHECK. When obeying is free, nearly everyone should obey.
          n_compliant_anchors below 2 means the participant was not tracking the
          objective at all — a different failure from defecting under cost, and
          one that must not be scored as low willingness.

       2. THEY BREAK THE HEURISTIC. The goal probe's header flags "always pick
          the expensive one" as a strategy that earns a perfect adoption score
          without reading anything. Here, if lead time were perfectly confounded
          with compliance, "always pick the slower one" would score 6/6. The
          anchors invert the correlation, so that strategy scores 6/6 on
          titration and 0/3 on anchors, while a genuine adopter scores high on
          both. n_picked_longer_lead is logged for the same reason.

     ITEM ORDER IS RANDOMISED, NOT ASCENDING. A visible staircase is the single
     biggest tell that a task is titrating something. With order randomised the
     threshold cannot be read off a literal switch point, so it is FITTED: the
     cut that best separates complied-below from defected-above, with the number
     of misclassifications reported alongside as a monotonicity check. Slight
     loss of precision, large gain in how the set reads.

     THE MONEY CONTRAST IS HELD ROUGHLY CONSTANT across all nine items — the
     cheaper-to-buy option is about 35-40% cheaper up front, the cheaper-to-own
     option about 20-25% cheaper over ten years, on every item. This is load
     bearing. If the money gap varied as well, two things would be titrating at
     once and the threshold would not be interpretable in weeks.

     PLAUSIBILITY CAPS THE LADDER. Sixteen weeks on made-to-order commercial
     refrigeration is realistic; six months is not. Participants who never
     defect inside that range are RIGHT-CENSORED — `censored` is set, and they
     must be handled as censored observations rather than assigned the top rung
     as a score.

     THE OBJECTIVE CHECK, AND WHAT IT IS NOT. A four-option item after the
     choices asks what purchasing was told to take. It is NOT a recall item.
     The scenario block sits above the carousel and is never withdrawn, so the
     objective is ON SCREEN while the check is answered. That is deliberate, and
     it follows the rules-comprehension probe, which keeps the rules co-visible
     precisely so that retention failures are not scored as comprehension
     failures. It is placed after the choices, never before, because asking
     first would raise the objective's salience for the choices themselves.

     What it buys is a FLOOR CHECK. Getting it wrong with the answer visible
     directly above means the participant was not reading the screen at all.
     Crossed with compliance:

                          check passed        check failed
       obeyed             adopted             coincidence
       did not obey       DECLINED            disengaged

     BE PRECISE ABOUT THE DECLINED CELL. It means the objective was available
     and legible and was not followed. It does NOT cleanly separate "encoded it
     and chose otherwise" from "never attended to it", because a participant can
     ignore the banner across nine items and then read it to answer the check.
     What it does rule out is could-not-understand, which is one of the two
     confounds the goal probe's header names — not both.

     Two other fields narrow what is left. trial_dwell catches participants
     moving too fast to have read anything, and n_compliant_anchors catches
     participants who were not tracking the objective even when obeying cost
     nothing. A DECLINED cell with ordinary dwell and 3/3 on the anchors is the
     strongest unwillingness evidence this design produces. Report it that way
     rather than as a clean would-not.

     WITHDRAWING THE OBJECTIVE would make the check genuine recall and would
     separate never-encoded from declined. It would also reintroduce exactly the
     memory confound the rules probe removed on purpose, and score forgetting as
     unwillingness. HIDE_OBJECTIVE_AT_CHECK takes that trade; it is off.

     LEAD TIME IS OFFERED AS A DISTRACTOR OPTION. It is the attribute that
     visibly varied most, so choosing it identifies participants answering from
     their own behaviour rather than from the screen.

     BACK IS SEALED at the check boundary, so choices cannot be revised once the
     check has been seen.

     THE SUSPICION ITEM is free text and optional. Test register is the standing
     worry about this whole battery; this makes it a covariate rather than a
     guess. Worth copying into the other probes.

     ALL ATTRIBUTES ARE VISIBLE. Supplier and finish are pure distractors,
     balanced so neither systematically favours the compliant option. Gating
     anything would confound this with acquisition.

     PARAMETER MAPPING. Reads `goal` and `own` from the query string as
     price|environmental (pump-task vocabulary) or upfront|longrun, e.g.
       cost-titration-task.html?goal=longrun&own=price
     If `goal` is absent it is derived from `own` via ASSIGNMENT_MODE; if both
     are absent it is randomised, so the file is testable standalone — but such
     a record must not be treated as real data.
     ------------------------------------------------------------------ */

  var PROBE_ID = "COST_TITRATE";

  // "crossed" — random assignment, yielding both congruent and incongruent
  // "incongruent" — always the objective opposite the participant's own
  // "congruent" — always matching the participant's own orientation
  var ASSIGNMENT_MODE = "crossed";

  /* The objective stays on screen during the check by default — see the
     header. Set true to withdraw it, which makes the check a genuine recall
     item and accepts the memory confound that comes with it. */
  var HIDE_OBJECTIVE_AT_CHECK = false;

  /* The delay cost is established as a situational fact, NOT as a second
     objective. Nothing here asks the participant to keep lead times short. */
  var PREAMBLE =
    "Imagine that you handle equipment purchasing for a caf&eacute; group " +
    "opening five new sites this year. The sites open on a rolling schedule, " +
    "and anything that has not arrived by opening day has to be covered with " +
    "short-term rentals, which is a nuisance for the site managers and comes " +
    "out of your own budget.";

  /* Objectives embedded in prose rather than set apart as an instruction. Both
     rest on an institutional reason and are symmetric with each other.
     Deliberately worded differently from role-buyer-task.html, which uses a
     cash-ahead-of-expansion story and a replaced-fittings story. */
  var OBJECTIVES = {
    upfront:
      "The group's lender caps capital spend per site until the new locations " +
      "are trading, so purchasing has been asked to take the lower purchase " +
      "price wherever options differ.",
    longrun:
      "The group's finance team costs equipment over its full service life " +
      "rather than at the till, so purchasing has been asked to take the lower " +
      "ten-year cost wherever options differ."
  };

  /* role      "titration" contributes to the threshold; "anchor" does not.
     penalty   weeks the COMPLIANT option arrives BEHIND the other. Negative on
               anchors, where the compliant option arrives sooner.
     baseLead  lead time of the non-compliant option, in weeks.

     Money gaps are held roughly constant across all nine items on purpose —
     see the header. Do not "improve" one item's numbers in isolation. */
  var TRIALS = [
    { id: "espresso", item: "Espresso machines", sub: "Six units, one per site plus a spare",
      role: "titration", penalty: 6, baseLead: 4,
      cheapBuy: { buy: "$14,400", ten: "About $39,000", supplier: "National distributor", finish: "Stainless" },
      cheapOwn: { buy: "$22,800", ten: "About $31,500", supplier: "Current supplier",     finish: "Black" } },

    { id: "dishwash", item: "Under-counter dishwashers", sub: "Eight units",
      role: "anchor", penalty: -1, baseLead: 5,
      cheapBuy: { buy: "$9,600",  ten: "About $26,000", supplier: "Current supplier",     finish: "Stainless" },
      cheapOwn: { buy: "$15,200", ten: "About $21,000", supplier: "Direct from maker",    finish: "Stainless" } },

    { id: "display", item: "Refrigerated display cases", sub: "Eight units, made to order",
      role: "titration", penalty: 13, baseLead: 3,
      cheapBuy: { buy: "$18,000", ten: "About $47,000", supplier: "Regional distributor", finish: "Black" },
      cheapOwn: { buy: "$28,000", ten: "About $38,000", supplier: "Direct from maker",    finish: "Brushed steel" } },

    { id: "ovens", item: "Convection ovens", sub: "Six units",
      role: "titration", penalty: 2, baseLead: 4,
      cheapBuy: { buy: "$12,600", ten: "About $33,000", supplier: "Direct from maker",    finish: "Black" },
      cheapOwn: { buy: "$19,800", ten: "About $26,500", supplier: "National distributor", finish: "Stainless" } },

    { id: "ice", item: "Ice machines", sub: "Eight units",
      role: "anchor", penalty: 0, baseLead: 3,
      cheapBuy: { buy: "$7,200",  ten: "About $19,500", supplier: "Regional distributor", finish: "Stainless" },
      cheapOwn: { buy: "$11,400", ten: "About $15,800", supplier: "Current supplier",     finish: "White" } },

    { id: "bar", item: "Blenders and bar equipment", sub: "Twenty-four units across the sites",
      role: "titration", penalty: 1, baseLead: 2,
      cheapBuy: { buy: "$4,800",  ten: "About $14,200", supplier: "Current supplier",     finish: "Black" },
      cheapOwn: { buy: "$7,600",  ten: "About $11,400", supplier: "Regional distributor", finish: "Brushed steel" } },

    { id: "filter", item: "Water filtration systems", sub: "Eight units, plumbed in",
      role: "titration", penalty: 9, baseLead: 3,
      cheapBuy: { buy: "$5,600",  ten: "About $16,000", supplier: "National distributor", finish: "White" },
      cheapOwn: { buy: "$8,800",  ten: "About $12,900", supplier: "Current supplier",     finish: "White" } },

    { id: "aircon", item: "Air-conditioning units", sub: "Eight units, front of house",
      role: "titration", penalty: 4, baseLead: 5,
      cheapBuy: { buy: "$16,000", ten: "About $43,000", supplier: "Current supplier",     finish: "White" },
      cheapOwn: { buy: "$25,000", ten: "About $34,500", supplier: "Regional distributor", finish: "White" } },

    { id: "pos", item: "Point-of-sale terminals", sub: "Sixteen tills and card readers",
      role: "anchor", penalty: -2, baseLead: 4,
      cheapBuy: { buy: "$8,000",  ten: "About $21,000", supplier: "Direct from maker",    finish: "Black" },
      cheapOwn: { buy: "$12,600", ten: "About $17,000", supplier: "National distributor", finish: "Black" } }
  ];

  /* Objective-check options. Lead time is the distractor — it is the thing
     that visibly varied most, so choosing it identifies participants answering
     from their own behaviour rather than from the screen above them. */
  var OBJ_CHECK = [
    { key: "upfront",  text: "The lower purchase price" },
    { key: "longrun",  text: "The lower ten-year cost" },
    { key: "lead",     text: "The shortest lead time" },
    { key: "supplier", text: "The supplier the group already uses" }
  ];

  /* ---------------- objective assignment ---------------- */

  function qparam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function toLocal(v) {
    if (v === "price" || v === "upfront") return "upfront";
    if (v === "environmental" || v === "longrun") return "longrun";
    return null;
  }
  function flip(g) { return g === "upfront" ? "longrun" : "upfront"; }
  function other(profile) { return profile === "cheapBuy" ? "cheapOwn" : "cheapBuy"; }

  var ownRaw = qparam("own");
  var ownGoal = toLocal(ownRaw);

  var goalRaw = qparam("goal");
  var assignedGoal = toLocal(goalRaw);
  if (assignedGoal === null) {
    if (ownGoal && ASSIGNMENT_MODE === "incongruent")    assignedGoal = flip(ownGoal);
    else if (ownGoal && ASSIGNMENT_MODE === "congruent") assignedGoal = ownGoal;
    else assignedGoal = coin() ? "upfront" : "longrun";
  }

  var congruent = ownGoal === null ? null : (assignedGoal === ownGoal ? 1 : 0);

  // Which PROFILE the assigned objective points at, on every item.
  var COMPLIANT = assignedGoal === "upfront" ? "cheapBuy" : "cheapOwn";

  var order = shuffle(TRIALS);
  var N = order.length;
  var TITRATION = TRIALS.filter(function (t) { return t.role === "titration"; })
                        .sort(function (a, b) { return a.penalty - b.penalty; });
  var ANCHORS = TRIALS.filter(function (t) { return t.role === "anchor"; });

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    assigned_goal: assignedGoal,
    assigned_goal_raw: goalRaw,
    own_goal: ownGoal,
    own_goal_raw: ownRaw,
    congruent: congruent,
    /* Keyed on the PARSED value, not the raw string: a malformed goal param
       ("?goal=banana") falls through to derivation, and logging that as "url"
       would silently misattribute the assignment. role-buyer-task.html and
       goal-perspective-task.html both still key on the raw string. */
    goal_source: toLocal(goalRaw) ? "url" : (ownGoal ? ASSIGNMENT_MODE : "random"),
    compliant_profile: COMPLIANT,
    item_order: order.map(function (t) { return t.id; }).join(","),
    penalty_order: order.map(function (t) { return t.penalty; }).join(","),
    side_order: null,

    choices: null,                  // profile chosen, canonical TRIALS order
    n_answered: 0,
    n_compliant_total: 0,           // 0-9
    n_compliant_titration: 0,       // 0-6
    n_compliant_anchors: 0,         // 0-3 — FLOOR CHECK, not a willingness score
    n_picked_longer_lead: 0,        // 0-9 — heuristic detector
    n_picked_cheapbuy: 0,           // 0-9 — response-set detector

    titration_pattern: null,        // compliance by ascending penalty, e.g. "1,1,1,0,0,0"
    threshold_k: null,              // rungs obeyed under the best step fit
    threshold_weeks: null,          // largest delay still absorbed; 0 = never obeyed
    threshold_errors: null,         // misclassifications — monotonicity check
    threshold_ambiguous: 0,         // 1 if several cuts tied
    censored: 0,                    // 1 = obeyed at the top rung; right-censored

    objcheck_choice: null,
    objcheck_correct: null,
    willingness_cell: null,         // adopted | declined | coincidence | disengaged
    suspicion_text: null,

    trial_dwell: null,
    n_back: 0,
    max_item_reached: 0,
    t_first_interaction: null,
    t_last_choice: null,
    t_check_start: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>' + PREAMBLE + '</p>' +
    '<p>' + OBJECTIVES[assignedGoal] + '</p>' +
    '<p>For each item, choose the option you would order.</p>';

  /* ---------------- render ---------------- */

  var sideOrder = order.map(function () { return coin(); });   // true = compliant shown first
  state.side_order = sideOrder.map(function (x) { return x ? "c" : "n"; }).join(",");

  function leadOf(tr, profile) {
    return profile === COMPLIANT ? tr.baseLead + tr.penalty : tr.baseLead;
  }
  function leadText(tr, profile) {
    var w = leadOf(tr, profile);
    return w + (w === 1 ? " week" : " weeks");
  }

  function optCard(tr, profile, label) {
    var o = tr[profile];
    return '<div class="ocard" data-profile="' + profile + '">' +
             '<p class="oname">' + label + '</p>' +
             '<div class="orow"><span class="olab">Purchase price</span><span class="oval">' + o.buy + '</span></div>' +
             '<div class="orow"><span class="olab">Ten-year cost</span><span class="oval">' + o.ten + '</span></div>' +
             '<div class="orow"><span class="olab">Lead time</span><span class="oval">' + leadText(tr, profile) + '</span></div>' +
             '<div class="orow"><span class="olab">Supplier</span><span class="oval">' + o.supplier + '</span></div>' +
             '<div class="orow"><span class="olab">Finish</span><span class="oval">' + o.finish + '</span></div>' +
           '</div>';
  }

  var slidesHtml = order.map(function (tr, i) {
    var firstProfile  = sideOrder[i] ? COMPLIANT : other(COMPLIANT);
    var secondProfile = other(firstProfile);
    return '<div class="slide" data-trial="' + i + '">' +
             '<p class="tname">' + tr.item + '</p>' +
             '<p class="tsub">' + tr.sub + '</p>' +
             '<div class="opts2">' +
               optCard(tr, firstProfile, "Option A") +
               optCard(tr, secondProfile, "Option B") +
             '</div>' +
           '</div>';
  });

  slidesHtml.push(
    '<div class="slide" data-check="1">' +
      '<p class="fq">What were you asked to take wherever the options differed?</p>' +
      '<div class="fopts">' +
        shuffle(OBJ_CHECK).map(function (r) {
          return '<button type="button" class="fopt" data-check-key="' + r.key + '">' + r.text + '</button>';
        }).join("") +
      '</div>' +
    '</div>'
  );

  slidesHtml.push(
    '<div class="slide" data-suspicion="1">' +
      '<p class="fq">In a sentence, what do you think this section was measuring?</p>' +
      '<textarea class="ftext" id="susp" rows="3"></textarea>' +
      '<p class="fnote">There is no right answer here, and you can leave it blank.</p>' +
    '</div>'
  );

  document.getElementById("track").innerHTML = slidesHtml.join("");
  document.getElementById("dots").innerHTML =
    slidesHtml.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var TOTAL = slidesHtml.length;                  // N trials + objective check + suspicion
  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(N).fill(null);            // indexed by PRESENTATION position
  var dwell = new Array(TOTAL).fill(0);
  var checkPick = null;
  var index = 0;
  var enteredAt = Date.now();
  var checkSeen = false;

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  function ready(i) {
    if (i < N) return picks[i] !== null;
    if (i === N) return checkPick !== null;
    return true;                                   // suspicion item is optional
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    document.getElementById("counter").textContent =
      index < N ? "Item " + (index + 1) + " of " + N : "Follow-up";
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && (i < N ? picks[i] !== null : i < index));
    });
    // Sealed at the check boundary: choices cannot be revised once the check
    // has been seen, or both measures are invalidated.
    backBtn.disabled = index === 0 || (checkSeen && index >= N);
    if (HIDE_OBJECTIVE_AT_CHECK) {
      document.getElementById("scenario").style.display = index >= N ? "none" : "";
    }
    nextBtn.disabled = !ready(index);
    nextBtn.textContent = index === TOTAL - 1 ? "Done" : "Next";
    if (index > state.max_item_reached) state.max_item_reached = index;
    reportHeight();
  }

  function goTo(i) {
    accrue();
    index = i;
    if (index >= N && !checkSeen) {
      checkSeen = true;
      state.t_check_start = Date.now() - t0;
    }
    enteredAt = Date.now();
    render();
    report();
  }

  backBtn.addEventListener("click", function () {
    if (backBtn.disabled) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < TOTAL - 1) { goTo(index + 1); return; }
    accrue();
    captureSuspicion();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- scoring ---------------- */

  function pickFor(tr) {
    return picks[order.indexOf(tr)];
  }

  /* Best step fit: comply on the k lowest rungs, defect above. Order is
     randomised, so the switch point cannot be read directly. Ties resolve to
     the SMALLEST k — the conservative reading — and are flagged. */
  function fitThreshold(comp) {
    var bestK = 0, bestErr = null, nTies = 0;
    for (var k = 0; k <= comp.length; k++) {
      var err = 0;
      for (var i = 0; i < comp.length; i++) err += (i < k) ? (1 - comp[i]) : comp[i];
      if (bestErr === null || err < bestErr) { bestErr = err; bestK = k; nTies = 1; }
      else if (err === bestErr) { nTies += 1; }
    }
    return { k: bestK, errors: bestErr, ties: nTies };
  }

  function score() {
    var answered = 0, compliant = 0, longer = 0, cheapbuy = 0;

    TRIALS.forEach(function (tr) {
      var p = pickFor(tr);
      if (p === null || p === undefined) return;
      answered += 1;
      if (p === COMPLIANT) compliant += 1;
      if (p === "cheapBuy") cheapbuy += 1;
      if (leadOf(tr, p) > leadOf(tr, other(p))) longer += 1;
    });

    state.choices = TRIALS.map(function (tr) {
      var p = pickFor(tr);
      return tr.id + ":" + (!p ? "-" : (p === "cheapBuy" ? "b" : "o"));
    }).join(",");
    state.n_answered = answered;
    state.n_compliant_total = compliant;
    state.n_picked_longer_lead = longer;
    state.n_picked_cheapbuy = cheapbuy;

    state.n_compliant_anchors = ANCHORS.reduce(function (n, tr) {
      return n + (pickFor(tr) === COMPLIANT ? 1 : 0);
    }, 0);

    var comp = TITRATION.map(function (tr) {
      var p = pickFor(tr);
      return !p ? null : (p === COMPLIANT ? 1 : 0);
    });
    state.n_compliant_titration = comp.reduce(function (n, c) { return n + (c === 1 ? 1 : 0); }, 0);

    if (comp.indexOf(null) === -1) {
      state.titration_pattern = comp.join(",");
      var fit = fitThreshold(comp);
      state.threshold_k = fit.k;
      state.threshold_weeks = fit.k === 0 ? 0 : TITRATION[fit.k - 1].penalty;
      state.threshold_errors = fit.errors;
      state.threshold_ambiguous = fit.ties > 1 ? 1 : 0;
      state.censored = fit.k === comp.length ? 1 : 0;
    } else {
      state.titration_pattern = null;
      state.threshold_k = null;
      state.threshold_weeks = null;
      state.threshold_errors = null;
      state.threshold_ambiguous = 0;
      state.censored = 0;
    }

    /* The 2x2. "Obeyed" is a majority of the titration items, so that a
       threshold sitting mid-ladder does not read as refusal. Anchors are NOT
       folded in: read n_compliant_anchors and trial_dwell alongside this before
       calling any DECLINED case unwillingness — see the header. */
    if (state.objcheck_correct !== null && comp.indexOf(null) === -1) {
      var obeyed = state.n_compliant_titration >= 3;
      state.willingness_cell = state.objcheck_correct === 1
        ? (obeyed ? "adopted" : "declined")
        : (obeyed ? "coincidence" : "disengaged");
    }
  }

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (card) {
      markInteraction();
      var slide = card.closest(".slide");
      var idx = parseInt(slide.getAttribute("data-trial"), 10);
      slide.querySelectorAll(".ocard").forEach(function (c) {
        c.classList.toggle("picked", c === card);
      });
      picks[idx] = card.getAttribute("data-profile");
      state.t_last_choice = Date.now() - t0;
      score();
      render();
      report();
      return;
    }

    var fopt = e.target.closest(".fopt");
    if (fopt) {
      markInteraction();
      var box = fopt.closest(".slide");
      box.querySelectorAll(".fopt").forEach(function (b) {
        b.classList.toggle("picked", b === fopt);
      });
      checkPick = fopt.getAttribute("data-check-key");
      state.objcheck_choice = checkPick;
      state.objcheck_correct = checkPick === assignedGoal ? 1 : 0;
      score();
      render();
      report();
    }
  });

  function captureSuspicion() {
    var el = document.getElementById("susp");
    if (!el) return;
    var v = el.value.replace(/\s+/g, " ").trim();
    state.suspicion_text = v.length ? v.slice(0, 500) : null;
  }
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "susp") { markInteraction(); captureSuspicion(); }
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  score();
  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
