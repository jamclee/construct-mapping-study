<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumbing Decision</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .scenario { font-size: 15px; margin: 0 0 8px; }
  .scenario p { margin: 0 0 11px; }

  .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0 0; }
  .card { border: 1px solid #dfe3e7; border-radius: 7px; padding: 14px 15px; background: #fff; }
  .card.is-default { border-color: #c8ced4; background: #fafbfc; }
  .card.chosen { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; background: #fff; }

  .name { font-size: 15.5px; font-weight: 600; margin: 0 0 2px; }
  .tag {
    display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: #4a5158; background: #eceff2;
    border-radius: 3px; padding: 2px 6px; margin-bottom: 8px;
  }
  .price { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .price span { font-size: 12.5px; font-weight: 400; color: #737b82; }

  .panelbtn {
    display: flex; align-items: center; gap: 6px; width: 100%;
    margin-top: 9px; padding: 7px 10px;
    border: 1px solid #c8ced4; border-radius: 5px; background: #fff;
    font-family: inherit; font-size: 13px; font-weight: 500; color: #2f6fb0;
    text-align: left; cursor: pointer;
  }
  .panelbtn:hover { border-color: #2f6fb0; background: #f2f7fc; }
  .panelbtn .chev {
    width: 7px; height: 7px; flex-shrink: 0; margin-left: auto;
    border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
  }

  .panel { display: none; margin-top: 8px; padding: 10px 11px;
           background: #f7f9fb; border: 1px solid #e6ebf0; border-radius: 6px; }
  .panel.open { display: block; }
  .prow { display: flex; gap: 10px; font-size: 13px; padding: 2.5px 0; }
  .plab { flex: 0 0 118px; color: #737b82; }
  .pval { color: #1f2328; }

  .decision { margin-top: 24px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  .qtext { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .choicebtn.chosen { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  #comp { display: none; margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  #comp.open { display: block; }
  .compq { margin-bottom: 16px; }
  .compq p { font-size: 14.5px; margin: 0 0 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 7px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  @media (max-width: 560px) { .products { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="scenario" id="scenario"></div>
  <div class="products" id="products"></div>

  <div class="decision">
    <p class="qtext" id="decisionQ"></p>
    <div class="choices" id="choices"></div>
  </div>

  <div id="comp"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     DEFAULT-EFFECT PARADIGM WITH AN UNFAMILIAR PRODUCT

     Structure follows the Appendix of "Partitioning Default Effects"
     (Johnson et al., SSRN 1352488): a contractor has already installed one
     option, states both prices, offers a free switch.

     WHY THE PRODUCT CHANGED. The original used light bulbs precisely because
     they are familiar — participants generate aspects from memory, which is
     what query theory requires and what makes on-screen attributes
     unnecessary. An acquisition probe therefore has no job in that version.

     Circulation pumps are real, plumbing-native, and almost nobody knows
     their specifications. Aspects cannot be retrieved, so they must be
     acquired. That makes acquisition a genuinely required link.

     TRADE-OFF PRESERVED. The core tension is still price versus energy
     efficiency, and the gated cost panel still reverses the visible ordering:
     the cheaper pump costs roughly $1,980 over ten years against $845.
     Secondary attributes are balanced so neither option dominates — the
     cheaper pump is quieter to service, longer-lived, and instant; the
     efficient pump is near-silent but pricier, shorter-lived, and slower to
     respond.

     MODEL NAMES ARE RANDOMLY ASSIGNED TO PROFILES. Names like "high
     efficiency" would let participants infer the trade-off without opening
     anything, defeating the purpose. R-12 and R-40 carry no valence, and
     randomising which name holds which profile removes any residual
     inference from the labels.

     CAUTION ON USE. Acquisition is downstream of the default manipulation.
     Use it as a mediator or mechanism measure, not a screen, and check
     condition balance first.
     ------------------------------------------------------------------ */

  var PROBE_ID = "DEF_PUMP";
  var MODEL_NAMES = ["Model R-12", "Model R-40"];

  var PROFILES = {
    basic: {
      key: "basic",
      price: "$180",
      priceNote: "for all three",
      details: [
        ["Power draw", "85 watts per pump, running continuously"],
        ["Noise level", "Audible hum in nearby rooms"],
        ["Response time", "Hot water reaches the taps immediately"],
        ["Servicing", "Any plumber can service it"],
        ["Expected lifespan", "About 12 years"]
      ],
      cost: [
        ["Electricity cost", "About $180 per year for all three"],
        ["Cost per pump", "$60"],
        ["Overall cost", "About $1,980 over 10 years"]
      ]
    },
    efficient: {
      key: "efficient",
      price: "$525",
      priceNote: "for all three",
      details: [
        ["Power draw", "8 to 20 watts per pump, adjusting to demand"],
        ["Noise level", "Near-silent"],
        ["Response time", "Brief delay while the pump ramps up"],
        ["Servicing", "Needs a specialist for the electronic parts"],
        ["Expected lifespan", "About 10 years"]
      ],
      cost: [
        ["Electricity cost", "About $32 per year for all three"],
        ["Cost per pump", "$175"],
        ["Overall cost", "About $845 over 10 years"]
      ]
    }
  };

  /* ---------------- randomisation ---------------- */

  function coin() { return Math.random() < 0.5; }

  // Which model name carries which profile. Removes any inference from labels.
  var nameOfBasic     = coin() ? MODEL_NAMES[0] : MODEL_NAMES[1];
  var nameOfEfficient = nameOfBasic === MODEL_NAMES[0] ? MODEL_NAMES[1] : MODEL_NAMES[0];
  PROFILES.basic.name = nameOfBasic;
  PROFILES.efficient.name = nameOfEfficient;

  // Default condition: which pump is already installed.
  var defaultKey = coin() ? "basic" : "efficient";
  var otherKey = defaultKey === "basic" ? "efficient" : "basic";

  // Card position, randomised independently of condition.
  var leftKey = coin() ? "basic" : "efficient";
  var displayOrder = [leftKey, leftKey === "basic" ? "efficient" : "basic"];

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var revealOrder = [];

  var state = {
    probe: PROBE_ID,
    default_profile: defaultKey,
    name_of_basic: nameOfBasic,
    display_left: leftKey,
    revealed_details_basic: 0,
    revealed_details_efficient: 0,
    revealed_cost_basic: 0,
    revealed_cost_efficient: 0,
    n_panels_revealed: 0,
    acquisition_cost: 0,
    panels_revealed: null,
    panel_clicks: 0,
    first_panel: null,
    first_product_investigated: null,
    revealed_all: 0,
    revealed_both_cost: 0,
    t_first_interaction: null,
    t_first_reveal: null,
    dwell_after_reveal: null,
    n_panels_at_choice: 0,
    choice: null,
    chosen_profile: null,
    choice_changes: 0,
    t_choice: null,
    comp_upfront: null, comp_electricity: null, comp_tenyear: null,
    comp_n_correct: 0,
    comp_answered: 0,
    t_comp_done: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- comprehension items ----------------
     Correct answers follow the profile, not the label, since names are
     randomly assigned. */

  var COMP_ITEMS = [
    { key: "upfront",
      text: "Which pump costs more to purchase up front?",
      correctProfile: "efficient" },
    { key: "electricity",
      text: "Which pump uses less electricity per year?",
      correctProfile: "efficient" },
    { key: "tenyear",
      text: "Which pump costs more in total over ten years?",
      correctProfile: "basic" }
  ];

  /* ---------------- scenario ---------------- */

  var defP = PROFILES[defaultKey], othP = PROFILES[otherKey];

  document.getElementById("scenario").innerHTML =
    '<p>Imagine that you are undergoing a significant amount of remodeling on your ' +
    'home. On the last day of work the contractors clean up all leftover dust, dirt ' +
    'and paint. Before leaving, one of the workers tells you that the head contractor ' +
    'will be back tomorrow for a final inspection of the house.</p>' +
    '<p>Tomorrow evening the head contractor comes by your home to discuss the last ' +
    'aspects of the addition. He explains that the new plumbing runs on circulation ' +
    'pumps, which keep hot water moving through the pipes so that it arrives quickly ' +
    'at the taps, and that three of them have been fitted, one for each zone of the ' +
    'house. He mentions that the system has been fitted with ' + defP.name + ' pumps, ' +
    'which cost a total of ' + defP.price + '. He then asks you if these pumps are ok, ' +
    'or if you would prefer ' + othP.name + ' pumps, which will cost ' + othP.price + '. ' +
    'If you prefer to switch, he will send over a contractor to change the pumps ' +
    'tomorrow. There will be no labor charge for switching the pumps.</p>';

  /* ---------------- product cards ---------------- */

  function rows(pairs) {
    return pairs.map(function (p) {
      return '<div class="prow"><span class="plab">' + p[0] +
             '</span><span class="pval">' + p[1] + '</span></div>';
    }).join("");
  }

  document.getElementById("products").innerHTML = displayOrder.map(function (k) {
    var p = PROFILES[k];
    var isDefault = k === defaultKey;
    return '<div class="card' + (isDefault ? ' is-default' : '') + '" data-profile="' + k + '">' +
             (isDefault ? '<span class="tag">Already installed</span>' : '<span class="tag">&nbsp;</span>') +
             '<p class="name">' + p.name + '</p>' +
             '<div class="price">' + p.price + ' <span>' + p.priceNote + '</span></div>' +
             '<button type="button" class="panelbtn" data-panel="details" ' +
               'aria-label="Show product details for ' + p.name + '">' +
               'Product details<span class="chev"></span></button>' +
             '<div class="panel" data-for="details">' + rows(p.details) + '</div>' +
             '<button type="button" class="panelbtn" data-panel="cost" ' +
               'aria-label="Show cost details for ' + p.name + '">' +
               'Cost details<span class="chev"></span></button>' +
             '<div class="panel" data-for="cost">' + rows(p.cost) + '</div>' +
           '</div>';
  }).join("");

  /* ---------------- decision ---------------- */

  document.getElementById("decisionQ").textContent = "In this situation, what will you do?";

  document.getElementById("choices").innerHTML =
    '<button type="button" class="choicebtn" data-choice="keep_default">' +
      'I will tell the contractor to leave the ' + defP.name + ' pumps</button>' +
    '<button type="button" class="choicebtn" data-choice="switch">' +
      'I will tell the contractor to switch to the ' + othP.name + ' pumps</button>';

  /* ---------------- panel reveals ---------------- */

  document.getElementById("products").addEventListener("click", function (e) {
    var btn = e.target.closest(".panelbtn");
    if (!btn) return;

    var card = btn.closest(".card");
    var prof = card.getAttribute("data-profile");
    var which = btn.getAttribute("data-panel");
    var panel = card.querySelector('.panel[data-for="' + which + '"]');
    var id = prof + ":" + which;

    markInteraction();
    state.panel_clicks += 1;
    panel.classList.toggle("open");

    if (revealOrder.indexOf(id) === -1) {
      revealOrder.push(id);
      state["revealed_" + which + "_" + prof] = 1;
      if (state.first_panel === null) {
        state.first_panel = id;
        state.first_product_investigated = prof;
        state.t_first_reveal = Date.now() - t0;
      }
    }

    state.n_panels_revealed = revealOrder.length;
    state.acquisition_cost = revealOrder.length;
    state.panels_revealed = revealOrder.join(",");
    state.revealed_all = revealOrder.length === 4 ? 1 : 0;
    state.revealed_both_cost =
      (state.revealed_cost_basic && state.revealed_cost_efficient) ? 1 : 0;

    report();
    reportHeight();
  });

  /* ---------------- choice ---------------- */

  document.getElementById("choices").addEventListener("click", function (e) {
    var btn = e.target.closest(".choicebtn");
    if (!btn) return;

    markInteraction();
    var choice = btn.getAttribute("data-choice");
    if (state.choice !== null && state.choice !== choice) state.choice_changes += 1;

    document.querySelectorAll(".choicebtn").forEach(function (b) {
      b.classList.toggle("chosen", b === btn);
    });
    var chosenProfile = choice === "keep_default" ? defaultKey : otherKey;
    document.querySelectorAll(".card").forEach(function (c) {
      c.classList.toggle("chosen", c.getAttribute("data-profile") === chosenProfile);
    });

    state.choice = choice;
    state.chosen_profile = chosenProfile;
    state.t_choice = Date.now() - t0;
    state.n_panels_at_choice = revealOrder.length;
    state.dwell_after_reveal =
      state.t_first_reveal === null ? null : state.t_choice - state.t_first_reveal;

    showComprehension();
    report();
    reportHeight();
  });

  /* ---------------- comprehension ---------------- */

  var compEl = document.getElementById("comp");
  var compShown = false;

  function showComprehension() {
    if (compShown) return;
    compShown = true;

    // Option order follows on-screen card order so it does not cue anything.
    var optProfiles = displayOrder;

    compEl.innerHTML =
      '<p style="font-size:13px;color:#737b82;margin:0 0 14px">' +
      'Before you continue, a few quick questions about the two pumps.</p>' +
      COMP_ITEMS.map(function (q) {
        var opts = optProfiles.map(function (pk) {
          return '<button type="button" class="opt" data-val="' + pk + '">' +
                 PROFILES[pk].name + '</button>';
        }).join("") +
        '<button type="button" class="opt" data-val="same">About the same</button>';
        return '<div class="compq" data-q="' + q.key + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="opts">' + opts + '</div>' +
               '</div>';
      }).join("");
    compEl.classList.add("open");
  }

  compEl.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var block = opt.closest(".compq");
    var key = block.getAttribute("data-q");
    block.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("picked", b === opt);
    });
    state["comp_" + key] = opt.getAttribute("data-val");

    var answered = 0, correct = 0;
    COMP_ITEMS.forEach(function (q) {
      var a = state["comp_" + q.key];
      if (a !== null && a !== undefined) {
        answered += 1;
        if (a === q.correctProfile) correct += 1;
      }
    });
    state.comp_answered = answered;
    state.comp_n_correct = correct;
    if (answered === COMP_ITEMS.length) state.t_comp_done = Date.now() - t0;

    report();
    reportHeight();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  report();
  reportHeight();
})();
</script>
</body>
</html>
