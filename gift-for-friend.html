<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choosing a Gift</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }
  #scenario ul { margin: 0 0 11px; padding-left: 20px; }
  #scenario li { margin-bottom: 4px; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 5px; }
  .odesc { font-size: 12.5px; color: #4a5158; margin: 0 0 7px; }
  .oprice { font-size: 12.5px; color: #737b82; margin: 0; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="scenario"></div>
  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>
  <div class="viewport"><div class="track" id="track"></div></div>
  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>
  <div id="done">Your answers have been recorded. Please continue.</div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE — PHASE 2 OF 2 (GIFT FOR A FRIEND)

     Gift-giving is the vehicle because its documented failure mode is exactly
     the standpoint failure being measured: people buy what THEY would want.
     Another person's preferences invite projection in a way an institutional
     policy does not.

     THE FRIEND IS TAILORED. Sam's stated preferences are built from the
     participant's own answers in phase 1: opposite on three of the four items,
     matching on one. Every participant therefore has a denominator of exactly
     three items where adoption is observable. Without tailoring, anyone whose
     taste happened to match a fixed friend's would yield no signal — roughly a
     quarter of a sample when the friend holds majority positions. The one
     matching item keeps the opposition from looking systematic.

     THE KEY MEASURE is n_adopted_on_incongruent: on the three items where the
     participant's own pick differed from Sam's stated preference, how often did
     they still choose for Sam. Raw consistency with Sam is not informative on
     its own. n_projected_on_incongruent is its complement and is the more
     interpretable number for a reader — it counts how often they gave Sam what
     they would have wanted themselves.

     ITEM ORDER IS RESHUFFLED INDEPENDENTLY of phase 1, and side positions are
     re-randomised. Because the phases are separated by other tasks, matching
     the earlier layout would only make the repeat more recognisable; side order
     is randomised per item in both files, so position adds noise rather than
     bias at the group level.

     THE ITEMS BLOCK BELOW MUST STAY IDENTICAL to the one in
     gift-self-pass.html. Answers are mapped by item id, so changing a name, a
     dimension, or an id in one file without the other silently misaligns the
     tailoring.

     INPUT. Reads the phase-1 handoff from the query string:
       gift-for-friend.html?self=practical:x,quantity:y,keepsake:x,novelty:y
     In Qualtrics, pipe the phase-1 embedded field into the iframe src. If the
     parameter is absent or malformed, own-choices are randomised and
     self_source is logged as "random" so the file remains testable standalone —
     but such a record must not be treated as real data.
     ------------------------------------------------------------------ */

  var PROBE_ID = "GIFT_PERSP";
  var FRIEND = "Sam";
  var N_MATCHING = 1;   // items where Sam is made to agree with the participant

  var ITEMS = [
    { id: "practical",
      x: { kind: "x", name: "A compact tool kit",
           desc: "Screwdrivers, pliers and a small hammer in a case", price: "$38" },
      y: { kind: "y", name: "A framed print",
           desc: "A landscape print in a simple wooden frame", price: "$36" },
      pref: { x: "would rather have something they can use than something to look at",
              y: "would rather have something nice to look at than another practical thing" } },

    { id: "quantity",
      x: { kind: "x", name: "One hand-thrown mug",
           desc: "A single large mug from a local pottery", price: "$34" },
      y: { kind: "y", name: "A set of six mugs",
           desc: "Six matching patterned mugs in a box", price: "$35" },
      pref: { x: "prefers one well-made thing to a set of smaller ones",
              y: "prefers a set they can use every day to one special piece" } },

    { id: "keepsake",
      x: { kind: "x", name: "A hardcover book",
           desc: "A well-reviewed novel in hardcover", price: "$32" },
      y: { kind: "y", name: "A cinema gift card",
           desc: "Admits two, valid for a year", price: "$32" },
      pref: { x: "would rather be given something to keep than an outing",
              y: "would rather be given an outing than another thing to keep" } },

    { id: "novelty",
      x: { kind: "x", name: "A box of classic chocolates",
           desc: "Familiar flavours, traditional assortment", price: "$29" },
      y: { kind: "y", name: "An unusual flavour selection",
           desc: "Chilli, miso and other uncommon pairings", price: "$30" },
      pref: { x: "sticks to things they already know they like",
              y: "likes trying things they have never had before" } }
  ];

  function qparam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function other(k) { return k === "x" ? "y" : "x"; }

  /* ---------------- phase-1 handoff ---------------- */

  var selfMapIn = qparam("self");
  var ownByent = {};
  var parsedOk = false;

  if (selfMapIn) {
    selfMapIn.split(",").forEach(function (pair) {
      var bits = pair.split(":");
      if (bits.length === 2 && (bits[1] === "x" || bits[1] === "y")) {
        ownByent[bits[0].trim()] = bits[1];
      }
    });
    parsedOk = ITEMS.every(function (it) { return ownByent[it.id]; });
  }
  if (!parsedOk) {
    // Standalone fallback so the file can be opened and tested directly.
    ITEMS.forEach(function (it) { ownByent[it.id] = coin() ? "x" : "y"; });
  }

  /* ---------------- tailoring ---------------- */

  var order = shuffle(ITEMS);
  var N = order.length;
  var matchingIds = shuffle(ITEMS.map(function (it) { return it.id; })).slice(0, N_MATCHING);

  var samByent = {};
  ITEMS.forEach(function (it) {
    var own = ownByent[it.id];
    samByent[it.id] = matchingIds.indexOf(it.id) !== -1 ? own : other(own);
  });

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    self_source: parsedOk ? "url" : "random",
    self_map_in: selfMapIn,
    own_map: ITEMS.map(function (it) { return it.id + ":" + ownByent[it.id]; }).join(","),
    sam_map: ITEMS.map(function (it) { return it.id + ":" + samByent[it.id]; }).join(","),
    matching_items: matchingIds.join(","),
    item_order: order.map(function (it) { return it.id; }).join(","),
    side_order: null,
    gift_choices: null,              // by item id, in presentation order
    n_incongruent_items: 0,          // the denominator — should equal N - N_MATCHING
    n_adopted_on_incongruent: 0,     // THE KEY MEASURE
    n_projected_on_incongruent: 0,   // gave Sam what they would have wanted
    n_gift_matches_sam: 0,           // raw consistency, all items
    n_answered: 0,
    trial_dwell: null,
    n_back: 0,
    t_first_interaction: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>It is your friend ' + FRIEND + '&rsquo;s birthday next week and you are ' +
    'choosing a gift. Thinking back over things ' + FRIEND + ' has said:</p><ul>' +
    order.map(function (it) {
      return '<li>' + FRIEND + ' ' + it.pref[samByent[it.id]] + '.</li>';
    }).join("") +
    '</ul><p>For each pair, choose the gift you would give ' + FRIEND + '.</p>';

  /* ---------------- render ---------------- */

  var sideOrder = order.map(function () { return coin(); });
  state.side_order = sideOrder.map(function (v) { return v ? "x" : "y"; }).join(",");

  function optCard(o) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + o.name + '</p>' +
             '<p class="odesc">' + o.desc + '</p>' +
             '<p class="oprice">' + o.price + '</p>' +
           '</div>';
  }

  document.getElementById("track").innerHTML = order.map(function (it, i) {
    var first = sideOrder[i] ? it.x : it.y;
    var second = sideOrder[i] ? it.y : it.x;
    return '<div class="slide" data-slide="' + i + '">' +
             '<div class="opts2">' + optCard(first) + optCard(second) + '</div>' +
           '</div>';
  }).join("");

  document.getElementById("dots").innerHTML =
    order.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(N).fill(null);
  var dwell = new Array(N).fill(0);
  var index = 0;
  var enteredAt = Date.now();

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    document.getElementById("counter").textContent = (index + 1) + " of " + N;
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && picks[i] !== null);
    });
    backBtn.disabled = index === 0;
    nextBtn.disabled = picks[index] === null;
    nextBtn.textContent = index === N - 1 ? "Done" : "Next";
    reportHeight();
  }

  function goTo(i) { accrue(); index = i; enteredAt = Date.now(); render(); report(); }

  backBtn.addEventListener("click", function () {
    if (index === 0) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < N - 1) { goTo(index + 1); return; }
    accrue();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;

    markInteraction();
    var slide = card.closest(".slide");
    var si = parseInt(slide.getAttribute("data-slide"), 10);

    slide.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[si] = card.getAttribute("data-kind");

    var answered = 0, incong = 0, adopted = 0, projected = 0, matches = 0;

    order.forEach(function (it, i) {
      if (picks[i] === null) return;
      answered += 1;
      var sam = samByent[it.id], own = ownByent[it.id];
      if (picks[i] === sam) matches += 1;
      if (sam !== own) {
        incong += 1;
        if (picks[i] === sam) adopted += 1; else projected += 1;
      }
    });

    state.gift_choices = order.map(function (it, i) {
      return it.id + ":" + (picks[i] === null ? "" : picks[i]);
    }).join(",");
    state.n_answered = answered;
    state.n_incongruent_items = incong;
    state.n_adopted_on_incongruent = adopted;
    state.n_projected_on_incongruent = projected;
    state.n_gift_matches_sam = matches;

    render();
    report();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
