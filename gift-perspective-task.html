<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choosing a Gift</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .tname { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 5px; }
  .odesc { font-size: 12.5px; color: #4a5158; margin: 0 0 7px; }
  .oprice { font-size: 12.5px; color: #737b82; margin: 0; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scenario"></div>

  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>

  <div id="done">Your answers have been recorded. Please continue.</div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE — CHOOSING FOR ANOTHER PERSON

     Gift-giving is the vehicle because its documented failure mode is exactly
     the standpoint failure being measured: people buy what THEY would want.
     Unlike an institutional role, another person's preferences invite
     projection, which is what makes this a harder and more interesting test of
     standpoint than following a stated policy.

     SELF-CONTAINED CONGRUENCE. The probe runs in two phases on the same three
     items:

       Phase 1 — choose a gift for the friend, whose preferences are stated.
       Phase 2 — say which you would have picked for YOURSELF.

     Phase 2 comes second so it cannot cue the gift choices. Comparing the two
     gives within-person congruence per item, so the probe needs no upstream
     measure of the participant's orientation and does not depend on the pump
     task.

     THE KEY MEASURE is not raw consistency with the friend's preferences —
     someone who happens to share them scores well without adopting anything.
     It is n_adopted_on_incongruent: on the items where the participant's own
     pick differed from the friend's stated preference, did they still choose
     for the friend? Those are the only items where adoption is observable.

     THREE DIMENSIONS, NOT ONE REPEATED. Practical versus decorative, one
     quality item versus several small ones, something to keep versus an
     outing. Three items tapping one dimension each reads as a gift-choosing
     task; three items tapping the same dimension reads as a quiz.

     PRICES ARE MATCHED WITHIN EACH PAIR so cost cannot drive the choice and
     the decision rests on the preference dimension alone.

     LIMITATION. Phase 2 follows phase 1, so self-choices may be anchored by
     the gift choices already made. Placing it first would be worse — it would
     cue the dimensions before the measure that matters — but the anchoring
     should be acknowledged rather than ignored.
     ------------------------------------------------------------------ */

  var PROBE_ID = "GIFT_PERSP";
  var FRIEND = "Sam";

  /* kind: "friend" = the option the friend's stated preferences favour,
           "other"  = the alternative. */
  var ITEMS = [
    { label: "Option one",
      a: { kind: "friend", name: "A compact tool kit",
           desc: "Screwdrivers, pliers and a small hammer in a case", price: "$38" },
      b: { kind: "other",  name: "A framed print",
           desc: "A landscape print in a simple wooden frame", price: "$36" } },

    { label: "Option two",
      a: { kind: "friend", name: "One hand-thrown mug",
           desc: "A single large mug from a local pottery", price: "$34" },
      b: { kind: "other",  name: "A set of six mugs",
           desc: "Six matching patterned mugs in a box", price: "$35" } },

    { label: "Option three",
      a: { kind: "friend", name: "A hardcover book",
           desc: "A well-reviewed novel in hardcover", price: "$32" },
      b: { kind: "other",  name: "A cinema gift card",
           desc: "Admits two, valid for a year", price: "$32" } }
  ];

  /* ---------------- setup ---------------- */

  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  var order = shuffle(ITEMS);
  var N = order.length;

  // Six slides: three for the friend, then the same three for the self.
  var SLIDES = [];
  order.forEach(function (it, i) { SLIDES.push({ item: it, idx: i, phase: "friend" }); });
  order.forEach(function (it, i) { SLIDES.push({ item: it, idx: i, phase: "self" }); });

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    item_order: order.map(function (t) { return t.a.name; }).join(" | "),
    side_order: null,
    gift_choices: null,             // kind chosen for the friend, item order
    self_choices: null,             // kind chosen for the self, item order
    n_friend_consistent: 0,         // 0-3, raw consistency with stated preferences
    n_incongruent_items: 0,         // items where own pick differed from the friend's
    n_adopted_on_incongruent: 0,    // THE KEY MEASURE
    n_self_matches_friend: 0,       // items where they simply share the preference
    n_answered: 0,
    trial_dwell: null,
    n_back: 0,
    t_first_interaction: null,
    t_phase2_start: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario ---------------- */

  var scenarioEl = document.getElementById("scenario");

  var FRIEND_TEXT =
    '<p>Imagine that it is your friend ' + FRIEND + '&rsquo;s birthday and you are ' +
    'choosing a gift. Over the years ' + FRIEND + ' has mentioned that they would ' +
    'rather have something practical than something decorative, that they prefer ' +
    'one good-quality item to several smaller ones, and that they would rather be ' +
    'given something to keep than an outing.</p>' +
    '<p>You have narrowed it down to a few pairs. For each pair, choose the gift ' +
    'you would give ' + FRIEND + '.</p>';

  var SELF_TEXT =
    '<p>Now think only about yourself, setting ' + FRIEND + ' aside.</p>' +
    '<p>For each pair, which would you have picked for yourself?</p>';

  scenarioEl.innerHTML = FRIEND_TEXT;

  /* ---------------- render ---------------- */

  // Side order is fixed per ITEM (not per slide) so a participant sees the same
  // layout in both phases and any switch reflects preference, not repositioning.
  var sideOrder = order.map(function () { return coin(); });
  state.side_order = sideOrder.map(function (x) { return x ? "a" : "b"; }).join(",");

  function optCard(o) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + o.name + '</p>' +
             '<p class="odesc">' + o.desc + '</p>' +
             '<p class="oprice">' + o.price + '</p>' +
           '</div>';
  }

  document.getElementById("track").innerHTML = SLIDES.map(function (sl, i) {
    var first = sideOrder[sl.idx] ? sl.item.a : sl.item.b;
    var second = sideOrder[sl.idx] ? sl.item.b : sl.item.a;
    return '<div class="slide" data-slide="' + i + '">' +
             '<p class="tname">' + sl.item.label + '</p>' +
             '<div class="opts2">' + optCard(first) + optCard(second) + '</div>' +
           '</div>';
  }).join("");

  document.getElementById("dots").innerHTML =
    SLIDES.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(SLIDES.length).fill(null);
  var dwell = new Array(SLIDES.length).fill(0);
  var index = 0;
  var enteredAt = Date.now();

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    document.getElementById("counter").textContent =
      (SLIDES[index].phase === "friend" ? "Gift for " + FRIEND : "For yourself") +
      " — " + ((index % N) + 1) + " of " + N;
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && picks[i] !== null);
    });
    scenarioEl.innerHTML = SLIDES[index].phase === "friend" ? FRIEND_TEXT : SELF_TEXT;
    backBtn.disabled = index === 0;
    nextBtn.disabled = picks[index] === null;
    nextBtn.textContent = index === SLIDES.length - 1 ? "Done" : "Next";
    reportHeight();
  }

  function goTo(i) {
    accrue();
    if (SLIDES[i].phase === "self" && state.t_phase2_start === null) {
      state.t_phase2_start = Date.now() - t0;
    }
    index = i; enteredAt = Date.now(); render(); report();
  }

  backBtn.addEventListener("click", function () {
    if (index === 0) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < SLIDES.length - 1) { goTo(index + 1); return; }
    accrue();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;

    markInteraction();
    var slide = card.closest(".slide");
    var si = parseInt(slide.getAttribute("data-slide"), 10);

    slide.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[si] = card.getAttribute("data-kind");

    var gift = picks.slice(0, N);
    var self = picks.slice(N);
    var answered = 0, friendConsistent = 0, incong = 0, adopted = 0, shares = 0;

    picks.forEach(function (p) { if (p !== null) answered += 1; });

    for (var i = 0; i < N; i++) {
      if (gift[i] === "friend") friendConsistent += 1;
      if (self[i] === null) continue;
      if (self[i] === "friend") {
        // their own pick coincides with the friend's stated preference
        shares += 1;
      } else {
        // own pick differs — the only items where adoption is observable
        incong += 1;
        if (gift[i] === "friend") adopted += 1;
      }
    }

    state.gift_choices = gift.join(",");
    state.self_choices = self.join(",");
    state.n_answered = answered;
    state.n_friend_consistent = friendConsistent;
    state.n_incongruent_items = incong;
    state.n_adopted_on_incongruent = adopted;
    state.n_self_matches_friend = shares;

    render();
    report();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
