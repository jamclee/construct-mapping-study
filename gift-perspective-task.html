<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choosing a Gift</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }
  #scenario ul { margin: 0 0 11px; padding-left: 20px; }
  #scenario li { margin-bottom: 4px; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .tname { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 5px; }
  .odesc { font-size: 12.5px; color: #4a5158; margin: 0 0 7px; }
  .oprice { font-size: 12.5px; color: #737b82; margin: 0; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scenario"></div>

  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>

  <div id="done">Your answers have been recorded. Please continue.</div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE — CHOOSING FOR ANOTHER PERSON

     Gift-giving is the vehicle because its documented failure mode is exactly
     the standpoint failure being measured: people buy what THEY would want.
     Another person's preferences invite projection in a way an institutional
     policy does not, which makes this a harder test of standpoint.

     WHY THE SELF-PASS COMES FIRST — THE ZERO-DENOMINATOR PROBLEM. Adoption is
     only observable on items where the participant's own preference DIFFERS
     from the friend's. With a fixed friend, a participant whose taste happens
     to match Sam's on every item yields no signal at all. With majority-position
     preferences that is roughly a quarter of a sample.

     So the participant's own choices are collected first, and Sam's stated
     preferences are then TAILORED: opposite on three of the four items, matching
     on one. Every participant therefore has a denominator of three, and the one
     matching item keeps the opposition from looking systematic.

     WHY CUEING IS ACCEPTABLE HERE. Asking about own preferences first reveals
     which dimensions matter. For an acquisition probe that would be fatal —
     telling people what to look for defeats the measure. For perspective
     adoption it is nearly harmless: the dimensions are visible on screen
     regardless, and knowing them does not help anyone fake occupying someone
     else's standpoint.

     BACK NAVIGATION IS SEALED between phases. Once Sam's preferences have been
     computed from the phase-one answers, returning to change those answers
     would invalidate the tailoring, so Back stops at the phase boundary.

     THE KEY MEASURE is n_adopted_on_incongruent — on the three items where the
     participant's own pick differed from Sam's stated preference, how often did
     they still choose for Sam. Raw consistency with Sam is not informative on
     its own. n_incongruent_items is logged as the denominator and should be
     reported rather than buried.

     FOUR DIMENSIONS, NOT ONE REPEATED: practical versus decorative, one quality
     item versus a set, something to keep versus an outing, familiar versus
     novel. Prices are matched within each pair so cost cannot drive the choice.
     ------------------------------------------------------------------ */

  var PROBE_ID = "GIFT_PERSP";
  var FRIEND = "Sam";
  var N_MATCHING = 1;   // items where Sam is made to agree with the participant

  /* Each item has two options, kinds "x" and "y", and a phrasing of the
     preference that each option expresses. Sam's stated preferences are
     assembled from these after the self-pass. */
  var ITEMS = [
    { label: "Option one",
      x: { kind: "x", name: "A compact tool kit",
           desc: "Screwdrivers, pliers and a small hammer in a case", price: "$38" },
      y: { kind: "y", name: "A framed print",
           desc: "A landscape print in a simple wooden frame", price: "$36" },
      pref: { x: "would rather have something they can use than something to look at",
              y: "would rather have something nice to look at than another practical thing" } },

    { label: "Option two",
      x: { kind: "x", name: "One hand-thrown mug",
           desc: "A single large mug from a local pottery", price: "$34" },
      y: { kind: "y", name: "A set of six mugs",
           desc: "Six matching patterned mugs in a box", price: "$35" },
      pref: { x: "prefers one well-made thing to a set of smaller ones",
              y: "prefers a set they can use every day to one special piece" } },

    { label: "Option three",
      x: { kind: "x", name: "A hardcover book",
           desc: "A well-reviewed novel in hardcover", price: "$32" },
      y: { kind: "y", name: "A cinema gift card",
           desc: "Admits two, valid for a year", price: "$32" },
      pref: { x: "would rather be given something to keep than an outing",
              y: "would rather be given an outing than another thing to keep" } },

    { label: "Option four",
      x: { kind: "x", name: "A box of classic chocolates",
           desc: "Familiar flavours, traditional assortment", price: "$29" },
      y: { kind: "y", name: "An unusual flavour selection",
           desc: "Chilli, miso and other uncommon pairings", price: "$30" },
      pref: { x: "sticks to things they already know they like",
              y: "likes trying things they have never had before" } }
  ];

  /* ---------------- setup ---------------- */

  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function other(k) { return k === "x" ? "y" : "x"; }

  var order = shuffle(ITEMS);
  var N = order.length;

  // Eight slides: four for the self, then the same four for the friend.
  var SLIDES = [];
  order.forEach(function (it, i) { SLIDES.push({ item: it, idx: i, phase: "self" }); });
  order.forEach(function (it, i) { SLIDES.push({ item: it, idx: i, phase: "gift" }); });

  // Which items Sam will be made to agree with. Chosen up front; only revealed
  // once the self-pass is complete.
  var matchingItems = shuffle([0, 1, 2, 3]).slice(0, N_MATCHING);
  var samPrefers = new Array(N).fill(null);

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    item_order: order.map(function (t) { return t.label; }).join(","),
    side_order: null,
    matching_items: matchingItems.join(","),   // indices where Sam agrees by design
    self_choices: null,
    gift_choices: null,
    sam_prefers: null,
    n_incongruent_items: 0,          // the denominator — should be N - N_MATCHING
    n_adopted_on_incongruent: 0,     // THE KEY MEASURE
    n_projected_on_incongruent: 0,   // chose their own preference instead
    n_gift_matches_sam: 0,           // raw consistency, all items
    n_answered: 0,
    trial_dwell: null,
    n_back: 0,
    t_first_interaction: null,
    t_phase2_start: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario text ---------------- */

  var scenarioEl = document.getElementById("scenario");

  var SELF_TEXT =
    '<p>Imagine that you are browsing a small gift shop. For each pair below, ' +
    'choose the one that appeals to you more.</p>';

  function giftText() {
    var bullets = order.map(function (it, i) {
      return '<li>' + FRIEND + ' ' + it.pref[samPrefers[i]] + '.</li>';
    }).join("");
    return '<p>While you are there you remember that it is your friend ' + FRIEND +
           '&rsquo;s birthday next week. Thinking back over things ' + FRIEND +
           ' has said:</p><ul>' + bullets + '</ul>' +
           '<p>For each pair, choose the gift you would give ' + FRIEND + '.</p>';
  }

  scenarioEl.innerHTML = SELF_TEXT;

  /* ---------------- render ---------------- */

  // Side order is fixed per ITEM so the layout is identical in both phases and
  // any switch reflects preference rather than repositioning.
  var sideOrder = order.map(function () { return coin(); });
  state.side_order = sideOrder.map(function (v) { return v ? "x" : "y"; }).join(",");

  function optCard(o) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + o.name + '</p>' +
             '<p class="odesc">' + o.desc + '</p>' +
             '<p class="oprice">' + o.price + '</p>' +
           '</div>';
  }

  document.getElementById("track").innerHTML = SLIDES.map(function (sl, i) {
    var first = sideOrder[sl.idx] ? sl.item.x : sl.item.y;
    var second = sideOrder[sl.idx] ? sl.item.y : sl.item.x;
    return '<div class="slide" data-slide="' + i + '">' +
             '<p class="tname">' + sl.item.label + '</p>' +
             '<div class="opts2">' + optCard(first) + optCard(second) + '</div>' +
           '</div>';
  }).join("");

  document.getElementById("dots").innerHTML =
    SLIDES.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(SLIDES.length).fill(null);
  var dwell = new Array(SLIDES.length).fill(0);
  var index = 0;
  var enteredAt = Date.now();
  var phase2Started = false;

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  /* Tailoring: Sam agrees on the pre-selected matching items and takes the
     opposite position on the rest. Computed once, from the self-pass answers. */
  function computeSamPreferences() {
    for (var i = 0; i < N; i++) {
      var own = picks[i];
      samPrefers[i] = matchingItems.indexOf(i) !== -1 ? own : other(own);
    }
    state.sam_prefers = samPrefers.join(",");
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    var ph = SLIDES[index].phase;
    document.getElementById("counter").textContent =
      (ph === "self" ? "For yourself" : "Gift for " + FRIEND) +
      " — " + ((index % N) + 1) + " of " + N;
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && picks[i] !== null);
    });
    scenarioEl.innerHTML = ph === "self" ? SELF_TEXT : giftText();
    // Back stops at the phase boundary: revisiting the self-pass after Sam's
    // preferences have been derived from it would invalidate the tailoring.
    backBtn.disabled = index === 0 || (phase2Started && index === N);
    nextBtn.disabled = picks[index] === null;
    nextBtn.textContent = index === SLIDES.length - 1 ? "Done" : "Next";
    reportHeight();
  }

  function goTo(i) {
    accrue();
    if (i >= N && !phase2Started) {
      phase2Started = true;
      state.t_phase2_start = Date.now() - t0;
      computeSamPreferences();
    }
    index = i; enteredAt = Date.now(); render(); report();
  }

  backBtn.addEventListener("click", function () {
    if (backBtn.disabled) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < SLIDES.length - 1) { goTo(index + 1); return; }
    accrue();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;

    markInteraction();
    var slide = card.closest(".slide");
    var si = parseInt(slide.getAttribute("data-slide"), 10);

    slide.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[si] = card.getAttribute("data-kind");

    var self = picks.slice(0, N);
    var gift = picks.slice(N);
    var answered = 0, incong = 0, adopted = 0, projected = 0, matches = 0;

    picks.forEach(function (p) { if (p !== null) answered += 1; });

    for (var i = 0; i < N; i++) {
      if (samPrefers[i] === null || gift[i] === null) continue;
      if (gift[i] === samPrefers[i]) matches += 1;
      if (samPrefers[i] !== self[i]) {
        incong += 1;
        if (gift[i] === samPrefers[i]) adopted += 1;
        else projected += 1;
      }
    }

    state.self_choices = self.join(",");
    state.gift_choices = gift.join(",");
    state.n_answered = answered;
    state.n_incongruent_items = incong;
    state.n_adopted_on_incongruent = adopted;
    state.n_projected_on_incongruent = projected;
    state.n_gift_matches_sam = matches;

    render();
    report();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
