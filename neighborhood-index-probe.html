<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Listings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .scenario { font-size: 15px; margin: 0 0 8px; }
  .scenario p { margin: 0 0 11px; }

  /* definition box — the attribute is introduced here, once, in plain sight */
  .defbox {
    margin: 16px 0 0; padding: 13px 15px;
    background: #f7f9fb; border: 1px solid #e6ebf0; border-left: 3px solid #2f6fb0;
    border-radius: 6px;
  }
  .defbox h3 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .defbox p { font-size: 14px; margin: 0 0 8px; }
  .dirline { font-weight: 600; }

  .units { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0 0; }
  .card { border: 1px solid #dfe3e7; border-radius: 7px; padding: 14px 15px; background: #fff; }

  .name { font-size: 15.5px; font-weight: 600; margin: 0 0 2px; }
  .addr { font-size: 12.5px; color: #737b82; margin: 0 0 8px; }
  .price { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .price span { font-size: 12.5px; font-weight: 400; color: #737b82; }

  .prow { display: flex; gap: 10px; font-size: 13px; padding: 2.5px 0; }
  .plab { flex: 0 0 104px; color: #737b82; }
  .pval { color: #1f2328; }

  .nirow {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid #e6ebf0;
  }
  .nilab { font-size: 12.5px; color: #737b82; }
  .nival { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; }
  .nimax { font-size: 12.5px; font-weight: 400; color: #737b82; }

  .panelbtn {
    display: flex; align-items: center; gap: 6px; width: 100%;
    margin-top: 12px; padding: 7px 10px;
    border: 1px solid #c8ced4; border-radius: 5px; background: #fff;
    font-family: inherit; font-size: 13px; font-weight: 500; color: #2f6fb0;
    text-align: left; cursor: pointer;
  }
  .panelbtn:hover { border-color: #2f6fb0; background: #f2f7fc; }
  .panelbtn .chev {
    width: 7px; height: 7px; flex-shrink: 0; margin-left: auto;
    border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
  }
  .panel { display: none; margin-top: 8px; padding: 10px 11px;
           background: #fff; border: 1px solid #e6ebf0; border-radius: 6px; }
  .panel.open { display: block; }

  .decision { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }

  #comp { display: none; }
  #comp.open { display: block; }
  /* single-screen layout: the items sit directly under the listings, so they
     need a rule to separate them from the stimulus they refer to */
  #comp.inline { margin-top: 26px; padding-top: 20px; border-top: 1px solid #e6e8eb; }
  .compintro { font-size: 13px; color: #737b82; margin: 0 0 16px; }
  .compq { margin-bottom: 20px; }
  .compq p { font-size: 14.5px; margin: 0 0 9px; }
  .opts { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 8px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  @media (max-width: 560px) { .units { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="stimulus">
    <div class="scenario" id="scenario"></div>
    <div class="defbox" id="defbox"></div>
    <div class="units" id="units"></div>
    <div class="decision" id="continueWrap">
      <button type="button" class="choicebtn" id="continueBtn">Continue</button>
    </div>
  </div>

  <div id="comp"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     NOVEL-ATTRIBUTE COMPREHENSION PROBE — "Neighborhood Index"

     PURPOSE. Introduce an attribute the respondent has no prior experience
     with, then test whether two things are understood: (a) WHAT the attribute
     refers to, and (b) WHICH DIRECTION of the scale is favourable. This is a
     comprehension check on newly presented information, not a knowledge test —
     everything needed to answer is on the screen while the items are answered.

     WHY DIRECTION IS RANDOMISED. A 0-100 attribute called a "score" recruits a
     strong lay prior (school grades: higher is better, 100 is the ceiling). If
     the stated direction always matched that prior, the direction item would be
     passed by every respondent who never read the definition, and the item
     would measure the prior rather than comprehension. Direction is therefore
     assigned by coin flip and stated once in the definition box:

         higher_better : "Higher numbers mean a better-rated neighborhood."
         higher_worse  : "Lower numbers mean a better-rated neighborhood."

     Neither is implausible — real-world indices run both ways (golf handicap,
     air-quality index, crime rate per 1,000). The name "Index" rather than
     "Score" was chosen because it is directionally neutral in ordinary usage.

     THE DIAGNOSTIC QUANTITY IS THE ASYMMETRY. Direction accuracy in
     higher_worse minus direction accuracy in higher_better estimates how far
     respondents are substituting the prior for the presented information.
     Accuracy at ceiling in higher_better with chance accuracy in higher_worse
     is the signature of a respondent population that never read the box.
     Analyse `comp_direction_correct` with `direction` as a factor; do not pool.

     DECONFOUNDING. The listing with the higher index is deliberately the
     smaller, cheaper unit, and no other attribute on the cards speaks to the
     surrounding area. Otherwise rent could stand in for the index and the
     direction item would be answerable from price intuitions alone. Card
     position is randomised independently of which unit carries the high index.

     NO MEMORY DEMAND: THE STIMULUS STAYS ON SCREEN (SINGLE_SCREEN, default
     true). Definition, listings and items are all rendered together at load,
     with no intervening page or Continue step, so nothing has to be held in
     mind. This is deliberate. A respondent who fails an item here has not
     forgotten the definition — it is directly above the question — so failure
     is attributable to not reading or not understanding rather than to
     retention. That is the cleaner comprehension construct, and it is also the
     fairer one: retention failures would otherwise be scored as comprehension
     failures, which inflates exclusion rates and correlates with working
     memory rather than with effort.

     WHAT CO-VISIBILITY COSTS, AND WHY THE ITEMS STILL DISCRIMINATE. Open-book
     presentation makes the `meaning` item close to a verbatim match against the
     definition box — it will run near ceiling, and should be read as a floor
     check ("did they engage with the screen at all") rather than as a graded
     measure. The discriminating power sits in the other two items, and neither
     is weakened by co-visibility:

       direction — cannot be answered from the lay prior in the higher_worse
                   condition no matter how long the box is on screen, so it
                   separates reading from assuming.
       scope     — requires an inference (the index attaches to an address, so
                   two units in one building share it) that is not stated
                   verbatim anywhere, so it cannot be satisfied by matching.

     RESPONSE LATENCY CARRIES REAL SIGNAL IN THIS LAYOUT. With the definition
     permanently available, `t_first_answer` and the interval to `t_comp_done`
     distinguish respondents who consulted it from those who answered from the
     prior. A fast correct direction answer in higher_worse is genuine reading;
     a fast incorrect one is the prior firing. Keep the timing fields in the
     analysis — in single-screen mode they do work that accuracy alone cannot.

     To restore the sequential, memory-loaded version, set SINGLE_SCREEN false;
     HIDE_STIMULUS then governs whether the stimulus is withdrawn once the items
     appear. Both numbers referenced by the direction item are restated inside
     the question stem, so withdrawal never makes an item unanswerable.
     ------------------------------------------------------------------ */

  var PROBE_ID = "NI_COMP";

  /* ---------------- configuration ---------------- */

  var SINGLE_SCREEN = true;   // items render with the stimulus; no Continue step, no memory demand
  var HIDE_STIMULUS = false;  // sequential mode only: withdraw the stimulus when the items appear
  var FORCE_DIRECTION = null; // "higher_better" | "higher_worse" to disable randomisation
  var PASS_KEYS = ["meaning", "direction"];  // scope is the hard item; not in the criterion

  /* ---------------- randomisation ---------------- */

  function coin() { return Math.random() < 0.5; }

  var direction = FORCE_DIRECTION || (coin() ? "higher_better" : "higher_worse");
  var highLeft = coin();   // does the high-index unit sit on the left?

  var HIGH_NI = 78;
  var LOW_NI = 34;

  /* ---------------- listings ----------------
     Rent, size, floor and laundry all favour the LOW-index unit, so no
     attribute other than the index itself carries information about the
     surrounding area. */

  var UNITS = {
    high: {
      key: "high",
      name: "1 bedroom, 1 bath",
      addr: "512 Marlow Street, Apt 3",
      price: "$1,450",
      priceNote: "per month",
      rows: [
        ["Size", "620 sq ft"],
        ["Floor", "3rd, walk-up"],
        ["Laundry", "Shared, in basement"],
        ["Lease", "12 months"]
      ],
      ni: HIGH_NI
    },
    low: {
      key: "low",
      name: "1 bedroom, 1 bath",
      addr: "88 Deerfield Court, Apt 12",
      price: "$1,610",
      priceNote: "per month",
      rows: [
        ["Size", "810 sq ft"],
        ["Floor", "2nd, elevator"],
        ["Laundry", "In unit"],
        ["Lease", "12 months"]
      ],
      ni: LOW_NI
    }
  };

  var displayOrder = highLeft ? ["high", "low"] : ["low", "high"];

  /* ---------------- comprehension items ----------------
     meaning   — what the attribute refers to. The critical distractor is the
                 unit-level reading: an attribute of the apartment rather than
                 of the area around it. That confusion, not blank ignorance, is
                 the common failure mode for aggregate location attributes.
     direction — application form ("which of these two is better") rather than
                 abstract form ("does higher mean better"). Application is
                 harder to satisfy by parroting the definition sentence and is
                 the form the attribute would actually be used in.
     scope     — the boundary item. Two units in the SAME BUILDING share an
                 address, so they share the index. Answering requires knowing
                 the index attaches to a location rather than to a listing.
                 Harder than the other two and excluded from PASS_KEYS by
                 default; keep it as a graded comprehension measure. */

  var dirText = direction === "higher_better"
    ? "Higher numbers mean a better-rated neighborhood."
    : "Lower numbers mean a better-rated neighborhood.";

  var COMP_ITEMS = [
    {
      key: "meaning",
      text: "What does the Neighborhood Index describe?",
      opts: [
        ["area",     "The area around the building — things like crime reports, noise, transit, and errands nearby"],
        ["unit",     "The condition and features of the apartment itself"],
        ["rent",     "How much the rent has changed over the past year"],
        ["landlord", "How current tenants rated their landlord"]
      ],
      correct: "area"
    },
    {
      key: "direction",
      text: "One apartment has a Neighborhood Index of " + HIGH_NI + ". Another has " + LOW_NI +
            ". Which one is in the better-rated neighborhood?",
      opts: [
        ["high",  "The one with " + HIGH_NI],
        ["low",   "The one with " + LOW_NI],
        ["equal", "They are rated about the same"],
        ["cant",  "The index does not say which neighborhood is better"]
      ],
      correct: direction === "higher_better" ? "high" : "low"
    },
    {
      key: "scope",
      text: "Two apartments in the same building are listed for rent. What would you expect of their Neighborhood Index numbers?",
      opts: [
        ["same",   "They would be the same"],
        ["differ", "They could be quite different from each other"],
        ["bigger", "The larger apartment would have the higher number"],
        ["unsure", "There is no way to tell"]
      ],
      correct: "same"
    }
  ];

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    direction: direction,                 // between-subjects factor
    high_index_left: highLeft ? 1 : 0,
    ni_high: HIGH_NI,
    ni_low: LOW_NI,

    t_first_interaction: null,
    opened_calc_panel: 0,                 // acquisition: opened the weights panel
    calc_panel_clicks: 0,
    t_calc_open: null,
    layout: SINGLE_SCREEN ? "single_screen" : "sequential",
    t_continue: null,                     // sequential mode: dwell before the items appear
    stimulus_hidden: (!SINGLE_SCREEN && HIDE_STIMULUS) ? 1 : 0,

    comp_meaning: null,   comp_meaning_first: null,   comp_meaning_correct: null,
    comp_direction: null, comp_direction_first: null, comp_direction_correct: null,
    comp_scope: null,     comp_scope_first: null,     comp_scope_correct: null,

    comp_answered: 0,
    comp_n_correct: 0,
    comp_n_correct_first: 0,              // first-pass accuracy, before revisions
    answer_changes: 0,
    passed: null,                         // meaning AND direction correct
    t_first_answer: null,
    t_comp_done: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- stimulus ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>Imagine you are looking for a one-bedroom apartment. Two listings from ' +
    'your search are shown below.</p>';

  document.getElementById("defbox").innerHTML =
    '<h3>Neighborhood Index</h3>' +
    '<p>Every listing on this site shows a <strong>Neighborhood Index</strong>, a number ' +
    'from 0 to 100 that the site calculates from the building’s address. It combines ' +
    'crime reports, noise complaints, transit access, and how easy it is to run everyday ' +
    'errands on foot within about half a mile.</p>' +
    '<p class="dirline">' + dirText + '</p>' +
    '<button type="button" class="panelbtn" id="calcBtn">' +
      'How the index is calculated<span class="chev"></span></button>' +
    '<div class="panel" id="calcPanel">' +
      '<div class="prow"><span class="plab">Safety</span>' +
        '<span class="pval">35% — reported incidents per 1,000 residents</span></div>' +
      '<div class="prow"><span class="plab">Errands</span>' +
        '<span class="pval">25% — groceries, pharmacy and services within walking distance</span></div>' +
      '<div class="prow"><span class="plab">Transit</span>' +
        '<span class="pval">25% — frequency and coverage of nearby service</span></div>' +
      '<div class="prow"><span class="plab">Quiet</span>' +
        '<span class="pval">15% — noise complaints filed in the surrounding area</span></div>' +
    '</div>';

  function rows(pairs) {
    return pairs.map(function (p) {
      return '<div class="prow"><span class="plab">' + p[0] +
             '</span><span class="pval">' + p[1] + '</span></div>';
    }).join("");
  }

  document.getElementById("units").innerHTML = displayOrder.map(function (k) {
    var u = UNITS[k];
    return '<div class="card" data-unit="' + k + '">' +
             '<p class="name">' + u.name + '</p>' +
             '<p class="addr">' + u.addr + '</p>' +
             '<div class="price">' + u.price + ' <span>' + u.priceNote + '</span></div>' +
             '<div style="margin-top:8px">' + rows(u.rows) + '</div>' +
             '<div class="nirow">' +
               '<span class="nilab">Neighborhood Index</span>' +
               '<span class="nival">' + u.ni + '<span class="nimax"> / 100</span></span>' +
             '</div>' +
           '</div>';
  }).join("");

  /* ---------------- gated calculation panel ----------------
     Secondary acquisition measure only. The weights it contains are NOT needed
     for any item — meaning, direction and scope are all answerable from the
     visible definition — so opening it is voluntary depth of processing rather
     than a prerequisite. Treat it as a covariate, never as a screener: it sits
     downstream of the same attentiveness the items are measuring. */

  document.getElementById("calcBtn").addEventListener("click", function () {
    markInteraction();
    state.calc_panel_clicks += 1;
    var panel = document.getElementById("calcPanel");
    panel.classList.toggle("open");
    if (!state.opened_calc_panel) {
      state.opened_calc_panel = 1;
      state.t_calc_open = Date.now() - t0;
    }
    report();
    reportHeight();
  });

  /* ---------------- items appear ----------------
     Single-screen: rendered immediately, below the listings, with the Continue
     step removed entirely — the respondent never leaves the page holding the
     definition. Sequential: gated behind Continue, which also yields a dwell
     measure the single-screen layout does not have. */

  if (SINGLE_SCREEN) {
    // showComprehension() closes over vars declared below, so the call itself
    // is made at the end of the IIFE; only the Continue step is removed here.
    document.getElementById("continueWrap").style.display = "none";
  } else {
    document.getElementById("continueBtn").addEventListener("click", function () {
      markInteraction();
      state.t_continue = Date.now() - t0;
      if (HIDE_STIMULUS) document.getElementById("stimulus").style.display = "none";
      showComprehension();
      report();
      reportHeight();
    });
  }

  /* ---------------- comprehension block ---------------- */

  var compEl = document.getElementById("comp");
  var compShown = false;

  function showComprehension() {
    if (compShown) return;
    compShown = true;

    compEl.innerHTML =
      '<p class="compintro">' +
        (SINGLE_SCREEN
          ? 'A few quick questions about these listings. The information above stays ' +
            'on screen — look back at it as often as you like.'
          : 'A few quick questions about what you just read.') +
      '</p>' +
      COMP_ITEMS.map(function (q) {
        return '<div class="compq" data-q="' + q.key + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="opts">' + q.opts.map(function (o) {
                   return '<button type="button" class="opt" data-val="' + o[0] + '">' +
                          o[1] + '</button>';
                 }).join("") + '</div>' +
               '</div>';
      }).join("");
    compEl.classList.add("open");
    if (SINGLE_SCREEN) compEl.classList.add("inline");
  }

  compEl.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var block = opt.closest(".compq");
    var key = block.getAttribute("data-q");
    var val = opt.getAttribute("data-val");
    var prev = state["comp_" + key];

    if (prev !== null && prev !== val) state.answer_changes += 1;
    if (state["comp_" + key + "_first"] === null) state["comp_" + key + "_first"] = val;

    block.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("picked", b === opt);
    });
    state["comp_" + key] = val;

    if (state.t_first_answer === null) state.t_first_answer = Date.now() - t0;

    var answered = 0, correct = 0, correctFirst = 0;
    COMP_ITEMS.forEach(function (q) {
      var a = state["comp_" + q.key];
      var f = state["comp_" + q.key + "_first"];
      state["comp_" + q.key + "_correct"] = a === null ? null : (a === q.correct ? 1 : 0);
      if (a !== null) { answered += 1; if (a === q.correct) correct += 1; }
      if (f !== null && f === q.correct) correctFirst += 1;
    });
    state.comp_answered = answered;
    state.comp_n_correct = correct;
    state.comp_n_correct_first = correctFirst;

    if (answered === COMP_ITEMS.length) {
      state.t_comp_done = Date.now() - t0;
      state.passed = PASS_KEYS.every(function (k) {
        return state["comp_" + k + "_correct"] === 1;
      }) ? 1 : 0;
    }

    report();
    reportHeight();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  if (SINGLE_SCREEN) showComprehension();

  report();
  reportHeight();
})();
</script>
</body>
</html>
