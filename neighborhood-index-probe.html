<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Listings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .scenario { font-size: 15px; margin: 0 0 8px; }
  .scenario p { margin: 0 0 11px; }

  /* ATTRIBUTE PREAMBLE.
     Every attribute is one row of one table, rendered from a single template
     with identical weight, spacing and type. There is no callout box, no accent
     border and no emphasis on any row — the Neighborhood Index has to look like
     one ordinary entry in a standard conjoint attribute table. */
  .attrlist { margin: 14px 0 0; }
  table.attrtable { border-collapse: collapse; width: 100%; }
  table.attrtable th {
    text-align: left; font-size: 12px; font-weight: 600; color: #737b82;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0 14px 7px 0; border-bottom: 1px solid #c8ced4;
  }
  table.attrtable td {
    font-size: 14px; padding: 11px 14px 11px 0;
    border-bottom: 1px solid #e6ebf0; vertical-align: top;
  }
  table.attrtable tr:last-child td { border-bottom: none; }
  table.attrtable td.an { font-weight: 600; width: 172px; }
  table.attrtable td.ad { color: #33383d; }
  @media (max-width: 560px) { table.attrtable td.an { width: 118px; } }

  .panelbtn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 5px 9px;
    border: 1px solid #d7dce1; border-radius: 5px; background: #fff;
    font-family: inherit; font-size: 12.5px; font-weight: 500; color: #4a5158;
    text-align: left; cursor: pointer;
  }
  .panelbtn:hover { border-color: #9aa3ab; color: #1f2328; }
  .panelbtn .chev {
    width: 6px; height: 6px; flex-shrink: 0;
    border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
  }
  .panel { display: none; margin-top: 8px; padding: 9px 11px;
           background: #fafbfc; border: 1px solid #e6ebf0; border-radius: 5px; }
  .panel.open { display: block; }

  .units { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0 0; }
  .card { border: 1px solid #dfe3e7; border-radius: 7px; padding: 14px 15px; background: #fff; }

  .name { font-size: 15.5px; font-weight: 600; margin: 0 0 2px; }
  .addr { font-size: 12.5px; color: #737b82; margin: 0 0 8px; }
  .price { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .price span { font-size: 12.5px; font-weight: 400; color: #737b82; }

  .prow { display: flex; gap: 10px; font-size: 13px; padding: 2.5px 0; }
  .plab { flex: 0 0 104px; color: #737b82; }
  .pval { color: #1f2328; }

  /* the index row on a card is styled exactly like every other attribute row —
     no divider, no larger type, no accent */
  .nilab { flex: 0 0 104px; color: #737b82; }

  .decision { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }

  #comp { display: none; }
  #comp.open { display: block; }
  /* single-screen layout: the items sit directly under the material they refer
     to, so they need a rule to separate them from the stimulus */
  #comp.inline { margin-top: 26px; padding-top: 20px; border-top: 1px solid #e6e8eb; }
  .compintro { font-size: 14px; margin: 0 0 18px; }
  .compq { margin-bottom: 20px; }
  .compq p { font-size: 14.5px; margin: 0 0 9px; }
  .opts { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 8px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  @media (max-width: 560px) { .units { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="stimulus">
    <div class="scenario" id="scenario"></div>
    <div class="attrlist" id="attrlist"></div>
    <div class="scenario" id="exampleLead"></div>
    <div class="units" id="units"></div>
    <div class="decision" id="continueWrap">
      <button type="button" class="choicebtn" id="continueBtn">Continue</button>
    </div>
  </div>

  <div id="comp"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     NOVEL-ATTRIBUTE COMPREHENSION PROBE — "Neighborhood Index"

     PURPOSE. Introduce an attribute the respondent has no prior experience
     with, then test whether two things are understood: (a) WHAT the attribute
     refers to, and (b) WHICH DIRECTION of the scale is favourable. This is a
     comprehension check on newly presented information, not a knowledge test —
     everything needed to answer is on the screen while the items are answered.

     THE INDEX IS CAMOUFLAGED IN TWO PLACES, AND THE REASON IS THE SAME BOTH
     TIMES. A respondent who can tell which attribute the study cares about will
     attend to it differently from how they would in the real choice tasks, and
     the probe then measures compliance with a cue rather than the comprehension
     it is supposed to measure. So:

       (1) IN THE PREAMBLE. The index is one row of an ordinary conjoint
           attribute table (Attribute | Description), rendered from the same
           template as the other five, with no callout box, accent rule or bold.
           Descriptions are deliberately terse and kept within a narrow length
           band — the index cell has to carry a definition AND a direction
           sentence, so it is the longest, and the others are written to sit
           close enough that it does not read as the odd row out. Being visibly
           the longest cell is itself a cue; if you edit this copy, keep the
           band even. It sits THIRD of six — buried rather than first or last,
           both of which are recall-privileged positions. Critically, the direction
           sentence is NOT emphasised: bolding it would tell the respondent
           exactly which clause is about to be tested, which is precisely the
           thing the direction item must not do. Three attributes carry an
           identical "More detail" toggle, so the index is not the only row with
           one — a lone expander on a single attribute is itself a cue.

       (2) IN THE ITEM BLOCK. Three filler items about rent, lease and size are
           interleaved with the three index items, and the block opens and
           closes on a filler. The framing text refers to "the content that will
           be presented", not to any one attribute.

     FILLERS ARE SCORED, BUT SEPARATELY. `filler_n_correct` is reported and is
     worth keeping — it is a serviceable general-attentiveness covariate, and a
     respondent who misses the rent item has told you something. But it is NOT
     part of `passed`, and the index items are NOT pooled with it. Pooling would
     dilute the direction asymmetry described below, which is the whole point of
     the instrument.

     WHY DIRECTION IS RANDOMISED. A 0-100 attribute called a "score" recruits a
     strong lay prior (school grades: higher is better, 100 is the ceiling). If
     the stated direction always matched that prior, the direction item would be
     passed by every respondent who never read the preamble, and the item would
     measure the prior rather than comprehension. Direction is therefore
     assigned by coin flip and stated once, unemphasised, in the index row:

         higher_better : "Higher numbers mean a better-rated neighborhood."
         higher_worse  : "Lower numbers mean a better-rated neighborhood."

     Neither is implausible — real-world indices run both ways (golf handicap,
     air-quality index, crime rate per 1,000). The name "Index" rather than
     "Score" was chosen because it is directionally neutral in ordinary usage.

     THE DIAGNOSTIC QUANTITY IS THE ASYMMETRY. Direction accuracy in
     higher_worse minus direction accuracy in higher_better estimates how far
     respondents are substituting the prior for the presented information.
     Accuracy at ceiling in higher_better with chance accuracy in higher_worse
     is the signature of a respondent population that never read the preamble.
     Analyse `comp_direction_correct` with `direction` as a factor; do not pool.

     DECONFOUNDING. The listing with the higher index is deliberately the
     smaller, cheaper unit, and no other attribute on the cards speaks to the
     surrounding area. Otherwise rent could stand in for the index and the
     direction item would be answerable from price intuitions alone. Card
     position is randomised independently of which unit carries the high index.
     Lease term is held constant across the two cards so that the lease filler
     item cannot be answered by comparing them — it has to come from the
     preamble, like the other fillers.

     NO MEMORY DEMAND: THE STIMULUS STAYS ON SCREEN (SINGLE_SCREEN, default
     true). Preamble, listings and items are all rendered together at load, with
     no intervening page or Continue step, so nothing has to be held in mind.
     This is deliberate. A respondent who fails an item here has not forgotten
     the definition — it is directly above the question — so failure is
     attributable to not reading or not understanding rather than to retention.
     That is the cleaner comprehension construct, and it is also the fairer one:
     retention failures would otherwise be scored as comprehension failures,
     which inflates exclusion rates and correlates with working memory rather
     than with effort.

     WHAT CO-VISIBILITY COSTS, AND WHY THE ITEMS STILL DISCRIMINATE. Open-book
     presentation makes the `meaning` item close to a verbatim match against the
     index row — it will run near ceiling, and should be read as a floor check
     ("did they engage with the screen at all") rather than as a graded measure.
     The same is true of the three fillers. The discriminating power sits in the
     other two index items, and neither is weakened by co-visibility:

       direction — cannot be answered from the lay prior in the higher_worse
                   condition no matter how long the preamble is on screen, so it
                   separates reading from assuming. Camouflage matters most
                   here: an emphasised direction sentence would be found by
                   search rather than read in passing.
       scope     — requires an inference (the index attaches to an address, so
                   two units in one building share it) that is not stated
                   verbatim anywhere, so it cannot be satisfied by matching.

     RESPONSE LATENCY CARRIES REAL SIGNAL IN THIS LAYOUT. With the preamble
     permanently available, `t_first_answer` and the interval to `t_comp_done`
     distinguish respondents who consulted it from those who answered from the
     prior. A fast correct direction answer in higher_worse is genuine reading;
     a fast incorrect one is the prior firing. Keep the timing fields in the
     analysis — in single-screen mode they do work that accuracy alone cannot.

     To restore the sequential, memory-loaded version, set SINGLE_SCREEN false;
     HIDE_STIMULUS then governs whether the stimulus is withdrawn once the items
     appear. Both numbers referenced by the direction item are restated inside
     the question stem, so withdrawal never makes an item unanswerable.
     ------------------------------------------------------------------ */

  var PROBE_ID = "NI_COMP";

  /* ---------------- configuration ---------------- */

  var SINGLE_SCREEN = true;   // items render with the stimulus; no Continue step, no memory demand
  var HIDE_STIMULUS = false;  // sequential mode only: withdraw the stimulus when the items appear
  var FORCE_DIRECTION = null; // "higher_better" | "higher_worse" to disable randomisation
  var SHUFFLE_ITEMS = false;  // false keeps the fixed filler/index interleave below
  var PASS_KEYS = ["meaning", "direction"];  // scope is the hard item; not in the criterion

  /* ---------------- randomisation ---------------- */

  function coin() { return Math.random() < 0.5; }

  var direction = FORCE_DIRECTION || (coin() ? "higher_better" : "higher_worse");
  var highLeft = coin();   // does the high-index unit sit on the left?

  var HIGH_NI = 78;
  var LOW_NI = 34;

  var dirText = direction === "higher_better"
    ? "Higher numbers mean a better-rated neighborhood."
    : "Lower numbers mean a better-rated neighborhood.";

  /* ---------------- attribute preamble ----------------
     Six attributes, one template, matched paragraph lengths. The index sits
     third. `detail` adds an identical "More detail" toggle; three attributes
     have one so that the index is not the only expandable row. */

  var ATTRIBUTES = [
    {
      key: "rent",
      name: "Monthly rent",
      body: "What the unit costs per month. Utilities, application fees and the deposit " +
            "are all quoted separately."
    },
    {
      key: "size",
      name: "Size",
      body: "Floor area inside the unit, in square feet. Hallways, storage lockers and " +
            "balconies are excluded.",
      detail: "<div class=\"prow\"><span class=\"plab\">Measured</span>" +
              "<span class=\"pval\">Interior floor area, wall to wall</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Excludes</span>" +
              "<span class=\"pval\">Hallways, storage, balconies and patios</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Source</span>" +
              "<span class=\"pval\">Building floor plans on file with the city</span></div>"
    },
    {
      key: "ni",
      name: "Neighborhood Index",
      body: "A 0 to 100 rating of the area around the building, from crime, noise, " +
            "transit and nearby errands. " + dirText,
      detail: "<div class=\"prow\"><span class=\"plab\">Safety</span>" +
              "<span class=\"pval\">35% — reported incidents per 1,000 residents</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Errands</span>" +
              "<span class=\"pval\">25% — groceries, pharmacy and services within walking distance</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Transit</span>" +
              "<span class=\"pval\">25% — frequency and coverage of nearby service</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Quiet</span>" +
              "<span class=\"pval\">15% — noise complaints filed in the surrounding area</span></div>"
    },
    {
      key: "floor",
      name: "Floor and access",
      body: "Which floor the unit is on, and whether it is a walk-up or the building has " +
            "an elevator."
    },
    {
      key: "laundry",
      name: "Laundry",
      body: "Whether there is a washer and dryer in the unit, a shared room in the " +
            "building, or no laundry on site."
    },
    {
      key: "lease",
      name: "Lease term",
      body: "How many months you agree to rent for. Leaving before the term is up " +
            "normally costs a fee.",
      detail: "<div class=\"prow\"><span class=\"plab\">Typical terms</span>" +
              "<span class=\"pval\">6, 12 or 18 months</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Early exit</span>" +
              "<span class=\"pval\">Usually one to two months' rent as a fee</span></div>" +
              "<div class=\"prow\"><span class=\"plab\">Renewal</span>" +
              "<span class=\"pval\">Offered near the end of the term, at the then-current rent</span></div>"
    }
  ];

  /* ---------------- listings ----------------
     Rent, size, floor and laundry all favour the LOW-index unit, so no
     attribute other than the index itself carries information about the
     surrounding area. Lease is held constant — see DECONFOUNDING above. */

  var UNITS = {
    high: {
      key: "high",
      name: "1 bedroom, 1 bath",
      addr: "512 Marlow Street, Apt 3",
      price: "$1,450",
      priceNote: "per month",
      rows: [
        ["Size", "620 sq ft"],
        ["Floor", "3rd, walk-up"],
        ["Laundry", "Shared, in basement"],
        ["Lease", "12 months"]
      ],
      ni: HIGH_NI
    },
    low: {
      key: "low",
      name: "1 bedroom, 1 bath",
      addr: "88 Deerfield Court, Apt 12",
      price: "$1,610",
      priceNote: "per month",
      rows: [
        ["Size", "810 sq ft"],
        ["Floor", "2nd, elevator"],
        ["Laundry", "In unit"],
        ["Lease", "12 months"]
      ],
      ni: LOW_NI
    }
  };

  var displayOrder = highLeft ? ["high", "low"] : ["low", "high"];

  /* ---------------- index items ----------------
     meaning   — what the attribute refers to. The critical distractor is the
                 unit-level reading: an attribute of the apartment rather than
                 of the area around it. That confusion, not blank ignorance, is
                 the common failure mode for aggregate location attributes.
     direction — application form ("which of these two is better") rather than
                 abstract form ("does higher mean better"). Application is
                 harder to satisfy by parroting the definition sentence and is
                 the form the attribute would actually be used in.
     scope     — the boundary item. Two units in the SAME BUILDING share an
                 address, so they share the index. Answering requires knowing
                 the index attaches to a location rather than to a listing.
                 Harder than the other two and excluded from PASS_KEYS by
                 default; keep it as a graded comprehension measure. */

  var NI_ITEMS = [
    {
      key: "meaning",
      text: "What does the Neighborhood Index describe?",
      opts: [
        ["area",     "The area around the building — things like crime reports, noise, transit, and errands nearby"],
        ["unit",     "The condition and features of the apartment itself"],
        ["rent",     "How much the rent has changed over the past year"],
        ["landlord", "How current tenants rated their landlord"]
      ],
      correct: "area"
    },
    {
      key: "direction",
      text: "One apartment has a Neighborhood Index of " + HIGH_NI + ". Another has " + LOW_NI +
            ". Which one is in the better-rated neighborhood?",
      opts: [
        ["high",  "The one with " + HIGH_NI],
        ["low",   "The one with " + LOW_NI],
        ["equal", "They are rated about the same"],
        ["cant",  "The index does not say which neighborhood is better"]
      ],
      correct: direction === "higher_better" ? "high" : "low"
    },
    {
      key: "scope",
      text: "Two apartments in the same building are listed for rent. What would you expect of their Neighborhood Index numbers?",
      opts: [
        ["same",   "They would be the same"],
        ["differ", "They could be quite different from each other"],
        ["bigger", "The larger apartment would have the higher number"],
        ["unsure", "There is no way to tell"]
      ],
      correct: "same"
    }
  ];

  /* ---------------- filler items ----------------
     Camouflage first, covariate second. Each is answerable from its own row in
     the preamble and from nothing else — in particular the lease item cannot be
     answered by comparing the two cards, because both carry the same term. They
     are deliberately easy: a filler that is hard would draw attention to itself
     and would also add noise to the general-attentiveness covariate. Scored
     into `filler_n_correct`, never into `passed`. */

  var FILLER_ITEMS = [
    {
      key: "rent",
      text: "The rent figure shown for each apartment is:",
      opts: [
        ["month",   "The amount due each month"],
        ["year",    "The amount due each year"],
        ["week",    "The amount due each week"],
        ["deposit", "A one-time deposit paid at signing"]
      ],
      correct: "month"
    },
    {
      key: "lease",
      text: "What does the lease term tell you?",
      opts: [
        ["months",  "How many months you agree to rent for"],
        ["listed",  "How long the apartment has been listed"],
        ["tenant",  "How long the current tenant has lived there"],
        ["notice",  "How much notice you must give before moving out"]
      ],
      correct: "months"
    },
    {
      key: "size",
      text: "The size shown for each apartment measures:",
      opts: [
        ["inside",  "The floor area inside the unit"],
        ["shared",  "The floor area including shared hallways"],
        ["building","The total size of the building"],
        ["rooms",   "The number of rooms in the unit"]
      ],
      correct: "inside"
    }
  ];

  /* Fixed interleave: opens and closes on a filler, no two index items adjacent
     except scope/size at the tail. Set SHUFFLE_ITEMS true to randomise instead,
     which trades this guaranteed spacing for protection against order effects. */

  var ORDER = ["f:rent", "n:meaning", "f:lease", "n:direction", "n:scope", "f:size"];

  function byKey(list, k) {
    for (var i = 0; i < list.length; i++) if (list[i].key === k) return list[i];
    return null;
  }

  var ALL_ITEMS = ORDER.map(function (tag) {
    var kind = tag.charAt(0);
    var key = tag.slice(2);
    var item = kind === "n" ? byKey(NI_ITEMS, key) : byKey(FILLER_ITEMS, key);
    return { kind: kind === "n" ? "ni" : "filler", item: item };
  });

  if (SHUFFLE_ITEMS) {
    for (var s = ALL_ITEMS.length - 1; s > 0; s--) {
      var sj = Math.floor(Math.random() * (s + 1));
      var st = ALL_ITEMS[s]; ALL_ITEMS[s] = ALL_ITEMS[sj]; ALL_ITEMS[sj] = st;
    }
  }

  function fieldFor(entry) {
    return (entry.kind === "ni" ? "comp_" : "filler_") + entry.item.key;
  }

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    direction: direction,                 // between-subjects factor
    high_index_left: highLeft ? 1 : 0,
    ni_high: HIGH_NI,
    ni_low: LOW_NI,
    layout: SINGLE_SCREEN ? "single_screen" : "sequential",
    item_order: ALL_ITEMS.map(function (e) { return fieldFor(e); }).join(","),
    n_items: ALL_ITEMS.length,

    t_first_interaction: null,
    panels_opened_n: 0,                   // how many "More detail" toggles were opened at all
    opened_ni_panel: 0,                   // acquisition: opened the index weights specifically
    t_ni_panel_open: null,
    panel_clicks: 0,
    t_continue: null,                     // sequential mode: dwell before the items appear
    stimulus_hidden: (!SINGLE_SCREEN && HIDE_STIMULUS) ? 1 : 0,

    n_answered: 0,
    answer_changes: 0,

    /* --- index items: THE MEASUREMENT --- */
    comp_n_correct: 0,                    // 0-3, index items only
    comp_n_correct_first: 0,              // first-pass accuracy, before revisions
    passed: null,                         // meaning AND direction correct

    /* --- fillers: covariate, never part of `passed` --- */
    filler_n_correct: 0,

    t_first_answer: null,
    t_comp_done: null
  };

  /* per-item fields are generated from the item lists, so the exported schema
     always matches whatever is actually asked */
  ALL_ITEMS.forEach(function (e) {
    var f = fieldFor(e);
    state[f] = null;
    state[f + "_first"] = null;
    state[f + "_correct"] = null;
  });
  ATTRIBUTES.forEach(function (a) {
    if (a.detail) state["panel_" + a.key + "_opened"] = 0;
  });

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- stimulus ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>Imagine you are looking for a one-bedroom apartment. In the tasks that follow ' +
    'you will be shown pairs of listings and asked which one you would prefer.</p>' +
    '<p>Every listing describes the same six things:</p>';

  document.getElementById("attrlist").innerHTML =
    '<table class="attrtable"><thead><tr>' +
      '<th scope="col">Attribute</th><th scope="col">Description</th>' +
    '</tr></thead><tbody>' +
    ATTRIBUTES.map(function (a) {
      return '<tr class="attr" data-attr="' + a.key + '">' +
               '<td class="an">' + a.name + '</td>' +
               '<td class="ad"><span class="attrbody">' + a.body + '</span>' +
               (a.detail
                 ? '<br><button type="button" class="panelbtn" data-panel="' + a.key + '">' +
                     'More detail<span class="chev"></span></button>' +
                   '<div class="panel" id="panel-' + a.key + '">' + a.detail + '</div>'
                 : "") +
               '</td>' +
             '</tr>';
    }).join("") +
    '</tbody></table>';

  document.getElementById("exampleLead").innerHTML =
    '<p style="margin-top:18px">Here is an example of a pair of listings.</p>';

  function rows(pairs) {
    return pairs.map(function (p) {
      return '<div class="prow"><span class="plab">' + p[0] +
             '</span><span class="pval">' + p[1] + '</span></div>';
    }).join("");
  }

  document.getElementById("units").innerHTML = displayOrder.map(function (k) {
    var u = UNITS[k];
    return '<div class="card" data-unit="' + k + '">' +
             '<p class="name">' + u.name + '</p>' +
             '<p class="addr">' + u.addr + '</p>' +
             '<div class="price">' + u.price + ' <span>' + u.priceNote + '</span></div>' +
             '<div style="margin-top:8px">' + rows(u.rows) +
               '<div class="prow"><span class="nilab">Neighborhood Index</span>' +
               '<span class="pval">' + u.ni + ' / 100</span></div>' +
             '</div>' +
           '</div>';
  }).join("");

  /* ---------------- gated detail panels ----------------
     Secondary acquisition measure only. Nothing inside any panel is needed for
     any item, so opening one is voluntary depth of processing rather than a
     prerequisite. Three attributes carry a panel so that the index is not the
     only expandable row — see the camouflage note in the header. Treat opens as
     a covariate, never as a screener: they sit downstream of the same
     attentiveness the items are measuring. `panels_opened_n` gives the general
     tendency to expand things, against which `opened_ni_panel` can be read. */

  document.getElementById("attrlist").addEventListener("click", function (e) {
    var btn = e.target.closest(".panelbtn");
    if (!btn) return;
    markInteraction();

    var key = btn.getAttribute("data-panel");
    state.panel_clicks += 1;
    document.getElementById("panel-" + key).classList.toggle("open");

    if (!state["panel_" + key + "_opened"]) {
      state["panel_" + key + "_opened"] = 1;
      state.panels_opened_n += 1;
      if (key === "ni") {
        state.opened_ni_panel = 1;
        state.t_ni_panel_open = Date.now() - t0;
      }
    }
    report();
    reportHeight();
  });

  /* ---------------- items appear ----------------
     Single-screen: rendered immediately, below the listings, with the Continue
     step removed entirely — the respondent never leaves the page holding the
     preamble. Sequential: gated behind Continue, which also yields a dwell
     measure the single-screen layout does not have. */

  if (SINGLE_SCREEN) {
    // showComprehension() closes over vars declared below, so the call itself
    // is made at the end of the IIFE; only the Continue step is removed here.
    document.getElementById("continueWrap").style.display = "none";
  } else {
    document.getElementById("continueBtn").addEventListener("click", function () {
      markInteraction();
      state.t_continue = Date.now() - t0;
      if (HIDE_STIMULUS) document.getElementById("stimulus").style.display = "none";
      showComprehension();
      report();
      reportHeight();
    });
  }

  /* ---------------- comprehension block ---------------- */

  var compEl = document.getElementById("comp");
  var compShown = false;

  function showComprehension() {
    if (compShown) return;
    compShown = true;

    compEl.innerHTML =
      '<p class="compintro">' +
        'To be sure you understand the content that will be presented in the subsequent ' +
        'choice tasks, we will ask you a few questions before proceeding.' +
        (SINGLE_SCREEN
          ? ' The information above stays on screen — look back at it as often as you like.'
          : '') +
      '</p>' +
      ALL_ITEMS.map(function (entry) {
        var q = entry.item;
        return '<div class="compq" data-q="' + fieldFor(entry) + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="opts">' + q.opts.map(function (o) {
                   return '<button type="button" class="opt" data-val="' + o[0] + '">' +
                          o[1] + '</button>';
                 }).join("") + '</div>' +
               '</div>';
      }).join("");
    compEl.classList.add("open");
    if (SINGLE_SCREEN) compEl.classList.add("inline");
  }

  compEl.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var block = opt.closest(".compq");
    var field = block.getAttribute("data-q");
    var val = opt.getAttribute("data-val");
    var prev = state[field];

    if (prev !== null && prev !== val) state.answer_changes += 1;
    if (state[field + "_first"] === null) state[field + "_first"] = val;

    block.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("picked", b === opt);
    });
    state[field] = val;

    if (state.t_first_answer === null) state.t_first_answer = Date.now() - t0;

    var answered = 0, niCorrect = 0, niCorrectFirst = 0, fillerCorrect = 0;
    ALL_ITEMS.forEach(function (entry) {
      var f = fieldFor(entry);
      var a = state[f];
      var first = state[f + "_first"];
      state[f + "_correct"] = a === null ? null : (a === entry.item.correct ? 1 : 0);
      if (a !== null) {
        answered += 1;
        if (a === entry.item.correct) {
          if (entry.kind === "ni") niCorrect += 1; else fillerCorrect += 1;
        }
      }
      if (entry.kind === "ni" && first !== null && first === entry.item.correct) {
        niCorrectFirst += 1;
      }
    });
    state.n_answered = answered;
    state.comp_n_correct = niCorrect;
    state.comp_n_correct_first = niCorrectFirst;
    state.filler_n_correct = fillerCorrect;

    if (answered === ALL_ITEMS.length) {
      state.t_comp_done = Date.now() - t0;
      state.passed = PASS_KEYS.every(function (k) {
        return state["comp_" + k + "_correct"] === 1;
      }) ? 1 : 0;
    }

    report();
    reportHeight();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  if (SINGLE_SCREEN) showComprehension();

  report();
  reportHeight();
})();
</script>
</body>
</html>
