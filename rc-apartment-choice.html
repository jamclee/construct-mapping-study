<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Choices</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .blockinst {
    font-size: 13.5px; color: #737b82; margin: 0 0 18px;
    padding-bottom: 12px; border-bottom: 1px solid #eef1f4;
  }
  .counter { float: right; font-size: 12.5px; color: #9aa1a8; }

  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.cmp { border-collapse: collapse; width: 100%; min-width: 320px; }
  table.cmp th, table.cmp td {
    border-bottom: 1px solid #eef1f4; padding: 9px 10px; text-align: left;
    font-size: 14px; vertical-align: top;
  }
  table.cmp th.attr, table.cmp td.attr {
    color: #737b82; font-weight: 400; white-space: nowrap;
    border-right: 1px solid #eef1f4;
  }
  table.cmp thead th { font-size: 14.5px; font-weight: 600; color: #1f2328; border-bottom: 1px solid #dfe3e7; }
  table.cmp td.val { font-variant-numeric: tabular-nums; }
  table.cmp .sel { background: #f2f7fc; }

  .qtext { font-size: 15px; font-weight: 500; margin: 20px 0 0; }
  .picks { display: flex; gap: 10px; margin: 12px 0 0; flex-wrap: wrap; }
  .pickbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 16px; border-radius: 5px; flex: 1 1 0; min-width: 120px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: center;
  }
  .pickbtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .pickbtn.chosen { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  .contwrap { margin-top: 22px; padding-top: 16px; border-top: 1px solid #e6e8eb; }
  .contbtn {
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    padding: 10px 26px; border-radius: 5px;
    border: 1px solid #2f6fb0; background: #2f6fb0; color: #fff; cursor: pointer;
  }
  .contbtn[disabled] { border-color: #dfe3e7; background: #f4f6f8; color: #a8afb6; cursor: default; }

  .done { font-size: 15px; color: #737b82; padding: 22px 0; }

  .pilot {
    margin-top: 26px; padding: 12px 14px; border: 1px solid #e0c58a;
    background: #fdf7e8; border-radius: 6px; font-size: 12.5px; color: #6a5320;
  }
  .pilot h4 { margin: 0 0 7px; font-size: 12.5px; }
  .pilot code { font-size: 11.5px; word-break: break-all; }
  .pilot .bad { color: #9c2c2c; font-weight: 600; }

  @media (max-width: 560px) {
    table.cmp th, table.cmp td { padding: 8px 7px; font-size: 13px; }
    .pickbtn { font-size: 13.5px; padding: 9px 10px; min-width: 96px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blockinst" id="blockinst"></div>
  <div id="screen"></div>
  <div id="pilot"></div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     APARTMENT CHOICE — item D Part 2, with its fillers built in

     FIVE room comparisons, one per screen. Exactly ONE of them contains a
     dominated alternative. Nothing to configure: pass the direction battery's
     answers and it assembles and orders itself.

       rc-dir-battery.html                  <- Part 1, the direction elicitation
       ...your own unrelated tasks...       <- the gap (see below)
       rc-apartment-choice.html?d1=..&d2=..&d3=..&t_elicit=..

     THE GAP IS YOURS TO PUT THERE, and it is not optional padding. Run Part 1
     immediately before this file and the item degrades into a short-term
     memory test: the respondent is matching rooms against something they said
     ten seconds ago, and consistency demand does the rest. Put real, unrelated
     tasks in between. `dom_room_gap_ms` records how long it actually was, so
     the gap is a measured variable rather than an assumption.

     WHAT IS ON EACH SCREEN

     All five sets are room comparisons with the same four attribute rows and
     the same two-option layout, so they differ in nothing but their values —
     the strongest camouflage available, since there is no format, domain or
     row difference left to notice.

       critical  Room A carries ALL THREE of the levels this respondent chose,
                 plus the lower rent. Room B carries all three unchosen levels
                 plus the higher rent, so it is worse on every row BY THEIR OWN
                 STATED PREFERENCES. Choosing it contradicts what they just
                 said, four times over. This is the only set that is scored.
       RM1, RM2  Built from the same directions, splitting their stated levels
                 two-to-one across the pair on DIFFERENT attributes, with the
                 better-matching room also the cheaper one.
       F7, F8    Fixed sets using levels outside the respondent's pref/other
                 vocabulary ("Three other people", "Part-furnished").

     WHY RM1 AND RM2 EXIST. A self-anchored item has a camouflage problem the
     other dominance probes do not: the critical set contains a room matching
     everything the respondent just said they wanted, at the lower rent. With
     fixed fillers only, that is the one set where an option was visibly built
     for them, and it announces itself. RM1 and RM2 make "the room that matches
     more of what I said, and costs less" an ordinary event in the block. They
     are near-dominant, never dominant — the other room still wins on one
     stated preference — so there is no correct answer and they are not scored.
     Their choice rate is worth reading anyway: it is the empirical ceiling on
     how often an attending respondent picks a mostly-worse option.

     WHY F7 AND F8 EXIST. Without them every room in the block would be
     recombined from the same six values, and four sets built from six values
     start to look like one set shown four times.

     THE RESIDUAL TELL, stated rather than hidden: the critical set is still
     the only three-of-three match. That cannot be disguised without weakening
     the item. Watch it in the position analysis — if the violation rate falls
     with position across respondents, people are learning to scan.

     WHAT THE FILE ENFORCES

       - The critical set is never first, never last, and its position is drawn
         uniformly at random among the legal slots, from `seed`. Recorded as
         `dom_room_pos_block`.
       - The completeness statement is in the block instructions, above every
         set, never on the critical set alone — that would be a tell.
       - Rents run $547–$612 and the critical pair sits inside that range, so
         it holds neither the cheapest nor the dearest room in the block.
       - Room side and address labels are randomised per set; nothing
         downstream may key on a displayed address.
       - Every set uses the same template and the same select-then-continue
         flow. No set carries a follow-up another set lacks.
       - A dominance check re-derives every relation from the built values on
         every load. This content does not exist until the respondent has
         answered the battery, so no hand check can ever have seen it.

     No back button, one set per screen, no feedback of any kind.

     URL PARAMETERS
       d1,d2,d3  REQUIRED, from the battery's chain_qs.
                 d1: two|five   d2: close|quiet   d3: furnished|unfurnished
                 Without them NOTHING renders and dom_room_chained = 0. There
                 is deliberately no fallback pair: an item scored against
                 directions the respondent never gave is worse than a missing
                 item, and unlike a missing item it is invisible in the data.
       t_elicit  timestamp from the battery, for dom_room_gap_ms
       seed      per-respondent seed; drives order, sides and labels
       pos       assigned position label, carried through as probe_position
       pilot     1 to show the realised order, the built rooms and the check
     ------------------------------------------------------------------ */

  var PROBE_ID = "DOM_ROOM";

  var BLOCK_INSTRUCTIONS =
    "You are looking for a room in a shared flat for the coming academic year. " +
    "On the next few screens you'll see pairs of rooms you have been offered. " +
    "For each pair, assume the rooms are identical in every respect apart from " +
    "what is listed, and pick the one you would actually take.";

  var LEVELS = {
    d1: { two: "Two other people", five: "Five other people" },
    d2: { close: "10-minute walk, busy area", quiet: "25-minute walk, quiet street" },
    d3: { furnished: "Furnished", unfurnished: "Unfurnished" }
  };
  var OPPOSITE = {
    two: "five", five: "two",
    close: "quiet", quiet: "close",
    furnished: "unfurnished", unfurnished: "furnished"
  };

  /* Which of the respondent's stated levels room "a" carries, and the rents.
     critical is 3-of-3 with the cheaper rent — the dominance. RM1 and RM2 are
     2-of-3 on different attributes, also with the cheaper rent, so the pattern
     "matches more, costs less" is not unique to the critical set. */
  var GENERATED = {
    critical: { pattern: [1, 1, 1], rents: ["$552", "$608"],
                labels: ["14 Bellmount Way", "3 Ryecroft Lane"] },
    RM1:      { pattern: [1, 1, 0], rents: ["$547", "$601"],
                labels: ["8 Marchmont Row", "51 Girton Street"] },
    RM2:      { pattern: [1, 0, 1], rents: ["$563", "$612"],
                labels: ["23 Hollowfield Lane", "12 Bratton Close"] }
  };

  var ROWS_FIXED = ["Monthly rent", "Housemates", "Location", "Furnishing"];

  /* Fixed fillers. Their rows are marked "none" — no universal direction and
     no relation to this respondent's stated levels — so the checker reports
     them as unscoreable rather than adjudicating them. That is correct: which
     of these rooms is better genuinely depends on the person, and it is
     harmless in a set that is never scored. */
  var FIXED = {
    /* Every room here must carry at least one level the generated sets never
       use, or it can come out identical to a generated room for some
       respondents — see the duplication check below, which exists because the
       first version of F7 did exactly that. Room a is anchored by "Four other
       people", room b by its walk description. */
    F7: {
      labels: ["9 Ashcombe Road", "22 Pelham Street"],
      a: ["$590", "Four other people",  "10-minute walk, quiet side street", "Part-furnished"],
      b: ["$555", "Two other people",   "30-minute walk, busy high street",  "Unfurnished"]
    },
    F8: {
      labels: ["41 Windover Street", "6 Calder Place"],
      a: ["$575", "Three other people", "15-minute walk, mixed streets", "Part-furnished"],
      b: ["$610", "Two other people",   "5-minute walk, busy main road", "Furnished"]
    }
  };

  var ORDER_POOL = ["critical", "RM1", "RM2", "F7", "F8"];

  /* ---------------- URL ---------------- */

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  var P = {
    d1: param("d1"), d2: param("d2"), d3: param("d3"),
    t_elicit: param("t_elicit"),
    seed: param("seed"),
    pos: param("pos"),
    pilot: param("pilot") === "1"
  };

  /* ---------------- seeded RNG ---------------- */

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    if (!str) str = String(Date.now()) + ":" + Math.random();
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seedUsed = P.seed || ("auto-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  var rng = mulberry32(hashSeed(seedUsed + "|" + PROBE_ID));
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------------- build the five sets ---------------- */

  var chained = 0, SETS = null;

  if (P.d1 && P.d2 && P.d3 && LEVELS.d1[P.d1] && LEVELS.d2[P.d2] && LEVELS.d3[P.d3]) {
    chained = 1;
    var pref  = [LEVELS.d1[P.d1], LEVELS.d2[P.d2], LEVELS.d3[P.d3]];
    var other = [LEVELS.d1[OPPOSITE[P.d1]], LEVELS.d2[OPPOSITE[P.d2]], LEVELS.d3[OPPOSITE[P.d3]]];

    var selfRows = [
      { label: ROWS_FIXED[0], dir: "low" },
      { label: ROWS_FIXED[1], dir: "self", pref: pref[0] },
      { label: ROWS_FIXED[2], dir: "self", pref: pref[1] },
      { label: ROWS_FIXED[3], dir: "self", pref: pref[2] }
    ];
    var noneRows = ROWS_FIXED.map(function (lab, i) {
      return { label: lab, dir: i === 0 ? "low" : "none" };
    });

    SETS = {};
    Object.keys(GENERATED).forEach(function (id) {
      var g = GENERATED[id];
      var aVals = [g.rents[0]], bVals = [g.rents[1]];
      for (var i = 0; i < 3; i++) {
        aVals.push(g.pattern[i] ? pref[i] : other[i]);
        bVals.push(g.pattern[i] ? other[i] : pref[i]);
      }
      SETS[id] = {
        kind: id === "critical" ? "critical" : "filler",
        dominated: id === "critical" ? "b" : null,
        nearDominated: id === "critical" ? null : "b",
        rows: selfRows,
        labels: g.labels,
        profiles: [{ key: "a", vals: aVals }, { key: "b", vals: bVals }]
      };
    });
    Object.keys(FIXED).forEach(function (id) {
      SETS[id] = {
        kind: "filler", dominated: null, nearDominated: null,
        rows: noneRows,
        labels: FIXED[id].labels,
        profiles: [{ key: "a", vals: FIXED[id].a }, { key: "b", vals: FIXED[id].b }]
      };
    });
  }

  /* ---------------- dominance check ---------------- */

  function numOf(v) {
    var m = String(v).replace(/,/g, "").match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  function rowCmp(row, vi, vj) {
    if (row.dir === "none") return 0;
    if (row.dir === "self") {
      var bi = (vi === row.pref) ? 1 : 0, bj = (vj === row.pref) ? 1 : 0;
      return bi === bj ? 0 : (bi > bj ? 1 : -1);
    }
    var a = numOf(vi), b = numOf(vj);
    if (a === null || b === null || a === b) return 0;
    return row.dir === "low" ? (a < b ? 1 : -1) : (a > b ? 1 : -1);
  }
  /* "weak" — better on some rows, worse on none, tied on the rest — has to be
     caught as well as "strict". It is not a coherence violation, since an
     indifferent respondent may pick either side, which is exactly why it must
     never turn up in a filler: a filler is meant to be a genuine trade-off. */
  function relation(s, i, j) {
    var better = 0, worse = 0, tie = 0;
    for (var r = 0; r < s.rows.length; r++) {
      var c = rowCmp(s.rows[r], s.profiles[i].vals[r], s.profiles[j].vals[r]);
      if (c > 0) better++; else if (c < 0) worse++; else tie++;
    }
    if (better === 0 && worse === 0) return "identical";
    if (worse === 0 && tie === 0) return "strict";
    if (worse === 0) return "weak";
    if (worse === 1 && tie === 0) return "near";
    return null;
  }
  var checkPassed = null, checkNotes = [];
  if (SETS) {
    checkPassed = 1;
    Object.keys(SETS).forEach(function (id) {
      var s = SETS[id];
      if (s.rows.some(function (r) { return r.dir === "none"; })) {
        checkNotes.push(id + ": skipped (levels this respondent never rated)");
        return;
      }
      var ab = relation(s, 0, 1), ba = relation(s, 1, 0);
      if (s.kind === "critical") {
        if (ab === "strict" && ba === null) {
          checkNotes.push(id + ": room b strictly dominated, as required");
        } else {
          checkPassed = 0;
          checkNotes.push("FAIL " + id + ": a→b " + ab + ", b→a " + ba + " (expected strict/null)");
        }
      } else {
        var bad = ["strict", "weak", "identical"];
        if (bad.indexOf(ab) === -1 && bad.indexOf(ba) === -1) {
          checkNotes.push(id + ": no dominated option; a→b " + ab);
        } else {
          checkPassed = 0;
          checkNotes.push("FAIL " + id + ": filler contains a dominated option (a→b " + ab + ", b→a " + ba + ")");
        }
      }
    });
    /* DUPLICATION CHECK. The fixed fillers are supposed to bring levels the
       generated sets never use. If a fixed room matches a generated room on
       all three non-rent attributes, it is the same room at a different price,
       the variety it was added for is gone, and — worse — the block now shows
       one respondent the same room twice, which is the kind of thing people
       notice. This can only be checked once the directions are known, because
       which combinations get generated depends on them. */
    var genRooms = {};
    ["critical", "RM1", "RM2"].forEach(function (id) {
      SETS[id].profiles.forEach(function (p) {
        genRooms[p.vals.slice(1).join("|")] = id;
      });
    });
    Object.keys(FIXED).forEach(function (id) {
      SETS[id].profiles.forEach(function (p) {
        var k = p.vals.slice(1).join("|");
        if (genRooms[k]) {
          checkPassed = 0;
          checkNotes.push("FAIL " + id + ": room " + p.key +
            " is identical to a room in " + genRooms[k] + " apart from rent");
        }
      });
    });

    if (!checkPassed && window.console) {
      console.warn("[" + PROBE_ID + "] DOMINANCE CHECK FAILED\n" + checkNotes.join("\n"));
    }
  }

  /* ---------------- order ----------------
     Rejection sampling over whole permutations, not insertion of the critical
     set into a shuffled filler list: both satisfy "never first, never last",
     but only this one samples uniformly among the orderings that do. Position
     has to be independent of everything else for the position analysis to
     mean anything. */

  var sequence = null, orderFailed = 0;
  if (SETS) {
    for (var attempt = 0; attempt < 2000; attempt++) {
      var s = shuffle(ORDER_POOL.slice());
      if (s[0] !== "critical" && s[s.length - 1] !== "critical") { sequence = s; break; }
    }
    if (!sequence) { sequence = ORDER_POOL.slice(); orderFailed = 1; }
  }

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    seed: seedUsed,
    probe_position: P.pos,
    dom_room_chained: chained,
    d1: P.d1, d2: P.d2, d3: P.d3,
    dom_room_gap_ms: null,
    sequence: sequence ? sequence.join(",") : null,
    n_sets: sequence ? sequence.length : 0,
    order_failed: orderFailed,
    check_passed: checkPassed,
    check_notes: checkNotes.join(" | "),
    dom_room_choice: null,
    dom_room_violation: null,
    dom_room_pos_block: null,
    dom_room_pos_option: null,
    dom_room_rt_ms: null,
    dom_room_rt_first_ms: null,
    dom_room_changes: 0,
    n_near_dom_choices: 0,
    n_sets_completed: 0,
    block_complete: 0,
    t_block_ms: null,
    sets: []
  };
  if (chained && P.t_elicit && /^\d+$/.test(P.t_elicit)) {
    state.dom_room_gap_ms = t0 - parseInt(P.t_elicit, 10);
  }

  /* ---------------- render ---------------- */

  var screen = document.getElementById("screen");
  var inst = document.getElementById("blockinst");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var display = {};
  if (SETS) {
    sequence.forEach(function (id) {
      var labels = shuffle(SETS[id].labels.slice());
      display[id] = {
        order: shuffle([0, 1]),
        labelOf: { a: labels[0], b: labels[1] }
      };
    });
  }

  var idx = 0, selected = null, changes = 0, tSetStart = 0, tFirst = null;

  if (!SETS) {
    /* Nothing renders. A blank embed is loud in testing and honest in the
       data; a fabricated default pair would be neither. */
    if (window.console) {
      console.warn("[" + PROBE_ID + "] no d1/d2/d3 — nothing rendered, dom_room_chained = 0");
    }
  } else {
    inst.innerHTML = '<span class="counter" id="counter"></span>' + BLOCK_INSTRUCTIONS;
    renderSet();
  }

  function renderSet() {
    var id = sequence[idx], s = SETS[id], d = display[id];
    selected = null; changes = 0; tFirst = null; tSetStart = Date.now();

    document.getElementById("counter").textContent = (idx + 1) + " of " + sequence.length;

    var h = '<div class="tablewrap"><table class="cmp"><thead><tr><th class="attr"></th>';
    d.order.forEach(function (pi) {
      h += '<th data-col="' + pi + '">' + esc(d.labelOf[s.profiles[pi].key]) + '</th>';
    });
    h += '</tr></thead><tbody>';
    s.rows.forEach(function (row, ri) {
      h += '<tr><td class="attr">' + esc(row.label) + '</td>';
      d.order.forEach(function (pi) {
        h += '<td class="val" data-col="' + pi + '">' + esc(s.profiles[pi].vals[ri]) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div><p class="qtext">Which room would you take?</p><div class="picks">';
    d.order.forEach(function (pi) {
      h += '<button type="button" class="pickbtn" data-pi="' + pi + '">' +
           esc(d.labelOf[s.profiles[pi].key]) + '</button>';
    });
    h += '</div><div class="contwrap"><button type="button" class="contbtn" id="cont" disabled>Continue</button></div>';
    screen.innerHTML = h;

    Array.prototype.forEach.call(screen.querySelectorAll(".pickbtn"), function (btn) {
      btn.addEventListener("click", function () {
        var pi = parseInt(btn.getAttribute("data-pi"), 10);
        if (selected !== null && selected !== pi) changes++;
        if (tFirst === null) tFirst = Date.now() - tSetStart;
        selected = pi;
        Array.prototype.forEach.call(screen.querySelectorAll(".pickbtn"), function (b) {
          b.classList.toggle("chosen", parseInt(b.getAttribute("data-pi"), 10) === pi);
        });
        Array.prototype.forEach.call(screen.querySelectorAll("[data-col]"), function (c) {
          c.classList.toggle("sel", parseInt(c.getAttribute("data-col"), 10) === pi);
        });
        document.getElementById("cont").disabled = false;
        reportHeight();
      });
    });

    document.getElementById("cont").addEventListener("click", function () {
      if (selected === null) return;
      recordSet();
      idx++;
      if (idx < sequence.length) { renderSet(); } else { finish(); }
      window.scrollTo(0, 0);
      reportHeight();
    });

    reportHeight();
  }

  function recordSet() {
    var id = sequence[idx], s = SETS[id], d = display[id];
    var key = s.profiles[selected].key;
    var row = {
      id: id,
      kind: s.kind,
      pos_block: idx + 1,
      choice_key: key,
      choice_label: d.labelOf[key],
      display_order: d.order.map(function (pi) { return s.profiles[pi].key; }).join(","),
      rt_first_ms: tFirst,
      rt_ms: Date.now() - tSetStart,
      changes: changes,
      violation: null,
      near_dom_choice: null
    };

    if (s.kind === "critical") {
      row.violation = (key === s.dominated) ? 1 : 0;
      state.dom_room_choice       = key;
      state.dom_room_violation    = row.violation;
      state.dom_room_pos_block    = row.pos_block;
      state.dom_room_pos_option   = d.order.indexOf(1) + 1;   /* profile "b" is index 1 */
      state.dom_room_rt_ms        = row.rt_ms;
      state.dom_room_rt_first_ms  = row.rt_first_ms;
      state.dom_room_changes      = row.changes;
    } else if (s.nearDominated) {
      row.near_dom_choice = (key === s.nearDominated) ? 1 : 0;
      if (row.near_dom_choice) state.n_near_dom_choices++;
      state["fill_" + id + "_near_dom_choice"] = row.near_dom_choice;
    }
    state["fill_" + id + "_choice"]    = (s.kind === "critical") ? undefined : key;
    if (s.kind !== "critical") {
      state["fill_" + id + "_rt_ms"]     = row.rt_ms;
      state["fill_" + id + "_pos_block"] = row.pos_block;
    }

    state.sets.push(row);
    state.n_sets_completed = state.sets.length;
    report();
  }

  function finish() {
    state.block_complete = 1;
    state.t_block_ms = Date.now() - t0;
    document.getElementById("counter").textContent = "";
    screen.innerHTML = '<p class="done">Thank you — that\'s the end of this section.</p>';
    report();
    reportHeight();
  }

  /* ---------------- pilot ---------------- */

  if (P.pilot) {
    var body;
    if (!SETS) {
      body = '<p class="bad">NOTHING RENDERED — d1/d2/d3 missing or invalid ' +
             '(got d1=' + esc(String(P.d1)) + ', d2=' + esc(String(P.d2)) +
             ', d3=' + esc(String(P.d3)) + '). dom_room_chained = 0.</p>' +
             '<p>Append the battery\'s <code>chain_qs</code> to this URL.</p>';
    } else {
      body = '<p><strong>Seed:</strong> <code>' + esc(seedUsed) + '</code>' +
             (orderFailed ? ' &nbsp; <span class="bad">ORDER CONSTRAINTS NOT MET</span>' : '') +
             '</p><p><strong>Realised order:</strong><br>' +
             sequence.map(function (id, i) {
               return (i + 1) + ". " + id + (id === "critical" ? "  [CRITICAL]" : "");
             }).join("<br>") + '</p>' +
             '<p><strong>Rooms:</strong><br>' +
             sequence.map(function (id) {
               return id + " a=[" + esc(SETS[id].profiles[0].vals.join(", ")) + "]<br>" +
                      new Array(id.length + 2).join("&nbsp;") + " b=[" + esc(SETS[id].profiles[1].vals.join(", ")) + "]";
             }).join("<br>") + '</p>' +
             '<p><strong>Dominance check:</strong> ' +
             (checkPassed ? 'passed' : '<span class="bad">FAILED</span>') + '<br>' +
             esc(checkNotes.join(" • ")) + '</p>';
    }
    document.getElementById("pilot").innerHTML =
      '<div class="pilot"><h4>PILOT PANEL — not shown to respondents (pilot=1)</h4>' + body + '</div>';
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }
  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  report();
})();
</script>
</body>
</html>
