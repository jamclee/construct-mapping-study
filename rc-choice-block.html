<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparisons</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .blockinst {
    font-size: 13.5px; color: #737b82; margin: 0 0 18px;
    padding-bottom: 12px; border-bottom: 1px solid #eef1f4;
  }
  .counter { float: right; font-size: 12.5px; color: #9aa1a8; }

  .lead { font-size: 15px; margin: 0 0 14px; }

  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.cmp { border-collapse: collapse; width: 100%; min-width: 340px; }
  table.cmp th, table.cmp td {
    border-bottom: 1px solid #eef1f4; padding: 9px 10px; text-align: left;
    font-size: 14px; vertical-align: top;
  }
  table.cmp th.attr, table.cmp td.attr {
    color: #737b82; font-weight: 400; white-space: nowrap;
    border-right: 1px solid #eef1f4;
  }
  table.cmp thead th { font-size: 14.5px; font-weight: 600; color: #1f2328; border-bottom: 1px solid #dfe3e7; }
  table.cmp td.val { font-variant-numeric: tabular-nums; }
  table.cmp col.sel, table.cmp .sel { background: #f2f7fc; }

  .picks { display: flex; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; }
  .pickbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 16px; border-radius: 5px; flex: 1 1 0; min-width: 120px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: center;
  }
  .pickbtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .pickbtn.chosen { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  .qtext { font-size: 15px; font-weight: 500; margin: 20px 0 0; }

  .contwrap { margin-top: 22px; padding-top: 16px; border-top: 1px solid #e6e8eb; }
  .contbtn {
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    padding: 10px 26px; border-radius: 5px;
    border: 1px solid #2f6fb0; background: #2f6fb0; color: #fff; cursor: pointer;
  }
  .contbtn[disabled] { border-color: #dfe3e7; background: #f4f6f8; color: #a8afb6; cursor: default; }

  .done { font-size: 15px; color: #737b82; padding: 22px 0; }

  .pilot {
    margin-top: 26px; padding: 12px 14px; border: 1px solid #e0c58a;
    background: #fdf7e8; border-radius: 6px; font-size: 12.5px; color: #6a5320;
  }
  .pilot h4 { margin: 0 0 7px; font-size: 12.5px; }
  .pilot code { font-size: 11.5px; }
  .pilot .bad { color: #9c2c2c; font-weight: 600; }

  @media (max-width: 560px) {
    table.cmp th, table.cmp td { padding: 8px 7px; font-size: 13px; }
    .pickbtn { font-size: 13.5px; padding: 9px 10px; min-width: 96px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blockinst" id="blockinst"></div>
  <div id="screen"></div>
  <div id="pilot"></div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     TABULAR CHOICE BLOCK — dominance probes inside filler comparisons

     Renders a sequence of attribute-comparison choice sets, one per screen,
     of which a named subset are CRITICAL sets containing a strictly dominated
     alternative. Everything else in the block is a genuine trade-off and is
     recorded but not scored.

     The block, not the item, is the unit of administration. A dominance item
     administered alone is recognisable, and a recognised dominance item is
     measuring test-wiseness rather than coherence. See
     response-coherence-probes.md §7 for the camouflage rules this file
     implements, and filler-choice-sets.md for the pool.

     WHAT THIS FILE ENFORCES SO THE SURVEY BUILDER CANNOT DRIFT:

       - Critical sets are never first, never last, never adjacent to each
         other, and are always preceded by a filler of the same domain AND the
         same option count (§7.4). If no such ordering exists for the requested
         composition, `block_constraint_failed` is set rather than a bad block
         being served silently.
       - The completeness statement lives in the block instructions, above
         every set, never in a critical set's own stem (§7.2). It is rendered
         once, persistently, so it cannot become a tell.
       - Option position and label-to-profile assignment are randomised per
         set; nothing downstream may key on a displayed label.
       - Every set uses the same template, the same response format and the
         same two-step select-then-continue flow. No set carries a follow-up
         another set lacks.
       - A runtime dominance check re-verifies the whole pool on every load
         (see POOL CHECK below), so a value edit that accidentally creates a
         dominated option in a filler is caught rather than silently becoming
         a fifth critical item nobody is scoring.

     No back button, one set per screen: sets cannot be compared or re-scanned.
     No feedback of any kind.

     URL PARAMETERS
       crit     csv of critical set ids to include   (default "dom_storage")
       fillers  csv of filler set ids, in pool order (default "F1,F2,F5,F6")
       seed     per-RESPONDENT seed, not per block — one seed across all
                blocks makes the realised design reconstructible from the data
                and stops two blocks drawing the same critical position
       d1,d2,d3 dom_room Part 1 answers, from dir-battery.html. Absent, the
                dom_room set is OMITTED and dom_room_chained = 0. It is never
                served against default directions the respondent never gave:
                that would be scored against a key nobody supplied, and unlike
                a missing set it would be invisible in the output.
       t_elicit timestamp of Part 1, for dom_room_gap_ms
       pos      assigned position label, carried through as probe_position
       pilot    1 to render the realised sequence and the pool check
     ------------------------------------------------------------------ */

  var PROBE_ID = "DOM_TABULAR";

  var BLOCK_INSTRUCTIONS =
    "On the next few screens you'll see a series of everyday comparisons. " +
    "For each one, assume the options are identical in every respect apart " +
    "from what is listed, and pick the one you would actually choose.";

  /* ---------------- the pool ----------------
     dir: how the checker signs a row.
       "low"  lower is better      "high" higher is better
       "yes"  Yes is better        "none" no universal direction — the set is
                                          unscoreable for dominance and the
                                          checker skips it
       "self" direction supplied by the respondent (dom_room only)
     ------------------------------------------ */

  var SETS = {

    /* ---- storage units, 2 options ---- */

    F1: {
      kind: "filler", domain: "storage", nearDominated: null,
      lead: "A small self-storage unit, rented for six months.",
      labels: ["Unit 3A", "Unit 8D"],
      rows: [
        { label: "Monthly rent",            dir: "low"  },
        { label: "Floor area",              dir: "high" },
        { label: "Distance from your home", dir: "low"  },
        { label: "Climate controlled",      dir: "yes"  },
        { label: "24-hour access",          dir: "yes"  }
      ],
      profiles: [
        { key: "a", vals: ["$68", "45 sq ft", "5.2 miles", "No",  "Yes"] },
        { key: "b", vals: ["$79", "60 sq ft", "2.4 miles", "Yes", "No" ] }
      ]
    },

    F2: {
      kind: "filler", domain: "storage", nearDominated: "b",
      lead: "A small self-storage unit, rented for six months.",
      labels: ["Unit 1B", "Unit 6F"],
      rows: [
        { label: "Monthly rent",            dir: "low"  },
        { label: "Floor area",              dir: "high" },
        { label: "Distance from your home", dir: "low"  },
        { label: "Climate controlled",      dir: "yes"  },
        { label: "24-hour access",          dir: "yes"  }
      ],
      profiles: [
        { key: "a", vals: ["$71", "55 sq ft", "2.9 miles", "Yes", "No" ] },
        { key: "b", vals: ["$88", "50 sq ft", "4.1 miles", "No",  "Yes"] }
      ]
    },

    /* ---- couriers, 3 options ---- */

    F3: {
      kind: "filler", domain: "courier", nearDominated: null,
      lead: "Sending a package across the country.",
      labels: ["Meridian Post", "Castleway", "Norbridge Freight"],
      rows: [
        { label: "Delivery",           dir: "low"  },
        { label: "Price",              dir: "low"  },
        { label: "Tracking",           dir: "yes"  },
        { label: "Insurance included", dir: "high" }
      ],
      profiles: [
        { key: "a", vals: ["3 business days", "$13.20", "Yes", "$50" ] },
        { key: "b", vals: ["5 business days", "$9.75",  "Yes", "$100"] },
        { key: "c", vals: ["2 business days", "$16.40", "No",  "$150"] }
      ]
    },

    F4: {
      kind: "filler", domain: "courier", nearDominated: "b",
      lead: "Sending a package across the country.",
      labels: ["Alderline", "Pemberton Courier", "Westhall Delivery"],
      rows: [
        { label: "Delivery",           dir: "low"  },
        { label: "Price",              dir: "low"  },
        { label: "Tracking",           dir: "yes"  },
        { label: "Insurance included", dir: "high" }
      ],
      profiles: [
        { key: "a", vals: ["2 business days", "$12.10", "Yes", "$150"] },
        { key: "b", vals: ["4 business days", "$9.80",  "No",  "$75" ] },
        { key: "c", vals: ["3 business days", "$10.50", "Yes", "$100"] }
      ]
    },

    /* ---- laptop repair, 2 options ---- */

    F5: {
      kind: "filler", domain: "repair", nearDominated: null,
      lead: "Getting a laptop repaired.",
      labels: ["Halgate Repairs", "Trenton Tech"],
      rows: [
        { label: "Price",                    dir: "low"  },
        { label: "Turnaround",               dir: "low"  },
        { label: "Warranty on the repair",   dir: "high" },
        { label: "Distance from your home",  dir: "low"  },
        { label: "Loaner machine available", dir: "yes"  }
      ],
      profiles: [
        { key: "a", vals: ["$145", "5 working days", "30 days", "1.2 miles", "No" ] },
        { key: "b", vals: ["$170", "2 working days", "90 days", "3.8 miles", "Yes"] }
      ]
    },

    /* ---- gyms, 3 options ---- */

    F6: {
      kind: "filler", domain: "gym", nearDominated: "c",
      lead: "Joining a gym for the year.",
      labels: ["Ironwood Fitness", "Quayside Gym", "Longmere Athletic"],
      rows: [
        { label: "Monthly fee",             dir: "low"  },
        { label: "Distance from your home", dir: "low"  },
        { label: "Pool",                    dir: "yes"  },
        { label: "Classes included",        dir: "high" }
      ],
      profiles: [
        { key: "a", vals: ["$29", "2.6 miles", "No",  "2 per week"] },
        { key: "b", vals: ["$41", "0.8 miles", "Yes", "Unlimited" ] },
        { key: "c", vals: ["$35", "1.9 miles", "No",  "6 per week"] }
      ]
    },

    /* ---- flatshare rooms, 2 options. The same four rows as dom_room Part 2,
           which is what lets Part 2 satisfy the same-domain precedence rule.
           Three of the rows have no universal direction, so this set is
           unscoreable for dominance and the pool check skips it — correctly:
           whether either room is dominated depends on the respondent. ---- */

    F7: {
      kind: "filler", domain: "room", nearDominated: null,
      lead: "A room in a shared flat, for the coming academic year.",
      labels: ["9 Ashcombe Road", "22 Pelham Street"],
      rows: [
        { label: "Monthly rent", dir: "low"  },
        { label: "Housemates",   dir: "none" },
        { label: "Location",     dir: "none" },
        { label: "Furnishing",   dir: "none" }
      ],
      profiles: [
        { key: "a", vals: ["$590", "Two other people",  "10-minute walk, busy area",       "Unfurnished"] },
        { key: "b", vals: ["$555", "Four other people", "20-minute walk, quiet street",    "Furnished"  ] }
      ]
    },

    /* Second room filler. Not decoration: dom_room can only be placed after a
       room-domain filler, so with one such filler in the pool it was landing
       systematically later in the block than dom_storage and dom_courier —
       an item-by-position association that would have contaminated the
       camouflage test in §7.4, where position has to be orthogonal to item.
       Two room fillers restore the balance. Levels overlap Part 2's
       vocabulary deliberately. */

    F8: {
      kind: "filler", domain: "room", nearDominated: null,
      lead: "A room in a shared flat, for the coming academic year.",
      labels: ["41 Windover Street", "6 Calder Place"],
      rows: [
        { label: "Monthly rent", dir: "low"  },
        { label: "Housemates",   dir: "none" },
        { label: "Location",     dir: "none" },
        { label: "Furnishing",   dir: "none" }
      ],
      profiles: [
        { key: "a", vals: ["$575", "Three other people", "15-minute walk, mixed streets", "Part-furnished"] },
        { key: "b", vals: ["$610", "Two other people",   "5-minute walk, busy main road", "Furnished"     ] }
      ]
    },

    /* ================= CRITICAL SETS ================= */

    /* Item A. Transparent aligned dominance. Rows shared verbatim with F1 and
       F2, so the only thing separating this set from theirs is the value
       matrix. Mixed polarity: the dominating profile carries the smaller
       number on rent and distance and the larger on area, so no
       single-direction number rule succeeds. */
    dom_storage: {
      kind: "critical", domain: "storage", dominated: "b",
      lead: "A small self-storage unit, rented for six months.",
      labels: ["Unit 4B", "Unit 7A"],
      rows: [
        { label: "Monthly rent",            dir: "low"  },
        { label: "Floor area",              dir: "high" },
        { label: "Distance from your home", dir: "low"  },
        { label: "Climate controlled",      dir: "yes"  },
        { label: "24-hour access",          dir: "yes"  }
      ],
      profiles: [
        { key: "a", vals: ["$74", "60 sq ft", "3.1 miles", "Yes", "Yes"] },
        { key: "b", vals: ["$86", "50 sq ft", "4.8 miles", "No",  "No" ] }
      ]
    },

    /* Item C. Within-set camouflage as well as block camouflage: profile "c"
       is strictly dominated by "a", while "b" is on the frontier — faster and
       better insured than "a", and dearer — so choosing "b" is entirely
       sensible and the set does not read as rigged. Pass = did not choose "c".
       Rows shared verbatim with F3 and F4. */
    dom_courier: {
      kind: "critical", domain: "courier", dominated: "c",
      lead: "Sending a package across the country.",
      labels: ["Coldharbour Express", "Ryeford Post", "Danforth Shipping"],
      rows: [
        { label: "Delivery",           dir: "low"  },
        { label: "Price",              dir: "low"  },
        { label: "Tracking",           dir: "yes"  },
        { label: "Insurance included", dir: "high" }
      ],
      profiles: [
        { key: "a", vals: ["3 business days", "$11.40", "Yes", "$100"] },
        { key: "b", vals: ["2 business days", "$18.90", "Yes", "$200"] },
        { key: "c", vals: ["4 business days", "$14.60", "No",  "$50" ] }
      ]
    }

    /* dom_room is built at runtime from d1/d2/d3 — see buildRoomSet(). */
  };

  /* The rooms dom_room Part 2 is assembled from. Rent runs in the
     universally-signed direction and dominates in favour of the respondent's
     own room, which protects a rent-lexicographic respondent exactly as a
     tie on price would not. */
  var ROOM_LEVELS = {
    d1: { two: "Two other people", five: "Five other people" },
    d2: { close: "10-minute walk, busy area", quiet: "25-minute walk, quiet street" },
    d3: { furnished: "Furnished", unfurnished: "Unfurnished" }
  };
  var ROOM_OPPOSITE = {
    two: "five", five: "two",
    close: "quiet", quiet: "close",
    furnished: "unfurnished", unfurnished: "furnished"
  };
  var ROOM_RENT = { preferred: "$540", other: "$615" };

  /* ---------------- URL ---------------- */

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  function csv(s) {
    if (!s) return [];
    return s.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
  }

  var P = {
    crit:    csv(param("crit")    || "dom_storage"),
    fillers: csv(param("fillers") || "F1,F2,F5,F6"),
    seed:    param("seed"),
    d1: param("d1"), d2: param("d2"), d3: param("d3"),
    t_elicit: param("t_elicit"),
    pos: param("pos"),
    pilot: param("pilot") === "1"
  };

  /* ---------------- seeded RNG ----------------
     Seeded, not Math.random, so the realised design is reconstructible from
     the seed alone. One seed per respondent across all blocks. */

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    if (!str) str = String(Date.now()) + ":" + Math.random();
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* The block id is folded in so two blocks with the same respondent seed do
     not draw the same critical position. */
  var seedUsed = P.seed || ("auto-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  var rng = mulberry32(hashSeed(seedUsed + "|" + PROBE_ID + "|" + P.crit.join(",")));

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------------- dom_room assembly ---------------- */

  var roomChained = 0;
  function buildRoomSet() {
    if (!P.d1 || !P.d2 || !P.d3) return null;
    if (!ROOM_LEVELS.d1[P.d1] || !ROOM_LEVELS.d2[P.d2] || !ROOM_LEVELS.d3[P.d3]) return null;
    roomChained = 1;
    var pref = [ROOM_LEVELS.d1[P.d1], ROOM_LEVELS.d2[P.d2], ROOM_LEVELS.d3[P.d3]];
    var other = [
      ROOM_LEVELS.d1[ROOM_OPPOSITE[P.d1]],
      ROOM_LEVELS.d2[ROOM_OPPOSITE[P.d2]],
      ROOM_LEVELS.d3[ROOM_OPPOSITE[P.d3]]
    ];
    return {
      kind: "critical", domain: "room", dominated: "b",
      lead: "A room in a shared flat, for the coming academic year.",
      labels: ["14 Bellmount Way", "3 Ryecroft Lane"],
      rows: [
        { label: "Monthly rent", dir: "low" },
        { label: "Housemates",   dir: "self", pref: pref[0] },
        { label: "Location",     dir: "self", pref: pref[1] },
        { label: "Furnishing",   dir: "self", pref: pref[2] }
      ],
      profiles: [
        { key: "a", vals: [ROOM_RENT.preferred, pref[0],  pref[1],  pref[2]  ] },
        { key: "b", vals: [ROOM_RENT.other,     other[0], other[1], other[2] ] }
      ]
    };
  }

  var roomSet = buildRoomSet();
  if (roomSet) SETS.dom_room = roomSet;

  /* Requested but unchainable: omit the set rather than serve default rooms.
     A self-anchored item scored against directions the respondent never gave
     is worse than a missing item, and unlike a missing item it is invisible
     in the output. */
  var critIds = P.crit.filter(function (id) { return !!SETS[id]; });
  var droppedCrit = P.crit.filter(function (id) { return !SETS[id]; });
  var fillerIds = P.fillers.filter(function (id) { return !!SETS[id]; });

  /* ---------------- POOL CHECK ----------------
     Re-derives every dominance relation from the values on every load, so an
     edit that accidentally creates a dominated option in a filler is caught
     here rather than silently becoming a fifth critical item nobody scores.
     Sets containing a "none" row are unscoreable and reported as skipped. */

  function numOf(v) {
    if (v === "Yes") return 1;
    if (v === "No") return 0;
    if (/unlimited/i.test(v)) return Infinity;
    var m = String(v).replace(/,/g, "").match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  /* Returns 1 if profile i is better than j on this row, -1 if worse, 0 tie. */
  function rowCmp(row, vi, vj) {
    if (row.dir === "self") {
      var bi = (vi === row.pref) ? 1 : 0, bj = (vj === row.pref) ? 1 : 0;
      return bi === bj ? 0 : (bi > bj ? 1 : -1);
    }
    var a = numOf(vi), b = numOf(vj);
    if (a === null || b === null) return 0;
    if (a === b) return 0;
    if (row.dir === "low") return a < b ? 1 : -1;
    return a > b ? 1 : -1;   /* "high" and "yes" both: larger is better */
  }
  /* "strict" | "near" | null, from i's point of view */
  function relation(set, i, j) {
    var better = 0, worse = 0, tie = 0;
    for (var r = 0; r < set.rows.length; r++) {
      var c = rowCmp(set.rows[r], set.profiles[i].vals[r], set.profiles[j].vals[r]);
      if (c > 0) better++; else if (c < 0) worse++; else tie++;
    }
    if (worse === 0 && tie === 0) return "strict";
    if (worse === 1 && tie === 0) return "near";
    return null;
  }
  function checkPool() {
    var notes = [], ok = true;
    Object.keys(SETS).forEach(function (id) {
      var s = SETS[id];
      var hasNone = s.rows.some(function (r) { return r.dir === "none"; });
      if (hasNone) { notes.push(id + ": skipped (person-varying attribute)"); return; }
      var strict = [], near = [];
      for (var i = 0; i < s.profiles.length; i++) {
        for (var j = 0; j < s.profiles.length; j++) {
          if (i === j) continue;
          var rel = relation(s, i, j);
          if (rel === "strict") strict.push(s.profiles[j].key);
          else if (rel === "near") near.push(s.profiles[j].key);
        }
      }
      if (s.kind === "filler") {
        if (strict.length) {
          ok = false;
          notes.push("FAIL " + id + ": filler contains a dominated option (" + strict.join(",") + ")");
        } else {
          notes.push(id + ": no dominance; near-dominated {" + (near.join(",") || "none") + "}" +
            (s.nearDominated ? ", declared " + s.nearDominated : ""));
          if (s.nearDominated && near.indexOf(s.nearDominated) === -1) {
            ok = false;
            notes.push("FAIL " + id + ": declared near-dominated '" + s.nearDominated + "' not found");
          }
        }
      } else {
        var uniq = strict.filter(function (v, k) { return strict.indexOf(v) === k; });
        if (uniq.length !== 1 || uniq[0] !== s.dominated) {
          ok = false;
          notes.push("FAIL " + id + ": expected exactly one dominated option '" +
            s.dominated + "', found {" + (uniq.join(",") || "none") + "}");
        } else {
          notes.push(id + ": strict dominance confirmed on '" + s.dominated + "'");
        }
      }
    });
    return { ok: ok, notes: notes };
  }
  var poolCheck = checkPool();
  if (!poolCheck.ok && window.console) {
    console.warn("[" + PROBE_ID + "] POOL CHECK FAILED\n" + poolCheck.notes.join("\n"));
  }

  /* ---------------- sequencing ----------------
     Critical sets: never first, never last, never adjacent to each other,
     always preceded by a filler of the same domain AND option count. */

  function isCrit(id) { return SETS[id].kind === "critical"; }

  function seqValid(seq) {
    if (isCrit(seq[0]) || isCrit(seq[seq.length - 1])) return false;
    var i, q;
    for (i = 1; i < seq.length; i++) {
      if (isCrit(seq[i]) && isCrit(seq[i - 1])) return false;
    }
    for (i = 0; i < seq.length; i++) {
      if (!isCrit(seq[i])) continue;
      var c = SETS[seq[i]], found = false;
      for (q = 0; q < i; q++) {
        var e = SETS[seq[q]];
        if (!isCrit(seq[q]) && e.domain === c.domain &&
            e.profiles.length === c.profiles.length) { found = true; break; }
      }
      if (!found) return false;
    }
    return true;
  }

  /* Rejection sampling over whole permutations, NOT greedy insertion of the
     critical sets into a shuffled filler list. The greedy version satisfies
     the same constraints but does not sample uniformly among the orderings
     that satisfy them: later-inserted sets can reach higher indices, which
     piled critical sets onto the last legal slot and starved the one before
     it. Position has to be orthogonal to item for the camouflage test in
     §7.4 to mean anything, so the sampler has to be uniform, not merely
     legal. */
  function buildSequence() {
    var all = fillerIds.concat(critIds);
    for (var attempt = 0; attempt < 2000; attempt++) {
      var s = shuffle(all.slice());
      if (seqValid(s)) return { seq: s, failed: 0 };
    }
    /* No valid ordering for this composition — usually a missing same-domain
       or same-option-count filler. Serve a best-effort block and flag it
       loudly rather than pretending the camouflage held. */
    return { seq: fillerIds.concat(critIds), failed: 1 };
  }

  var built = buildSequence();
  var sequence = built.seq;

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    seed: seedUsed,
    probe_position: P.pos,
    sequence: sequence.join(","),
    n_sets: sequence.length,
    n_critical: critIds.length,
    critical_requested: P.crit.join(","),
    critical_dropped: droppedCrit.join(","),
    block_constraint_failed: built.failed,
    pool_check_passed: poolCheck.ok ? 1 : 0,
    pool_check_notes: poolCheck.notes.join(" | "),
    dom_room_chained: roomChained,
    dom_room_gap_ms: null,
    n_violations_block: 0,
    n_near_dom_choices_block: 0,
    n_sets_completed: 0,
    block_complete: 0,
    t_block_ms: null,
    sets: []
  };

  if (roomChained && P.t_elicit && /^\d+$/.test(P.t_elicit)) {
    /* Recorded at load, not at the room screen: the gap of interest is
       elicitation to administration of the block, and it is fixed by the
       time anyone reaches the room set. */
    state.dom_room_gap_ms = Date.now() - parseInt(P.t_elicit, 10);
  }

  /* ---------------- per-set display randomisation ---------------- */

  var display = {};
  sequence.forEach(function (id) {
    var s = SETS[id];
    var order = shuffle(s.profiles.map(function (_, i) { return i; }));
    var labels = shuffle(s.labels.slice());
    var labelOf = {};
    s.profiles.forEach(function (p, i) { labelOf[p.key] = labels[i]; });
    display[id] = { order: order, labelOf: labelOf };
  });

  /* ---------------- rendering ---------------- */

  var screen = document.getElementById("screen");
  var idx = 0, selected = null, changes = 0, tSetStart = 0, tFirst = null;

  document.getElementById("blockinst").innerHTML =
    '<span class="counter" id="counter"></span>' + BLOCK_INSTRUCTIONS;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderSet() {
    var id = sequence[idx], s = SETS[id], d = display[id];
    selected = null; changes = 0; tFirst = null; tSetStart = Date.now();

    document.getElementById("counter").textContent = (idx + 1) + " of " + sequence.length;

    var h = '<p class="lead">' + esc(s.lead) + '</p><div class="tablewrap"><table class="cmp"><thead><tr><th class="attr"></th>';
    d.order.forEach(function (pi) {
      h += '<th data-col="' + pi + '">' + esc(d.labelOf[s.profiles[pi].key]) + '</th>';
    });
    h += '</tr></thead><tbody>';
    s.rows.forEach(function (row, ri) {
      h += '<tr><td class="attr">' + esc(row.label) + '</td>';
      d.order.forEach(function (pi) {
        h += '<td class="val" data-col="' + pi + '">' + esc(s.profiles[pi].vals[ri]) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';

    h += '<p class="qtext">Which would you choose?</p><div class="picks">';
    d.order.forEach(function (pi) {
      h += '<button type="button" class="pickbtn" data-pi="' + pi + '">' +
           esc(d.labelOf[s.profiles[pi].key]) + '</button>';
    });
    h += '</div>';
    h += '<div class="contwrap"><button type="button" class="contbtn" id="cont" disabled>Continue</button></div>';

    screen.innerHTML = h;

    Array.prototype.forEach.call(screen.querySelectorAll(".pickbtn"), function (btn) {
      btn.addEventListener("click", function () {
        var pi = parseInt(btn.getAttribute("data-pi"), 10);
        if (selected !== null && selected !== pi) changes++;
        if (tFirst === null) tFirst = Date.now() - tSetStart;
        selected = pi;
        Array.prototype.forEach.call(screen.querySelectorAll(".pickbtn"), function (b) {
          b.classList.toggle("chosen", parseInt(b.getAttribute("data-pi"), 10) === pi);
        });
        Array.prototype.forEach.call(screen.querySelectorAll("[data-col]"), function (c) {
          c.classList.toggle("sel", parseInt(c.getAttribute("data-col"), 10) === pi);
        });
        document.getElementById("cont").disabled = false;
        reportHeight();
      });
    });

    document.getElementById("cont").addEventListener("click", function () {
      if (selected === null) return;
      recordSet();
      idx++;
      if (idx < sequence.length) { renderSet(); } else { finish(); }
      window.scrollTo(0, 0);
      reportHeight();
    });

    reportHeight();
  }

  function recordSet() {
    var id = sequence[idx], s = SETS[id], d = display[id];
    var chosenKey = s.profiles[selected].key;
    var row = {
      id: id,
      kind: s.kind,
      domain: s.domain,
      n_opt: s.profiles.length,
      pos_block: idx + 1,
      choice_key: chosenKey,
      choice_label: d.labelOf[chosenKey],
      display_order: d.order.map(function (pi) { return s.profiles[pi].key; }).join(","),
      rt_first_ms: tFirst,
      rt_ms: Date.now() - tSetStart,
      changes: changes,
      violation: null,
      near_dom_choice: null,
      pos_dominated: null
    };

    if (s.kind === "critical") {
      row.violation = (chosenKey === s.dominated) ? 1 : 0;
      row.pos_dominated = d.order.indexOf(
        s.profiles.map(function (p) { return p.key; }).indexOf(s.dominated)
      ) + 1;
      state.n_violations_block += row.violation;

      state[id + "_choice"]        = chosenKey;
      state[id + "_violation"]     = row.violation;
      state[id + "_rt_ms"]         = row.rt_ms;
      state[id + "_rt_first_ms"]   = row.rt_first_ms;
      state[id + "_changes"]       = row.changes;
      state[id + "_pos_option"]    = row.pos_dominated;
      state[id + "_pos_block"]     = row.pos_block;
      state[id + "_label_chosen"]  = row.choice_label;
    } else {
      row.near_dom_choice = s.nearDominated ? (chosenKey === s.nearDominated ? 1 : 0) : null;
      if (row.near_dom_choice) state.n_near_dom_choices_block++;

      state["fill_" + id + "_choice"]    = chosenKey;
      state["fill_" + id + "_rt_ms"]     = row.rt_ms;
      state["fill_" + id + "_pos_block"] = row.pos_block;
      if (row.near_dom_choice !== null) {
        state["fill_" + id + "_near_dom_choice"] = row.near_dom_choice;
      }
    }

    state.sets.push(row);
    state.n_sets_completed = state.sets.length;
    report();
  }

  function finish() {
    state.block_complete = 1;
    state.t_block_ms = Date.now() - t0;
    document.getElementById("counter").textContent = "";
    screen.innerHTML = '<p class="done">Thank you — that\'s the end of this section.</p>';
    report();
    reportHeight();
  }

  /* ---------------- pilot panel ---------------- */

  if (P.pilot) {
    var order = sequence.map(function (id, i) {
      return (i + 1) + ". " + id + (isCrit(id) ? "  [CRITICAL]" : "");
    }).join("<br>");
    var bad = poolCheck.notes.filter(function (n) { return n.indexOf("FAIL") === 0; });
    document.getElementById("pilot").innerHTML =
      '<div class="pilot"><h4>PILOT PANEL — not shown to respondents (pilot=1)</h4>' +
      '<p><strong>Seed:</strong> <code>' + esc(seedUsed) + '</code>' +
      (built.failed ? ' &nbsp; <span class="bad">SEQUENCE CONSTRAINTS COULD NOT BE MET</span>' : '') +
      (droppedCrit.length ? ' &nbsp; <span class="bad">dropped: ' + esc(droppedCrit.join(",")) + '</span>' : '') +
      '</p><p><strong>Realised order:</strong><br>' + order + '</p>' +
      '<p><strong>Pool check:</strong> ' +
      (poolCheck.ok ? 'passed' : '<span class="bad">FAILED</span>') + '<br>' +
      esc(poolCheck.notes.join(" • ")) + '</p>' +
      (bad.length ? '<p class="bad">' + esc(bad.join(" • ")) + '</p>' : '') +
      '</div>';
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  renderSet();
  report();
})();
</script>
</body>
</html>
