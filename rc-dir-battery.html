<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housing Preferences</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .blockinst {
    font-size: 13.5px; color: #737b82; margin: 0 0 22px;
    padding-bottom: 12px; border-bottom: 1px solid #eef1f4;
  }
  .counter { float: right; font-size: 12.5px; color: #9aa1a8; }

  .stem { font-size: 15.5px; font-weight: 500; margin: 0 0 16px; }

  .picks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pickbtn {
    font-family: inherit; font-size: 14.5px; line-height: 1.45;
    padding: 16px 16px; border-radius: 6px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left; min-height: 74px;
  }
  .pickbtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }

  .done { font-size: 15px; color: #737b82; padding: 22px 0; }

  .pilot {
    margin-top: 26px; padding: 12px 14px; border: 1px solid #e0c58a;
    background: #fdf7e8; border-radius: 6px; font-size: 12.5px; color: #6a5320;
  }
  .pilot h4 { margin: 0 0 7px; font-size: 12.5px; }
  .pilot code { font-size: 11.5px; word-break: break-all; }
  .pilot .bad { color: #9c2c2c; font-weight: 600; }

  @media (max-width: 560px) { .picks { grid-template-columns: 1fr; } .pickbtn { min-height: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="blockinst" id="blockinst"></div>
  <div id="screen"></div>
  <div id="pilot"></div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     DIRECTION BATTERY — Part 1 of the self-anchored dominance item

     Item D removes the assumption the other three dominance items rely on:
     that the researcher knows which direction each attribute runs. Here the
     RESPONDENT supplies the directions, and choice-block.html builds the
     Part 2 room pair from their answers — Room 1 carrying all three of the
     levels this person chose plus the lower rent, Room 2 carrying all three
     unchosen levels plus the higher rent. Choosing Room 2 then contradicts
     their own stated preference on every dimension, with no preference
     structure the researcher has to guess at.

     Three critical direction items sit inside six fillers, same stem and same
     format throughout. Two rules this file enforces:

       1. Critical items are never first, never last, never adjacent — the
          same constraints the choice blocks apply, for the same reason.
       2. NO FILLER MAY USE AN ATTRIBUTE THAT APPEARS IN PART 2. A filler
          attribute turning up in the rooms would give the respondent
          something to trade the critical three against, which is the one
          defence this item is built to leave no room for. Each item declares
          an `attr` tag and the check below refuses to run if a filler
          declares one of Part 2's. (Filler 5 is housemate COMPOSITION, which
          is a different attribute from the housemate COUNT in Part 2 — that
          near-miss is deliberate camouflage, and it is exactly the kind of
          thing the tag check exists to keep honest.)

     Filler 4 has a near-universal direction and is there on purpose: a
     battery in which every item is a genuine toss-up is itself a recognisable
     pattern.

     SINGLE-CLICK ADVANCE, no select-then-confirm. These are simple binary
     preferences and the burden of 18 clicks is not worth it, so unlike the
     choice blocks there is no `changes` measure here. Per-item latency is
     recorded instead, and it is the field that matters: a Part 1 answered at
     speed makes a Part 2 violation ambiguous about which half was noise.

     The three answers are emitted as d1/d2/d3, plus `chain_qs` — a ready-made
     query string to append to the downstream choice-block.html URL — and
     `t_elicit`, which that block turns into dom_room_gap_ms.

     URL PARAMETERS
       seed   per-RESPONDENT seed, shared with the other blocks
       pos    assigned position label, carried through as probe_position
       pilot  1 to render the realised order and the chain string
     ------------------------------------------------------------------ */

  var PROBE_ID = "DOM_DIRECTIONS";

  var BLOCK_INSTRUCTIONS =
    "Thinking about somewhere to live for the coming academic year. " +
    "For each pair, pick the one you would prefer, all else equal.";

  var STEM = "All else equal, would you rather…";

  /* Attributes used by dom_room Part 2. No filler may declare one of these. */
  var PART2_ATTRS = ["housemate_count", "location", "furnishing"];

  var ITEMS = {
    /* ---- critical: these three build Part 2 ---- */
    c1: { kind: "critical", slot: "d1", attr: "housemate_count",
          opts: [ { key: "two",  text: "share with two other people" },
                  { key: "five", text: "share with five other people" } ] },
    c2: { kind: "critical", slot: "d2", attr: "location",
          opts: [ { key: "close", text: "be a 10-minute walk from campus, in a busy area" },
                  { key: "quiet", text: "be a 25-minute walk from campus, on a quiet residential street" } ] },
    c3: { kind: "critical", slot: "d3", attr: "furnishing",
          opts: [ { key: "furnished",   text: "have the room come furnished" },
                  { key: "unfurnished", text: "have the room come unfurnished" } ] },

    /* ---- fillers ---- */
    f1: { kind: "filler", attr: "floor",
          opts: [ { key: "ground", text: "have a ground-floor room" },
                  { key: "top",    text: "have a top-floor room" } ] },
    f2: { kind: "filler", attr: "lease_length",
          opts: [ { key: "six",    text: "sign a six-month lease" },
                  { key: "twelve", text: "sign a twelve-month lease" } ] },
    f3: { kind: "filler", attr: "window",
          opts: [ { key: "street",    text: "have a large window onto the street" },
                  { key: "courtyard", text: "have a smaller window onto a courtyard" } ] },
    f4: { kind: "filler", attr: "laundry",
          opts: [ { key: "in_building", text: "have laundry in the building" },
                  { key: "laundromat",  text: "use a laundromat two blocks away" } ] },
    f5: { kind: "filler", attr: "housemate_composition",
          opts: [ { key: "students",     text: "live with housemates who are students" },
                  { key: "professionals", text: "live with housemates who work full time" } ] },
    f6: { kind: "filler", attr: "kitchen",
          opts: [ { key: "building", text: "share a kitchen with the whole building" },
                  { key: "flat",     text: "share a smaller kitchen only with your flat" } ] }
  };

  var CRITICAL = ["c1", "c2", "c3"];
  var FILLERS  = ["f1", "f2", "f3", "f4", "f5", "f6"];

  /* ---- attribute-collision check (rule 2 above) ---- */
  var attrClash = FILLERS.filter(function (id) {
    return PART2_ATTRS.indexOf(ITEMS[id].attr) !== -1;
  });
  if (attrClash.length && window.console) {
    console.warn("[" + PROBE_ID + "] filler(s) declare a Part 2 attribute: " + attrClash.join(","));
  }

  /* ---------------- URL ---------------- */

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  var P = { seed: param("seed"), pos: param("pos"), pilot: param("pilot") === "1" };

  /* ---------------- seeded RNG ---------------- */

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    if (!str) str = String(Date.now()) + ":" + Math.random();
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seedUsed = P.seed || ("auto-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  var rng = mulberry32(hashSeed(seedUsed + "|" + PROBE_ID));

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------------- sequencing ---------------- */

  function isCrit(id) { return ITEMS[id].kind === "critical"; }

  function seqValid(seq) {
    if (isCrit(seq[0]) || isCrit(seq[seq.length - 1])) return false;
    for (var i = 1; i < seq.length; i++) {
      if (isCrit(seq[i]) && isCrit(seq[i - 1])) return false;
    }
    return true;
  }

  /* Rejection sampling over whole permutations rather than greedy insertion —
     see the note in choice-block.html. Greedy insertion meets the same
     constraints without sampling uniformly among the orderings that meet
     them, which biases where the critical items land. */
  function buildSequence() {
    var all = FILLERS.concat(CRITICAL);
    for (var attempt = 0; attempt < 2000; attempt++) {
      var s = shuffle(all.slice());
      if (seqValid(s)) return { seq: s, failed: 0 };
    }
    return { seq: FILLERS.concat(CRITICAL), failed: 1 };
  }

  var built = buildSequence();
  var sequence = built.seq;

  /* Per-item left/right randomisation. */
  var display = {};
  sequence.forEach(function (id) {
    display[id] = shuffle([0, 1]);
  });

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    seed: seedUsed,
    probe_position: P.pos,
    sequence: sequence.join(","),
    n_items: sequence.length,
    battery_constraint_failed: built.failed,
    filler_attr_clash: attrClash.join(","),
    d1: null, d2: null, d3: null,
    d1_rt_ms: null, d2_rt_ms: null, d3_rt_ms: null,
    d1_pos: null, d2_pos: null, d3_pos: null,
    t_elicit: null,
    chain_qs: null,
    n_items_completed: 0,
    battery_complete: 0,
    t_battery_ms: null,
    items: []
  };

  /* ---------------- rendering ---------------- */

  var screen = document.getElementById("screen");
  var idx = 0, tItemStart = 0;

  document.getElementById("blockinst").innerHTML =
    '<span class="counter" id="counter"></span>' + BLOCK_INSTRUCTIONS;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderItem() {
    var id = sequence[idx], it = ITEMS[id], ord = display[id];
    tItemStart = Date.now();

    document.getElementById("counter").textContent = (idx + 1) + " of " + sequence.length;

    var h = '<p class="stem">' + esc(STEM) + '</p><div class="picks">';
    ord.forEach(function (oi) {
      h += '<button type="button" class="pickbtn" data-oi="' + oi + '">' +
           esc(it.opts[oi].text) + '</button>';
    });
    h += '</div>';
    screen.innerHTML = h;

    Array.prototype.forEach.call(screen.querySelectorAll(".pickbtn"), function (btn) {
      btn.addEventListener("click", function () {
        record(parseInt(btn.getAttribute("data-oi"), 10));
        idx++;
        if (idx < sequence.length) { renderItem(); } else { finish(); }
        window.scrollTo(0, 0);
        reportHeight();
      });
    });

    reportHeight();
  }

  function record(oi) {
    var id = sequence[idx], it = ITEMS[id], ord = display[id];
    var rt = Date.now() - tItemStart;
    var row = {
      id: id,
      kind: it.kind,
      attr: it.attr,
      pos_battery: idx + 1,
      choice_key: it.opts[oi].key,
      choice_side: ord.indexOf(oi) + 1,
      display_order: ord.map(function (k) { return it.opts[k].key; }).join(","),
      rt_ms: rt
    };
    state.items.push(row);
    state.n_items_completed = state.items.length;

    if (it.kind === "critical") {
      state[it.slot] = row.choice_key;
      state[it.slot + "_rt_ms"] = rt;
      state[it.slot + "_pos"] = row.pos_battery;
    } else {
      state["dir_" + id + "_choice"] = row.choice_key;
      state["dir_" + id + "_rt_ms"] = rt;
    }
    report();
  }

  function finish() {
    state.battery_complete = 1;
    state.t_battery_ms = Date.now() - t0;
    state.t_elicit = Date.now();
    /* Ready to append to the downstream choice-block.html URL. Absent these,
       that block OMITS the room set rather than serving a default pair. */
    state.chain_qs = "d1=" + state.d1 + "&d2=" + state.d2 + "&d3=" + state.d3 +
                     "&t_elicit=" + state.t_elicit;
    document.getElementById("counter").textContent = "";
    screen.innerHTML = '<p class="done">Thank you — that\'s the end of this section.</p>';
    report();
    reportHeight();
  }

  /* ---------------- pilot panel ---------------- */

  if (P.pilot) {
    var order = sequence.map(function (id, i) {
      return (i + 1) + ". " + id + " (" + ITEMS[id].attr + ")" +
             (isCrit(id) ? "  [CRITICAL → " + ITEMS[id].slot + "]" : "");
    }).join("<br>");
    document.getElementById("pilot").innerHTML =
      '<div class="pilot"><h4>PILOT PANEL — not shown to respondents (pilot=1)</h4>' +
      '<p><strong>Seed:</strong> <code>' + esc(seedUsed) + '</code>' +
      (built.failed ? ' &nbsp; <span class="bad">SEQUENCE CONSTRAINTS COULD NOT BE MET</span>' : '') +
      (attrClash.length ? ' &nbsp; <span class="bad">filler attr clash: ' + esc(attrClash.join(",")) + '</span>' : '') +
      '</p><p><strong>Realised order:</strong><br>' + order + '</p>' +
      '<p><strong>chain_qs</strong> is emitted on completion — append it to the ' +
      'downstream <code>choice-block.html</code> URL. Check <code>dom_room_chained</code> ' +
      'in your own test response before launch.</p></div>';
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  renderItem();
  report();
})();
</script>
</body>
</html>
