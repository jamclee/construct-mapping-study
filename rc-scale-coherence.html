<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Habits</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  .blockinst {
    font-size: 13.5px; color: #737b82; margin: 0 0 16px;
    padding-bottom: 12px; border-bottom: 1px solid #eef1f4;
  }
  .counter { float: right; font-size: 12.5px; color: #9aa1a8; }

  table.grid { border-collapse: collapse; width: 100%; }
  table.grid th { font-size: 11.5px; font-weight: 500; color: #737b82;
                  padding: 0 2px 8px; text-align: center; vertical-align: bottom; line-height: 1.25; }
  table.grid th.stem { width: 42%; }
  table.grid td { border-top: 1px solid #eef1f4; padding: 11px 2px; text-align: center; }
  table.grid td.stem { text-align: left; font-size: 14.5px; padding-right: 12px; }
  table.grid tr.answered td.stem { color: #4a5158; }

  .dot {
    appearance: none; -webkit-appearance: none;
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid #c8ced4; background: #fff; cursor: pointer; margin: 0; vertical-align: middle;
  }
  .dot:hover { border-color: #2f6fb0; }
  .dot:checked { border-color: #2f6fb0; border-width: 6px; }

  .contwrap { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e6e8eb; }
  .contbtn {
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    padding: 10px 26px; border-radius: 5px;
    border: 1px solid #2f6fb0; background: #2f6fb0; color: #fff; cursor: pointer;
  }
  .contbtn[disabled] { border-color: #dfe3e7; background: #f4f6f8; color: #a8afb6; cursor: default; }
  .remain { margin-left: 12px; font-size: 13px; color: #9aa1a8; }

  .done { font-size: 15px; color: #737b82; padding: 22px 0; }

  .pilot {
    margin-top: 26px; padding: 12px 14px; border: 1px solid #e0c58a;
    background: #fdf7e8; border-radius: 6px; font-size: 12.5px; color: #6a5320;
  }
  .pilot h4 { margin: 0 0 7px; font-size: 12.5px; }
  .pilot code { font-size: 11.5px; }
  .pilot .bad { color: #9c2c2c; font-weight: 600; }

  @media (max-width: 620px) {
    table.grid th.stem { width: 34%; }
    table.grid td.stem { font-size: 13.5px; padding-right: 6px; }
    table.grid th { font-size: 10px; }
    .dot { width: 17px; height: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blockinst" id="blockinst"></div>
  <div id="screen"></div>
  <div id="pilot"></div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     RESPONSE SCALE COHERENCE — near-synonym pairs in a rating battery

     The coherence requirement: if the inference reads a rating as a position
     on a latent continuum, then two items with the same content must land in
     the same place. A respondent who agrees strongly with "I usually compare
     several options before buying" and disagrees strongly with "Before making
     a purchase, I tend to look at a number of alternatives" has not produced
     two positions on one continuum.

     This is the only coherence probe in the folder that reaches RATING
     SCALES. The dominance, valuation and allocation probes all require a
     choice or a number, so a study whose DV is a Likert battery has no
     coherence evidence available from them.

     SYNONYMS, NOT REVERSE-WORDED PAIRS. The traditional version pairs an item
     with its negation. It carries a well-documented confound: a substantial
     minority of respondents mis-process negation, and they are
     disproportionately lower-literacy and lower-education. Gating on
     reversals selects the sample on those traits, which is a worse problem
     than the one it solves. Every pair here is a near-synonym with different
     surface wording.

     WHAT MAKES IT WORK, AND THE TENSION BETWEEN THE TWO REQUIREMENTS

       - Pair members must be far apart, or the second is answered by
         recalling the first and consistency is manufactured. Here the battery
         runs in two blocks and NO PAIR IS EVER WITHIN A BLOCK.
       - Pair members must be near-identical in meaning, or a discrepancy is
         substantive rather than incoherent.

     Those pull against each other: the closer the wording, the more likely
     recognition; the more varied the wording, the more a real difference in
     meaning can creep in. Two blocks with pairs split across them is the
     compromise, and the residual risk runs towards FALSE PASSES (recognition
     inflating agreement), which is the safer direction for an exclusion rule.

     SCORING IS CONTINUOUS AND NOT GATED HERE. With three pairs the natural
     statistic is mean absolute discrepancy, not a within-person correlation —
     a correlation over three points is unstable. The file emits the
     per-pair discrepancies and leaves the threshold to the analyst. If your
     own battery is long (roughly 30+ items), consider the post-hoc route
     instead: compute the item correlation matrix in your data, take the most
     correlated pairs, and score within-person agreement on those. That costs
     no extra items at all, but it is sample-dependent and cannot be
     preregistered as a fixed rule.

     LONG-STRING IS EMITTED TOO, unscored. It is a different construct — a
     response-style diagnostic, not a coherence violation, since someone who
     agrees with everything may be perfectly consistent. It is free to compute
     here and having both in one battery lets the two be compared directly on
     the same items.

     URL PARAMETERS
       seed   per-respondent seed; drives item order and block assignment
       pos    assigned position label, carried through as probe_position
       pilot  1 to show the realised order and the pair discrepancies
     ------------------------------------------------------------------ */

  var PROBE_ID = "SCALE_COHERENCE";

  var BLOCK_INSTRUCTIONS =
    "Below are statements about how people shop. For each one, indicate how " +
    "much you agree or disagree. There are no right or wrong answers.";

  var ANCHORS = [
    "Strongly disagree", "Disagree", "Slightly disagree", "Neither",
    "Slightly agree", "Agree", "Strongly agree"
  ];

  /* Three near-synonym pairs. Members of a pair never share a block. */
  var PAIRS = [
    { id: "p1",
      a: "I usually compare several options before buying something.",
      b: "Before making a purchase, I tend to look at a number of alternatives." },
    { id: "p2",
      a: "I often buy things on impulse.",
      b: "I frequently make purchases without planning them in advance." },
    { id: "p3",
      a: "Price is the main thing I consider when shopping.",
      b: "When I shop, cost is my primary concern." }
  ];

  /* Ten fillers. Checked so that no filler is a near-synonym OR a near-antonym
     of another filler or of a pair item — an uncontrolled pair would be a
     fourth scored pair nobody is scoring, and an antonym pair would reintroduce
     the negation confound the design avoids. */
  var FILLERS = [
    "I enjoy browsing stores even when I don't need anything.",
    "I usually shop at whatever store is most convenient.",
    "Reading reviews is an important part of how I decide.",
    "I tend to stick with brands I know.",
    "I find shopping stressful.",
    "I find it hard to decide when there are many options.",
    "Shopping online is easier for me than shopping in person.",
    "I often ask friends or family for recommendations.",
    "I keep track of what I spend each month.",
    "I like trying products I haven't used before."
  ];

  /* ---------------- URL + RNG ---------------- */

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  var P = { seed: param("seed"), pos: param("pos"), pilot: param("pilot") === "1" };

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    if (!str) str = String(Date.now()) + ":" + Math.random();
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seedUsed = P.seed || ("auto-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  var rng = mulberry32(hashSeed(seedUsed + "|" + PROBE_ID));
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------------- build the two blocks ----------------
     One member of each pair per block, side assigned at random so that which
     wording comes first is not confounded with block. Fillers split evenly. */

  var blockA = [], blockB = [];
  PAIRS.forEach(function (pr) {
    var firstIsA = rng() < 0.5;
    blockA.push({ key: pr.id + (firstIsA ? "a" : "b"), pair: pr.id,
                  side: firstIsA ? "a" : "b", text: firstIsA ? pr.a : pr.b, kind: "pair" });
    blockB.push({ key: pr.id + (firstIsA ? "b" : "a"), pair: pr.id,
                  side: firstIsA ? "b" : "a", text: firstIsA ? pr.b : pr.a, kind: "pair" });
  });
  var fillShuffled = shuffle(FILLERS.slice());
  fillShuffled.forEach(function (txt, i) {
    var item = { key: "f" + (i + 1), pair: null, side: null, text: txt, kind: "filler" };
    (i % 2 === 0 ? blockA : blockB).push(item);
  });
  shuffle(blockA); shuffle(blockB);
  var BLOCKS = [blockA, blockB];

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    seed: seedUsed,
    probe_position: P.pos,
    n_items: blockA.length + blockB.length,
    n_pairs: PAIRS.length,
    scale_points: ANCHORS.length,
    block_order: null,
    n_answered: 0,
    battery_complete: 0,
    t_battery_ms: null,
    mean_discrepancy: null,
    max_discrepancy: null,
    n_pairs_ge3: null,
    long_string: null,
    n_distinct_used: null,
    items: []
  };

  /* ---------------- render ---------------- */

  var screen = document.getElementById("screen");
  var inst = document.getElementById("blockinst");
  inst.innerHTML = '<span class="counter" id="counter"></span>' + BLOCK_INSTRUCTIONS;

  var bIdx = 0;
  var answers = {};            /* key -> {value, t_ms, changes, order} */
  var orderCounter = 0;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderBlock() {
    var items = BLOCKS[bIdx];
    document.getElementById("counter").textContent = "Page " + (bIdx + 1) + " of " + BLOCKS.length;

    var h = '<table class="grid"><thead><tr><th class="stem"></th>';
    ANCHORS.forEach(function (a) { h += '<th>' + esc(a) + '</th>'; });
    h += '</tr></thead><tbody>';
    items.forEach(function (it) {
      h += '<tr id="row_' + it.key + '"><td class="stem">' + esc(it.text) + '</td>';
      for (var v = 1; v <= ANCHORS.length; v++) {
        h += '<td><input type="radio" class="dot" name="' + it.key + '" value="' + v + '"></td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table>';
    h += '<div class="contwrap"><button type="button" class="contbtn" id="cont" disabled>Continue</button>' +
         '<span class="remain" id="remain"></span></div>';
    screen.innerHTML = h;

    var tBlock = Date.now();
    Array.prototype.forEach.call(screen.querySelectorAll(".dot"), function (el) {
      el.addEventListener("change", function () {
        var key = el.getAttribute("name");
        if (answers[key]) { answers[key].changes++; }
        else { answers[key] = { changes: 0, order: ++orderCounter }; }
        answers[key].value = parseInt(el.value, 10);
        answers[key].t_ms = Date.now() - tBlock;
        var row = document.getElementById("row_" + key);
        if (row) row.classList.add("answered");
        updateGate(items);
      });
    });
    updateGate(items);
    reportHeight();
  }

  function updateGate(items) {
    var missing = items.filter(function (it) { return !answers[it.key]; }).length;
    var btn = document.getElementById("cont");
    document.getElementById("remain").textContent =
      missing ? (missing + (missing === 1 ? " item left" : " items left")) : "";
    btn.disabled = missing > 0;
    btn.onclick = function () {
      if (missing > 0) return;
      bIdx++;
      if (bIdx < BLOCKS.length) { renderBlock(); } else { finish(); }
      window.scrollTo(0, 0);
      reportHeight();
    };
  }

  /* ---------------- scoring ---------------- */

  function score() {
    var rows = [], byOrder = [];
    BLOCKS.forEach(function (items, bi) {
      items.forEach(function (it, pos) {
        var a = answers[it.key] || {};
        rows.push({
          key: it.key, kind: it.kind, pair: it.pair, side: it.side,
          block: bi + 1, pos_in_block: pos + 1,
          value: a.value == null ? null : a.value,
          t_ms: a.t_ms == null ? null : a.t_ms,
          changes: a.changes == null ? null : a.changes,
          answer_order: a.order == null ? null : a.order,
          text: it.text
        });
        if (a.order != null) byOrder.push({ order: a.order, value: a.value });
      });
    });
    state.items = rows;
    state.n_answered = rows.filter(function (r) { return r.value != null; }).length;

    /* pair discrepancies */
    var ds = [];
    PAIRS.forEach(function (pr) {
      var va = null, vb = null, ba = null, bb = null;
      rows.forEach(function (r) {
        if (r.pair !== pr.id) return;
        if (r.side === "a") { va = r.value; ba = r.block; } else { vb = r.value; bb = r.block; }
      });
      var d = (va == null || vb == null) ? null : Math.abs(va - vb);
      ds.push(d);
      state[pr.id + "_a"] = va;
      state[pr.id + "_b"] = vb;
      state[pr.id + "_discrepancy"] = d;
      state[pr.id + "_first_block"] = (ba != null && bb != null) ? Math.min(ba, bb) : null;
    });
    var valid = ds.filter(function (d) { return d != null; });
    if (valid.length) {
      state.mean_discrepancy = +(valid.reduce(function (s, d) { return s + d; }, 0) / valid.length).toFixed(3);
      state.max_discrepancy = Math.max.apply(null, valid);
      state.n_pairs_ge3 = valid.filter(function (d) { return d >= 3; }).length;
    }

    /* long-string in ADMINISTRATION order, and distinct scale points used.
       Emitted unscored: a response-style diagnostic, not a coherence
       violation. Someone who agrees with everything may be perfectly
       consistent; someone alternating at random produces no long strings. */
    byOrder.sort(function (x, y) { return x.order - y.order; });
    var best = 0, run = 0, prev = null, used = {};
    byOrder.forEach(function (r) {
      used[r.value] = 1;
      run = (r.value === prev) ? run + 1 : 1;
      if (run > best) best = run;
      prev = r.value;
    });
    state.long_string = best;
    state.n_distinct_used = Object.keys(used).length;
  }

  function finish() {
    score();
    state.battery_complete = 1;
    state.t_battery_ms = Date.now() - t0;
    state.block_order = BLOCKS.map(function (items) {
      return items.map(function (it) { return it.key; }).join("+");
    }).join(" || ");
    document.getElementById("counter").textContent = "";
    screen.innerHTML = '<p class="done">Thank you — that\'s the end of this section.</p>';
    report();
    if (P.pilot) renderPilot();
    reportHeight();
  }

  function renderPilot() {
    var h = '<div class="pilot"><h4>PILOT PANEL — not shown to respondents (pilot=1)</h4>' +
            '<p><strong>Seed:</strong> <code>' + esc(seedUsed) + '</code></p><p><strong>Pairs:</strong><br>';
    PAIRS.forEach(function (pr) {
      var d = state[pr.id + "_discrepancy"];
      h += pr.id + ": a=" + state[pr.id + "_a"] + " b=" + state[pr.id + "_b"] +
           " |d|=" + d + (d >= 3 ? ' <span class="bad">(&ge;3)</span>' : '') + '<br>';
    });
    h += '</p><p>mean |d| = ' + state.mean_discrepancy +
         ' &nbsp; max = ' + state.max_discrepancy +
         ' &nbsp; long-string = ' + state.long_string +
         ' &nbsp; distinct points used = ' + state.n_distinct_used + '</p>' +
         '<p>Check before launch: no pair shares a block, and no filler is a near-synonym ' +
         'or near-antonym of another item.</p></div>';
    document.getElementById("pilot").innerHTML = h;
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }
  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  renderBlock();
  report();
})();
</script>
</body>
</html>
