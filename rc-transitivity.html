<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpack Choices</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .blockinst {
    font-size: 13.5px; color: #737b82; margin: 0 0 18px;
    padding-bottom: 12px; border-bottom: 1px solid #eef1f4;
  }
  .counter { float: right; font-size: 12.5px; color: #9aa1a8; }

  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.cmp { border-collapse: collapse; width: 100%; min-width: 300px; }
  table.cmp th, table.cmp td {
    border-bottom: 1px solid #eef1f4; padding: 10px; text-align: left;
    font-size: 14px; vertical-align: top;
  }
  table.cmp th.attr, table.cmp td.attr {
    color: #737b82; font-weight: 400; white-space: nowrap; border-right: 1px solid #eef1f4;
  }
  table.cmp thead th { font-size: 14.5px; font-weight: 600; color: #1f2328; border-bottom: 1px solid #dfe3e7; }
  table.cmp td.val { font-variant-numeric: tabular-nums; }
  table.cmp .sel { background: #f2f7fc; }

  .qtext { font-size: 15px; font-weight: 500; margin: 20px 0 0; }
  .picks { display: flex; gap: 10px; margin: 12px 0 0; flex-wrap: wrap; }
  .pickbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 16px; border-radius: 5px; flex: 1 1 0; min-width: 120px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer; text-align: center;
  }
  .pickbtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .pickbtn.chosen { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }

  .contwrap { margin-top: 22px; padding-top: 16px; border-top: 1px solid #e6e8eb; }
  .contbtn {
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    padding: 10px 26px; border-radius: 5px;
    border: 1px solid #2f6fb0; background: #2f6fb0; color: #fff; cursor: pointer;
  }
  .contbtn[disabled] { border-color: #dfe3e7; background: #f4f6f8; color: #a8afb6; cursor: default; }

  .done { font-size: 15px; color: #737b82; padding: 22px 0; }

  .pilot {
    margin-top: 26px; padding: 12px 14px; border: 1px solid #e0c58a;
    background: #fdf7e8; border-radius: 6px; font-size: 12.5px; color: #6a5320;
  }
  .pilot h4 { margin: 0 0 7px; font-size: 12.5px; }
  .pilot code { font-size: 11.5px; }
  .pilot .bad { color: #9c2c2c; font-weight: 600; }

  @media (max-width: 560px) {
    table.cmp th, table.cmp td { padding: 8px 7px; font-size: 13px; }
    .pickbtn { font-size: 13.5px; padding: 9px 10px; min-width: 96px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blockinst" id="blockinst"></div>
  <div id="screen"></div>
  <div id="pilot"></div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     TRANSITIVITY — a cycle detector with one leg pinned by dominance

     The coherence requirement: if the inference reads repeated choices as
     revealing ONE preference ordering, that ordering must be transitive. This
     is the axiom the rest of the folder does not test — the dominance probes
     all test monotonicity instead.

     THE STRUCTURE. Three options, three pairwise comparisons, one of which is
     settled by dominance so that the remaining prediction is forced by
     transitivity alone.

       Screen 1   A vs B          a genuine trade-off; their choice is the
                                  revealed relation and it sets the branch
       Dom leg    rejected vs D   D is strictly dominated by the option they
                                  REJECTED, so this leg should be settled by
                                  monotonicity
       Trans leg  chosen vs D     a genuine trade-off. Nothing about the
                                  attributes settles it. The only thing that
                                  does is the chain: chosen > rejected
                                  (revealed) and rejected > D (dominance),
                                  therefore chosen > D.

     Picking D on the transitivity leg completes the cycle
     chosen > rejected > D > chosen.

     WHY D IS BUILT FROM THE REJECTED OPTION. This is the whole design. If D
     were dominated by the option they CHOSE, then picking D would violate
     monotonicity and you could not tell whether transitivity was involved at
     all. Building D off the rejected option leaves the chosen-vs-D comparison
     a real trade-off, so a violation there is transitivity and nothing else.

     WHY THE DOMINANCE LEG IS ASKED RATHER THAN ASSUMED. If you assume
     monotonicity instead of observing it, a respondent who violates it breaks
     the chain and their transitivity "violation" is uninterpretable. Asking it
     separates `dom_violation` from `trans_violation`, and `cycle` is flagged
     only when the dominance leg was answered correctly and the transitivity
     leg was not. It also yields a dominance item for free.

     ROBUSTNESS. Triads can flag respondents using a real strategy — a triad
     in which majority-of-attributes tallying produces a Condorcet cycle would
     do exactly that. Two features protect this one. With only two attributes,
     tallying ties on every trade-off pair, so it is not a competing rule.
     And these particular values were checked against price-lexicographic,
     rating-lexicographic, price and rating thresholds, and lexicographic
     semiorders on either attribute: every one is acyclic in BOTH branches.
     That is a property of the spacing, not of the design — re-check it by
     hand if you change any number.

     WHAT IT IS AND IS NOT. It adds a different axiom, which is the gap it
     fills. It does not add a different decision-use cell: it is a binary, so
     a random responder passes the transitivity leg half the time. It is also
     structurally easy, and that cannot be fixed — requiring the rejected
     option to dominate D forces D well below the chosen option on whichever
     attribute drove the original choice, so the transitive answer is also the
     one their revealed preference favours. Low sensitivity, high specificity.

     BRANCHING HAS TWO CONSEQUENCES. The branches use different third options,
     so report violation rates by branch rather than pooled. And a violation is
     ambiguous about which response was noise — screen 1 or the transitivity
     leg — exactly as with the self-anchored room item.

     Product labels are model codes assigned at random per screen, so nothing
     downstream may key on them and no unlisted brand attribute can enter.
     Option values recur across screens by necessity; the codes do not.

     URL PARAMETERS
       seed   per-respondent seed; drives order, sides and codes
       pos    assigned position label, carried through as probe_position
       pilot  1 to show the realised order and the structural check
     ------------------------------------------------------------------ */

  var PROBE_ID = "TRANSITIVITY";

  var BLOCK_INSTRUCTIONS =
    "You are shopping for a backpack. On the next few screens you'll see pairs " +
    "of backpacks. Assume they are identical in every respect apart from what " +
    "is listed, and pick the one you would actually buy.";

  var ROWS = [
    { label: "Price",          dir: "low"  },
    { label: "Average rating", dir: "high" }
  ];

  /* The triad. A and B are the opening trade-off; D and DP are the third
     option in each branch, each built off the option that was REJECTED. */
  var OPT = {
    A:  ["$85", "4.8 stars"],
    B:  ["$72", "4.1 stars"],
    D:  ["$78", "3.9 stars"],   /* chose A -> B dominates D, A vs D is a trade-off */
    DP: ["$92", "4.4 stars"]    /* chose B -> A dominates DP, B vs DP is a trade-off */
  };

  /* Fillers: genuine trade-offs, values spanning the same ranges as the triad
     so no test screen is numerically distinctive. */
  var FILLERS = [
    { l: ["$68", "4.0 stars"], r: ["$88", "4.6 stars"] },
    { l: ["$95", "4.3 stars"], r: ["$76", "3.8 stars"] },
    { l: ["$81", "4.7 stars"], r: ["$70", "4.2 stars"] },
    { l: ["$99", "4.5 stars"], r: ["$74", "3.7 stars"] }
  ];

  var CODES = ["Model K-7", "Model R-2", "Model T-9", "Model B-4", "Model M-5",
               "Model W-1", "Model L-8", "Model C-3", "Model P-6", "Model H-2",
               "Model S-4", "Model N-7", "Model V-3", "Model G-9"];

  /* ---------------- URL + RNG ---------------- */

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  var P = { seed: param("seed"), pos: param("pos"), pilot: param("pilot") === "1" };

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    if (!str) str = String(Date.now()) + ":" + Math.random();
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seedUsed = P.seed || ("auto-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  var rng = mulberry32(hashSeed(seedUsed + "|" + PROBE_ID));
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------------- structural check ----------------
     Re-derives every relation the design depends on, on every load. The whole
     probe rests on exactly which pairs are dominance pairs and which are
     trade-offs, and a single edited digit can silently invert that. */

  function numOf(v) {
    var m = String(v).replace(/,/g, "").match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  /* "dominates" | "dominated" | "tradeoff" | "tie", from left's point of view */
  function rel(l, r) {
    var better = 0, worse = 0, tie = 0;
    for (var i = 0; i < ROWS.length; i++) {
      var a = numOf(l[i]), b = numOf(r[i]);
      if (a === null || b === null || a === b) { tie++; continue; }
      var lBetter = ROWS[i].dir === "low" ? a < b : a > b;
      if (lBetter) better++; else worse++;
    }
    if (better === 0 && worse === 0) return "tie";
    if (worse === 0) return "dominates";
    if (better === 0) return "dominated";
    return "tradeoff";
  }
  var checkPassed = 1, checkNotes = [];
  function expect(label, got, want) {
    if (got !== want) { checkPassed = 0; checkNotes.push("FAIL " + label + ": " + got + " (expected " + want + ")"); }
    else { checkNotes.push(label + ": " + got); }
  }
  expect("A vs B", rel(OPT.A, OPT.B), "tradeoff");
  expect("B dominates D", rel(OPT.B, OPT.D), "dominates");
  expect("A vs D", rel(OPT.A, OPT.D), "tradeoff");
  expect("A dominates DP", rel(OPT.A, OPT.DP), "dominates");
  expect("B vs DP", rel(OPT.B, OPT.DP), "tradeoff");
  FILLERS.forEach(function (f, i) { expect("filler " + (i + 1), rel(f.l, f.r), "tradeoff"); });
  if (!checkPassed && window.console) {
    console.warn("[" + PROBE_ID + "] STRUCTURAL CHECK FAILED\n" + checkNotes.join("\n"));
  }

  /* ---------------- sequence ----------------
     Screen 1 is fixed (it sets the branch). The two test legs sit at position
     4 or later and are never adjacent, so neither is answered off the back of
     screen 1 or of each other. */

  var N_SCREENS = 1 + 2 + FILLERS.length;      /* 7 */
  var legPos = null;
  for (var attempt = 0; attempt < 2000; attempt++) {
    var slots = shuffle([2, 3, 4, 5, 6, 7]);
    var a = slots[0], b = slots[1];
    if (a > b) { var t = a; a = b; b = t; }
    if (a >= 4 && (b - a) >= 2) { legPos = [a, b]; break; }
  }
  if (!legPos) legPos = [4, 6];
  var legOrder = shuffle(["dom", "trans"]);     /* which leg comes first */
  var fillOrder = shuffle([0, 1, 2, 3]);

  var plan = [];
  plan[0] = { kind: "choice1" };
  plan[legPos[0] - 1] = { kind: legOrder[0] };
  plan[legPos[1] - 1] = { kind: legOrder[1] };
  var fi = 0;
  for (var i = 0; i < N_SCREENS; i++) if (!plan[i]) plan[i] = { kind: "filler", f: fillOrder[fi++] };

  var codePool = shuffle(CODES.slice());
  plan.forEach(function (p, i) { p.codes = [codePool[i * 2], codePool[i * 2 + 1]]; });

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    seed: seedUsed,
    probe_position: P.pos,
    n_screens: N_SCREENS,
    check_passed: checkPassed,
    check_notes: checkNotes.join(" | "),
    leg_positions: legPos.join(","),
    leg_order: legOrder.join(","),
    branch: null,                 /* "A" or "B" — which option was chosen first */
    choice_1: null,               /* "A" or "B" */
    dom_leg_pair: null,           /* e.g. "B_vs_D" */
    dom_leg_choice: null,
    dom_violation: null,          /* chose the dominated option */
    trans_leg_pair: null,         /* e.g. "A_vs_D" */
    trans_leg_choice: null,
    trans_violation: null,        /* chose D over the option chosen in screen 1 */
    cycle: null,                  /* dominance leg correct AND transitivity leg violated */
    gap_1_to_trans: null,
    n_screens_completed: 0,
    block_complete: 0,
    t_block_ms: null,
    screens: []
  };

  /* ---------------- render ---------------- */

  var screenEl = document.getElementById("screen");
  document.getElementById("blockinst").innerHTML =
    '<span class="counter" id="counter"></span>' + BLOCK_INSTRUCTIONS;

  var idx = 0, selected = null, changes = 0, tStart = 0, tFirst = null, current = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Which two options this screen shows, as [key, vals] pairs. */
  function buildScreen(p) {
    if (p.kind === "choice1") return { pair: "A_vs_B", opts: [["A", OPT.A], ["B", OPT.B]] };
    if (p.kind === "filler") {
      var f = FILLERS[p.f];
      return { pair: "filler" + (p.f + 1), opts: [["l", f.l], ["r", f.r]] };
    }
    var chose = state.choice_1;                     /* set by screen 1 */
    var third = (chose === "A") ? "D" : "DP";
    var rejected = (chose === "A") ? "B" : "A";
    if (p.kind === "dom") {
      return { pair: rejected + "_vs_" + third, opts: [[rejected, OPT[rejected]], [third, OPT[third]]] };
    }
    return { pair: chose + "_vs_" + third, opts: [[chose, OPT[chose]], [third, OPT[third]]] };
  }

  function renderScreen() {
    var p = plan[idx];
    current = buildScreen(p);
    selected = null; changes = 0; tFirst = null; tStart = Date.now();
    document.getElementById("counter").textContent = (idx + 1) + " of " + N_SCREENS;

    var order = shuffle([0, 1]);
    current.order = order;

    var h = '<div class="tablewrap"><table class="cmp"><thead><tr><th class="attr"></th>';
    order.forEach(function (oi, i) {
      h += '<th data-col="' + current.opts[oi][0] + '">' + esc(p.codes[i]) + '</th>';
    });
    h += '</tr></thead><tbody>';
    ROWS.forEach(function (row, ri) {
      h += '<tr><td class="attr">' + esc(row.label) + '</td>';
      order.forEach(function (oi) {
        h += '<td class="val" data-col="' + current.opts[oi][0] + '">' + esc(current.opts[oi][1][ri]) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div><p class="qtext">Which would you buy?</p><div class="picks">';
    order.forEach(function (oi, i) {
      h += '<button type="button" class="pickbtn" data-k="' + current.opts[oi][0] + '">' +
           esc(p.codes[i]) + '</button>';
    });
    h += '</div><div class="contwrap"><button type="button" class="contbtn" id="cont" disabled>Continue</button></div>';
    screenEl.innerHTML = h;

    Array.prototype.forEach.call(screenEl.querySelectorAll(".pickbtn"), function (btn) {
      btn.addEventListener("click", function () {
        var k = btn.getAttribute("data-k");
        if (selected !== null && selected !== k) changes++;
        if (tFirst === null) tFirst = Date.now() - tStart;
        selected = k;
        Array.prototype.forEach.call(screenEl.querySelectorAll(".pickbtn"), function (b) {
          b.classList.toggle("chosen", b.getAttribute("data-k") === k);
        });
        Array.prototype.forEach.call(screenEl.querySelectorAll("[data-col]"), function (c) {
          c.classList.toggle("sel", c.getAttribute("data-col") === k);
        });
        document.getElementById("cont").disabled = false;
        reportHeight();
      });
    });
    document.getElementById("cont").addEventListener("click", function () {
      if (selected === null) return;
      record();
      idx++;
      if (idx < N_SCREENS) { renderScreen(); } else { finish(); }
      window.scrollTo(0, 0);
      reportHeight();
    });
    reportHeight();
  }

  function record() {
    var p = plan[idx];
    state.screens.push({
      kind: p.kind, pair: current.pair, pos_block: idx + 1,
      choice_key: selected,
      choice_side: current.order.map(function (oi) { return current.opts[oi][0]; }).indexOf(selected) + 1,
      rt_first_ms: tFirst, rt_ms: Date.now() - tStart, changes: changes
    });
    state.n_screens_completed = state.screens.length;

    if (p.kind === "choice1") {
      state.choice_1 = selected;
      state.branch = selected;
    } else if (p.kind === "dom") {
      var third = (state.choice_1 === "A") ? "D" : "DP";
      state.dom_leg_pair = current.pair;
      state.dom_leg_choice = selected;
      state.dom_violation = (selected === third) ? 1 : 0;
    } else if (p.kind === "trans") {
      var third2 = (state.choice_1 === "A") ? "D" : "DP";
      state.trans_leg_pair = current.pair;
      state.trans_leg_choice = selected;
      state.trans_violation = (selected === third2) ? 1 : 0;
      state.gap_1_to_trans = idx;      /* screens between screen 1 and this leg */
    }
    report();
  }

  function finish() {
    /* A cycle requires the dominance leg to have held. If they violated
       monotonicity the chain is broken and the transitivity leg cannot be
       read as a cycle — it is recorded, but not counted as one. */
    if (state.dom_violation != null && state.trans_violation != null) {
      state.cycle = (state.dom_violation === 0 && state.trans_violation === 1) ? 1 : 0;
    }
    state.block_complete = 1;
    state.t_block_ms = Date.now() - t0;
    document.getElementById("counter").textContent = "";
    screenEl.innerHTML = '<p class="done">Thank you — that\'s the end of this section.</p>';
    report();
    if (P.pilot) renderPilot();
    reportHeight();
  }

  function renderPilot() {
    var h = '<div class="pilot"><h4>PILOT PANEL — not shown to respondents (pilot=1)</h4>' +
      '<p><strong>Seed:</strong> <code>' + esc(seedUsed) + '</code> &nbsp; legs at ' +
      esc(state.leg_positions) + ' (' + esc(state.leg_order) + ')</p>' +
      '<p><strong>Branch:</strong> chose ' + esc(String(state.branch)) + '<br>' +
      'dominance leg ' + esc(String(state.dom_leg_pair)) + ' → ' + esc(String(state.dom_leg_choice)) +
      (state.dom_violation ? ' <span class="bad">DOMINANCE VIOLATION</span>' : ' ok') + '<br>' +
      'transitivity leg ' + esc(String(state.trans_leg_pair)) + ' → ' + esc(String(state.trans_leg_choice)) +
      (state.trans_violation ? ' <span class="bad">TRANSITIVITY VIOLATION</span>' : ' ok') + '<br>' +
      'cycle = ' + String(state.cycle) + '</p>' +
      '<p><strong>Structural check:</strong> ' +
      (checkPassed ? 'passed' : '<span class="bad">FAILED</span>') + '<br>' +
      esc(checkNotes.join(" • ")) + '</p></div>';
    document.getElementById("pilot").innerHTML = h;
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }
  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  renderScreen();
  report();
})();
</script>
</body>
</html>
