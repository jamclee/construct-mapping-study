<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A few questions</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .lead { font-size: 15px; margin: 0 0 14px; }
  .note { font-size: 13.5px; color: #57606a; margin: 0 0 16px; }

  .block { margin-bottom: 26px; }
  .block > p.q { font-size: 14.5px; margin: 0 0 9px; }

  /* One step of the cue gradient. Answered levels stay on screen, locked, so a
     respondent can add to what they already wrote instead of repeating it. */
  .cuelevel { margin-bottom: 22px; }
  .cuelevel + .cuelevel { padding-top: 20px; border-top: 1px solid #eef1f4; }
  .cuelevel p.q { font-size: 14.5px; margin: 0 0 9px; }

  textarea {
    font-family: inherit; font-size: 14.5px; line-height: 1.5; width: 100%;
    min-height: 118px; padding: 10px 12px; border-radius: 6px;
    border: 1px solid #c8ced4; color: #1f2328; background: #fff; resize: vertical;
  }
  textarea:focus { outline: none; border-color: #2f6fb0; }
  textarea[readonly] { background: #f6f8fa; color: #57606a; }

  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .choicebtn:disabled { opacity: .45; cursor: default; }
  .linkbtn {
    font-family: inherit; font-size: 13.5px; padding: 0; border: 0; background: none;
    color: #57606a; text-decoration: underline; cursor: pointer;
  }
  .linkbtn:hover { color: #2f6fb0; }

  #cued { display: none; }
  #cued.open { display: block; }
  .sep { margin-top: 26px; padding-top: 22px; border-top: 1px solid #e6e8eb; }

  .compq { margin-bottom: 20px; }
  .compq > p { font-size: 14.5px; margin: 0 0 9px; }
  .opts { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 8px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .opt.mem { color: #57606a; font-style: italic; }
  .opt.mem.picked { color: #fff; font-style: italic; }
  .optrow { flex-direction: row; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">

  <div id="free" class="block">
    <p class="lead" id="freeLead"></p>
    <div id="cueStack"></div>
  </div>

  <div id="cued"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PRIOR-CHOICE RECALL PROBE — the credential, at the moment it is spent

     -- THE RECALL REQUIREMENT THIS PROBE TESTS --------------------------
     Licensing and credentialing accounts (choose the green pump now, feel
     entitled to the selfish option later) all share one unstated premise: the
     earlier act is STILL REPRESENTED when the later decision is made. A
     credential that has been forgotten cannot license anything. The mechanism
     is not "having done a good thing"; it is "having an accessible
     representation of having done a good thing".

     That premise is almost never measured. Studies record `chosen_profile` from
     the first task and treat it as the independent variable at the second, as
     though the act itself travels forward. What travels forward is a memory,
     and memories degrade, invert, and get reconstructed. This probe measures
     what actually arrived.

     It chains off `Compliance Probes/pump-preference-probe.html`, which emits
     `chosen_profile` ("basic" | "efficient"), `name_of_basic` and
     `name_of_efficient`. Pass those in as URL parameters; see CONFIGURATION.

     -- THE LOAD-BEARING QUESTION IS NOT "WHICH ONE DID YOU PICK" --------
     Three things could be recalled about the earlier task, and they are not
     equally relevant:

       THE LABEL      "I chose the R-40." Arbitrary. The pump probe assigns
                      model names to profiles AT RANDOM precisely so the label
                      carries no information. Nothing theoretical rests on it.
       THE ATTRIBUTE  "I chose the one that uses less electricity." This IS the
                      credential. It is the only content that can license
                      anything downstream.
       THE TRADE-OFF  "...and I paid more up front for it." The costly-signal
                      component. A credential remembered as free is a weaker
                      credential than one remembered as paid for.

     So the item set is one per component, and `passed` keys on the ATTRIBUTE
     alone. The label item is retained deliberately as a DISCRIMINANT CONTROL:
     it is memory for arbitrary detail, it is not in PASS_KEYS, and it is worth
     reporting because it calibrates the rest. If label recall and attribute
     recall are equally poor, you are looking at general disengagement; if label
     recall is poor and attribute recall is fine, respondents kept the meaning
     and dropped the wrapper, which is exactly what a functioning credential
     looks like. Plain accuracy on a single item cannot make that distinction.

     -- THE INVERSION CELL IS THE POINT, NOT AN ERROR TO DISCARD ---------
     Recall of a prior choice fails in three directions, and they are not
     interchangeable:

       CORRECT    remembers the profile they actually chose
       UNSURE     explicitly reports not remembering
       INVERTED   confidently remembers choosing the OTHER profile

     `recall_attr_inverted` is not noise. A respondent who chose the cheap pump
     but remembers choosing the efficient one is carrying a FALSE CREDENTIAL,
     and every licensing account predicts they should behave as licensed —
     because the mechanism runs on the representation, not on the history. They
     are a theoretically informative cell, not a bad subject.

     This is why the probe emits `remembered_profile` alongside the injected
     `actual_profile`. THE ANALYTIC RECOMMENDATION: do not merely exclude
     non-recallers. Re-estimate the model with `remembered_profile` as the
     predictor and compare. If the licensing effect tracks the remembered
     choice rather than the actual one, you have direct evidence for the
     accessibility premise the literature assumes. If it tracks the actual
     choice even among people who cannot recall it, the premise is wrong and
     that is a more interesting paper.

     -- PLACEMENT: AFTER THE DV. THIS ONE IS NOT NEGOTIABLE --------------
     Stronger than for a scenario probe. Asking someone to recall and describe
     a virtuous prior choice is a standard LICENSING INDUCTION. Run this before
     the DV and the probe stops being a measurement and becomes the
     manipulation — it makes the credential salient in exactly the way the
     theory says produces the effect, and it does so in every condition
     including the ones that were supposed to lack a credential. A pre-DV
     placement can generate the effect you are testing for.

     Put it on the screen immediately after the DV, with no filler between.

     -- THE LIMITATION THIS DESIGN CANNOT SOLVE ON ITS OWN ---------------
     Post-DV placement buys freedom from contaminating the DV, at a price:
     recall is measured after the behaviour, so the behaviour can contaminate
     the recall. Motivated reconstruction runs the right way to hurt you — a
     respondent who has just made a selfish choice has reason to remember their
     earlier choice as more virtuous than it was, which manufactures inversions
     in exactly the cell where they are most theoretically interesting.

     The probe cannot separate a memory error from a post-hoc justification.
     The design that can is a between-subjects control arm in which the probe
     follows a neutral filler task instead of the DV; the inversion rate in that
     arm is the memory-error baseline, and anything above it in the DV arm is
     reconstruction. If you can afford the arm, run it. If you cannot, report
     the inversion rate as an upper bound on forgetting and say why.

     -- FREE RECALL FIRST, THEN CUED -------------------------------------
     Same tiering and the same gate as the scenario probe: the open prompt must
     be submitted before the options render, because the options name the
     attribute and would otherwise supply the answer. `free_claim` is a
     provisional directional parse of the open response; `free_text` is emitted
     verbatim and is the version to hand-code.

     THE FREE TIER IS THE MATCHED MEASURE HERE, AND SHOULD CARRY THE GATE.
     This is not a stricter setting on the same measure — it is a different one,
     and licensing is the case where the difference decides the answer.

     The mechanism runs on ACCESSIBILITY: at the DV the participant faces a new,
     unrelated decision, and nothing on that screen names the pump. If the
     credential surfaces only when a probe names it, it was not available to
     license anything. But naming it is precisely what the cued tier does —
     reading "the one that used less electricity" IS the reminder. So cued
     recall here supplies retrieval support the DV never gave, and will certify
     participants whose credential was never operative.

     Read the two tiers as warranting different conclusions rather than
     competing. Cued failure means the trace is not even available, which is
     grounds for exclusion under any theory — the floor everyone should clear.
     Free failure means it was available but not accessible unprompted, which
     matters only where the mechanism requires accessibility, and here it does.

     BETTER STILL, MODEL IT RATHER THAN GATE ON IT. Open-response performance
     correlates with verbal ability, typing effort and device, so excluding on
     the free tier selects the sample on those traits. `free_claim`,
     `remembered_profile` and the injected `actual_profile` let you estimate the
     effect separately among those who recalled the credential spontaneously,
     those who only recognised it, and those who did neither. Licensing present
     in the first group and absent in the second is direct evidence for the
     accessibility premise — a stronger result than the same effect with the
     third group dropped.

     WHAT EVEN THE FREE TIER DOES NOT MEASURE. It is still prompted: the lead
     names the event and asks for the content. Accessibility AT THE DV is not
     recoverable from any probe that runs afterwards; that needs a thought-
     listing on the DV screen itself, coded for spontaneous mention of the pump
     task. Treat `free_claim` as an upper bound on accessibility, not a measure
     of it.

     -- IF THE CHAIN PARAMETERS ARE MISSING ------------------------------
     Everything here is scored against the respondent's OWN earlier choice, so
     without `chosen` the data are unscoreable. The probe falls back to
     DEMO_CHOSEN and sets `chained` = 0. Nothing is shown on screen, so a
     broken parameter is invisible to the researcher at run time — check
     `chained` in your own test response before launching, and again in the
     first rows of live data.
     ------------------------------------------------------------------ */

  var PROBE_ID = "CHOICE_RECALL";

  /* ---------------- configuration ---------------- */
  /* Expected URL parameters, from pump-preference-probe.html:
       chosen        "basic" | "efficient"        (required)
       name_basic    label shown for the basic profile
       name_eff      label shown for the efficient profile
       lag           ms between the choice task and this screen (optional)
       enc_elec      1/0 — got the electricity comprehension item right (optional)
       enc_upfront   1/0 — got the upfront-price comprehension item right (optional)
     e.g.  recall-choice.html?chosen=efficient&name_basic=Model+R-12
           &name_eff=Model+R-40&lag=214000&enc_elec=1&enc_upfront=1          */

  var FREE_RECALL    = true;
  var CUE_GRADIENT   = true;    // step down through weakening cues; see the note below
  var ADAPTIVE_STOP  = false;   // stop early once the credential appears — read the tradeoff
  var MIN_FREE_CHARS = 12;
  var ASK_CONFIDENCE = true;
  var DEMO_CHOSEN    = "efficient";
  var DEFAULT_NAMES  = { basic: "Model R-12", efficient: "Model R-40" };
  /* `passed` is the AVAILABILITY floor — the cued attribute item, the credential.
     The label item is deliberately NOT in here. For the accessibility test the
     theory actually needs, use `credential_accessible` from the free tier; see
     the free-recall note above. */
  var PASS_KEYS      = ["attr"];

  /* ---------------- injected context ---------------- */

  function param(name, dflt) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : dflt;
  }
  function paramBin(name) {
    var v = param(name, null);
    if (v === null || v === "") return null;
    if (v === "1" || v === "true" || v === "yes") return 1;
    if (v === "0" || v === "false" || v === "no") return 0;
    return null;
  }
  function paramInt(name) {
    var v = param(name, null);
    if (v === null || v === "") return null;
    var n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }

  var rawChosen = param("chosen", null);
  var CHAINED   = (rawChosen === "basic" || rawChosen === "efficient") ? 1 : 0;
  var CHOSEN    = CHAINED ? rawChosen : DEMO_CHOSEN;
  var OTHER     = CHOSEN === "basic" ? "efficient" : "basic";

  var NAMES = {
    basic:     param("name_basic", DEFAULT_NAMES.basic),
    efficient: param("name_eff",   DEFAULT_NAMES.efficient)
  };

  var LAG_MS  = paramInt("lag");
  var POSITION = param("pos", null);   // assigned lag condition, if you manipulate it
  var ENC_ELEC    = paramBin("enc_elec");
  var ENC_UPFRONT = paramBin("enc_upfront");

  /* ---------------- correct answers, derived from the injected choice ----------------
     Attribute directions come from the pump profiles: the efficient version
     uses LESS electricity and costs MORE up front. Both keys are therefore a
     function of which profile the respondent actually chose. */

  var KEY_ATTR    = CHOSEN === "efficient" ? "less"  : "more";   // electricity use
  var KEY_UPFRONT = CHOSEN === "efficient" ? "more"  : "less";   // purchase price
  var KEY_NAME    = NAMES[CHOSEN];

  /* Display order for the two labels is randomised so a position habit cannot
     look like recall. */
  var nameFirstIsChosen = Math.random() < 0.5;

  /* ---------------- free-recall cues ---------------- */
  /* Provisional. Directional cues are matched against BOTH profiles; a response
     that hits cues for both, or neither, is parsed as "unclear" rather than
     forced into a direction. Hand-code `free_text` before publishing anything
     that rests on these fields. */

  var CLAIM_CUES = {
    efficient: ["less electricity", "lower electricity", "efficient", "energy saving",
                "energy-saving", "saves energy", "saves electricity", "cheaper to run",
                "lower running", "quieter", "near silent", "near-silent",
                "more expensive one", "pricier one", "525", "$525", "845"],
    basic: ["more electricity", "cheaper one", "cheaper option", "less expensive",
            "basic", "standard one", "cheaper up front", "cheaper upfront",
            "180", "$180", "1,980", "1980", "immediately", "hum"]
  };

  var ATTR_CUES  = ["electric", "energy", "power", "watt", "running cost",
                    "run cost", "cost to run", "efficien", "bill"];
  var PRICE_CUES = ["up front", "upfront", "purchase price", "price", "cost more",
                    "cost less", "expensive", "cheap", "$"];

  /* ---------------- cued items ---------------- */

  /* The respondent-facing wording. LEVELS[2] and SINGLE_Q are the original
     single-prompt text, kept verbatim. */

  var SINGLE_LEAD = "You just chose between two different versions of a " +
                    "circulation pump.";
  var SINGLE_Q    = "In your own words, which version did you choose? What was " +
                    "different about the pump you chose compared to the one you " +
                    "did not choose?";

  var LEVELS = [
    { key: "cue1",
      prompt: "Earlier in this study you made a choice. What was it, and what " +
              "did you choose?" },
    { key: "cue2",
      prompt: "That choice involved comparing two products. Which one did you " +
              "pick, and why that one?" },
    { key: "cue3",
      prompt: SINGLE_LEAD + " " + SINGLE_Q }
  ];

  if (!CUE_GRADIENT) LEVELS = [{ key: "cue3", prompt: SINGLE_Q }];

  document.getElementById("freeLead").textContent = CUE_GRADIENT
    ? "Please answer the following from memory."
    : SINGLE_LEAD;

  var DECLINE_TEXT = "I don't remember enough to describe it";

  var MEM = ["forgot", "I don't remember"];

  function nameOpts() {
    var chosenOpt = ["chosen", NAMES[CHOSEN]];
    var otherOpt  = ["other",  NAMES[OTHER]];
    return (nameFirstIsChosen ? [chosenOpt, otherOpt] : [otherOpt, chosenOpt])
      .concat([MEM]);
  }

  var ITEMS = [
    {
      /* DISCRIMINANT CONTROL — arbitrary label memory. Not in PASS_KEYS. */
      key: "name",
      component: "label",
      text: "Earlier you were asked which of two circulation pumps you would " +
            "prefer. Which one did you say you would prefer?",
      opts: nameOpts(),
      correct: "chosen"
    },
    {
      /* THE CREDENTIAL. */
      key: "attr",
      component: "attribute",
      text: "Compared with the other version, the pump you said you would prefer:",
      opts: [
        ["less", "Used less electricity per year"],
        ["more", "Used more electricity per year"],
        ["same", "Used about the same amount of electricity"],
        MEM
      ],
      correct: KEY_ATTR,
      invertedKey: KEY_ATTR === "less" ? "more" : "less"
    },
    {
      /* THE TRADE-OFF. */
      key: "upfront",
      component: "tradeoff",
      text: "Compared with the other version, the pump you said you would prefer " +
            "cost:",
      opts: [
        ["more", "More to purchase up front"],
        ["less", "Less to purchase up front"],
        ["same", "About the same to purchase up front"],
        MEM
      ],
      correct: KEY_UPFRONT,
      invertedKey: KEY_UPFRONT === "more" ? "less" : "more"
    }
  ];

  var CONF_OPTS = [
    ["1", "Not at all confident"],
    ["2", "Slightly confident"],
    ["3", "Fairly confident"],
    ["4", "Very confident"]
  ];

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    mode: "closed_book_recall",
    paired_with: "PUMP_PREF",
    chained: CHAINED,                  // 0 means the `chosen` parameter was missing
    actual_profile: CHAINED ? CHOSEN : null,
    actual_name: CHAINED ? KEY_NAME : null,
    name_order_chosen_first: nameFirstIsChosen ? 1 : 0,
    retention_interval_ms: LAG_MS,
    probe_position: POSITION,
    enc_elec: ENC_ELEC,
    enc_upfront: ENC_UPFRONT,
    free_recall_enabled: FREE_RECALL ? 1 : 0,

    t_first_interaction: null,
    t_free_done: null,
    t_first_cued: null,
    t_done: null,

    /* tier 1 — the cue gradient */
    cue_gradient: CUE_GRADIENT ? 1 : 0,
    adaptive_stop: ADAPTIVE_STOP ? 1 : 0,
    n_cue_levels: LEVELS.length,
    n_cue_levels_shown: 0,
    cue_level_retrieved: null,         // weakest cue producing ANY direction
    cue_level_needed: null,            // weakest cue producing the RIGHT direction
    accessibility_rank: null,          // 1-3 gradient, 4 recognition-only, 5 neither

    /* aggregates across the gradient, kept for continuity with the
       single-prompt version of this probe */
    free_text: null,                   // all levels joined with " || "
    free_chars: null,
    free_declined: null,               // declined every level shown
    free_claim: null,                  // "efficient" | "basic" | "unclear"
    free_claim_correct: null,          // provisional; hand-code before reporting
    free_mentions_attribute: null,     // spontaneously named the running-cost dimension
    free_mentions_price: null,
    n_free_components: null,

    /* tier 2 — cued */
    n_items: ITEMS.length,
    n_answered: 0,
    answer_changes: 0,
    n_correct: 0,
    n_dont_remember: 0,

    recall_name: null,
    recall_name_correct: null,         // discriminant control, NOT in `passed`
    recall_attr: null,
    recall_attr_correct: null,
    recall_attr_inverted: null,        // the false-credential cell
    recall_attr_unsure: null,
    recall_upfront: null,
    recall_upfront_correct: null,

    /* credential derivations */
    remembered_profile: null,          // profile implied by the attribute item
    credential_held: null,             // remembers choosing the efficient version, correctly
    credential_false: null,            // remembers choosing it, but did not
    credential_lost: null,             // chose it, cannot recall or inverts
    credential_accessible: null,       // named it SPONTANEOUSLY, in the free tier
    tradeoff_recalled: null,           // attribute AND price both correct
    meaning_without_label: null,       // attribute right, label wrong

    confidence: null,
    confident_and_wrong: null,

    passed: null                       // attribute recalled correctly
  };

  /* one set of fields per cue level, so the level at which the credential first
     appeared can be recomputed from hand codes rather than from the parser */
  LEVELS.forEach(function (lv) {
    state[lv.key + "_text"] = null;
    state[lv.key + "_claim"] = null;
    state[lv.key + "_correct"] = null;
    state[lv.key + "_declined"] = null;
    state["t_" + lv.key + "_done"] = null;
  });

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- tier 1: the cue gradient ----------------

     WHY A GRADIENT RATHER THAN ONE OPEN PROMPT.
     A single "free recall" prompt that names the event and the domain — "you
     just chose between two versions of a circulation pump" — has already done
     most of the retrieval work. The respondent only supplies which one. That is
     the strictest tier in the file, but it is not a clean accessibility
     measure, and accessibility is what a licensing account requires.

     So the prompt is administered as a descending cue hierarchy, and what is
     recorded is THE WEAKEST CUE AT WHICH THE CREDENTIAL APPEARS:

       level 1  no domain named. "You made a choice." — nearest to spontaneous.
       level 2  product comparison named, pumps not.
       level 3  fully cued: the original single-prompt wording.

     This converts a binary (recalled / did not) into an ordinal (how much
     cueing was needed), which is much closer to what the theory predicts and
     gives a graded moderator rather than a split. `accessibility_rank` extends
     it past the gradient: 4 = produced nothing across all three levels but
     recognised the credential when the cued tier named it, 5 = not even that.

     THE LEAD MUST STAY NEUTRAL. With the gradient on, the top-of-screen lead
     cannot mention pumps — that sentence IS the level-3 cue, and printing it
     above level 1 collapses the gradient to a single fully-cued prompt. The
     original wording is preserved verbatim as level 3, and as the whole prompt
     when CUE_GRADIENT is false.

     ALL LEVELS ARE SHOWN BY DEFAULT, AND THIS IS DELIBERATE.
     ADAPTIVE_STOP = true halts the gradient as soon as the parser sees the
     credential. It is shorter, and it is worse, for two reasons:

       1. The administration would depend on a PROVISIONAL keyword parse. A
          generous parse stops early, a missed one hands out an extra cue, and
          neither is repairable by hand-coding afterwards — you can recode the
          text but you cannot un-show a cue.
       2. Respondents who recall well would get a SHORTER probe, confounding
          accessibility with time-on-task and with number of cues seen.

     Showing all three keeps administration constant and leaves
     `cue_level_needed` to be computed after hand-coding, which is where a
     provisional parse belongs. The cost is that someone who answered fully at
     level 1 is asked twice more; earlier responses stay on screen, locked, so
     they can simply add to them rather than repeat.

     Level 1 responses are still produced BEFORE levels 2 and 3 are visible,
     which is the property that makes the gradient work. ------------------- */

  var freeBlock = document.getElementById("free");
  var cueStack  = document.getElementById("cueStack");


  function normalise(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9$,\s']/g, " ")
      .replace(/\s+/g, " ").trim();
  }
  function hits(text, cues) {
    return cues.some(function (c) { return text.indexOf(c) !== -1; });
  }

  /* Directional parse of one response. Provisional — see the note on
     `credential_accessible`. Returns "efficient" | "basic" | "unclear". */
  function claimOf(raw) {
    var t = normalise(raw);
    var saidEffName   = NAMES.efficient && t.indexOf(NAMES.efficient.toLowerCase()) !== -1;
    var saidBasicName = NAMES.basic     && t.indexOf(NAMES.basic.toLowerCase())     !== -1;
    var eff   = hits(t, CLAIM_CUES.efficient) || saidEffName;
    var basic = hits(t, CLAIM_CUES.basic)     || saidBasicName;
    return (eff && !basic) ? "efficient"
         : (basic && !eff) ? "basic"
         : "unclear";
  }

  /* Rescore the whole gradient from the responses collected so far. */
  function scoreGradient() {
    var texts = [], needed = null, retrieved = null;

    LEVELS.forEach(function (lv, i) {
      var raw = state[lv.key + "_text"];
      if (raw === null) return;
      if (raw !== "") texts.push(raw);   // declined levels contribute nothing

      var claim = claimOf(raw);
      state[lv.key + "_claim"] = claim;
      state[lv.key + "_correct"] = claim === "unclear"
        ? null : (claim === CHOSEN ? 1 : 0);

      /* first level producing ANY direction — the choice was accessible */
      if (retrieved === null && claim !== "unclear") retrieved = i + 1;
      /* first level producing the RIGHT direction — the credential was */
      if (needed === null && claim === CHOSEN) needed = i + 1;
    });

    state.cue_level_retrieved = retrieved;
    state.cue_level_needed = needed;

    /* Backward-compatible aggregate fields: all responses concatenated, and
       the first direction produced anywhere in the gradient. */
    var all = texts.join(" || ");
    state.free_text = all;
    state.free_chars = all.length;
    state.free_claim = retrieved === null
      ? "unclear"
      : state[LEVELS[retrieved - 1].key + "_claim"];
    state.free_claim_correct = state.free_claim === "unclear"
      ? null : (state.free_claim === CHOSEN ? 1 : 0);

    var t = normalise(all);
    state.free_mentions_attribute = hits(t, ATTR_CUES)  ? 1 : 0;
    state.free_mentions_price     = hits(t, PRICE_CUES) ? 1 : 0;
    state.n_free_components =
      (state.free_claim_correct === 1 ? 1 : 0) +
      state.free_mentions_attribute + state.free_mentions_price;

    /* THE ACCESSIBILITY MEASURE — the credential named without being prompted
       with it. This, not `passed`, is the field an accessibility-dependent
       account needs; `passed` keys on the cued item and is the availability
       floor. The LOOSE version: produced at any gradient level. For the graded
       version use `cue_level_needed` / `accessibility_rank`, which say how much
       cueing it took.

       Provisional either way: derived from keyword parsing, so recompute from
       hand codes before it carries a gate or an interaction term. A generous
       parse overstates spontaneous retrieval and biases towards confirming the
       very premise you would be testing. */
    if (CHAINED) {
      state.credential_accessible =
        (needed !== null && CHOSEN === "efficient") ? 1 : 0;
    }
  }

  /* ---- rendering one level at a time ---- */

  var levelIndex = 0;

  function renderLevel(i) {
    var lv = LEVELS[i];
    var wrap = document.createElement("div");
    wrap.className = "cuelevel";
    wrap.setAttribute("data-level", lv.key);
    wrap.innerHTML =
      '<p class="q"></p>' +
      '<textarea placeholder="Type whatever you remember."></textarea>' +
      '<div class="btnrow">' +
        '<button type="button" class="choicebtn" disabled>Continue</button>' +
        '<button type="button" class="linkbtn"></button>' +
      '</div>';
    wrap.querySelector("p.q").textContent = lv.prompt;
    wrap.querySelector(".linkbtn").textContent = DECLINE_TEXT;
    cueStack.appendChild(wrap);

    var area = wrap.querySelector("textarea");
    var go   = wrap.querySelector(".choicebtn");
    var none = wrap.querySelector(".linkbtn");

    area.addEventListener("input", function () {
      markInteraction();          /* first keystroke — the retrieval latency */
      go.disabled = area.value.trim().length < MIN_FREE_CHARS;
      reportHeight();
    });
    go.addEventListener("click", function () { closeLevel(i, wrap, area, false); });
    none.addEventListener("click", function () { closeLevel(i, wrap, area, true); });

    area.focus();
    reportHeight();
  }

  function closeLevel(i, wrap, area, declined) {
    /* A level is answered once. Without this guard a second firing — a stale
       listener, a double submit — would overwrite the stored response with the
       now-empty locked textarea, silently destroying that level's data. */
    if (wrap.getAttribute("data-closed") === "1") return;
    wrap.setAttribute("data-closed", "1");

    var lv = LEVELS[i];
    markInteraction();

    state[lv.key + "_text"] = declined ? "" : area.value.trim();
    state[lv.key + "_declined"] = declined ? 1 : 0;
    state["t_" + lv.key + "_done"] = Date.now() - t0;
    state.n_cue_levels_shown = i + 1;

    if (declined) area.value = "";
    area.readOnly = true;
    wrap.querySelector(".btnrow").style.display = "none";

    scoreGradient();

    /* Adaptive mode stops as soon as the credential appears. Off by default —
       see the tradeoff in the block comment above. */
    var stopEarly = ADAPTIVE_STOP && state.cue_level_needed !== null;
    var more = (i + 1 < LEVELS.length) && !stopEarly;

    if (more) {
      levelIndex = i + 1;
      renderLevel(levelIndex);
    } else {
      /* declined the whole gradient — every level that was actually shown */
      var shown = LEVELS.slice(0, i + 1);
      state.free_declined = shown.every(function (l) {
        return state[l.key + "_declined"] === 1;
      }) ? 1 : 0;
      state.t_free_done = Date.now() - t0;
      showCued();
    }

    report();
    reportHeight();
  }

  if (!FREE_RECALL) {
    freeBlock.style.display = "none";
  } else {
    renderLevel(0);
  }

  /* ---------------- tier 2: cued ---------------- */

  var cuedEl = document.getElementById("cued");
  var cuedShown = false;

  function showCued() {
    if (cuedShown) return;
    cuedShown = true;

    var html = '<p class="note">Still from memory, please answer the following.</p>' +
      ITEMS.map(function (q) {
        return '<div class="compq" data-q="' + q.key + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="opts">' + q.opts.map(function (o) {
                   var cls = "opt" + (o[0] === "forgot" ? " mem" : "");
                   return '<button type="button" class="' + cls + '" data-val="' +
                          o[0] + '">' + o[1] + '</button>';
                 }).join("") + '</div>' +
               '</div>';
      }).join("");

    if (ASK_CONFIDENCE) {
      html += '<div class="compq" data-q="__conf">' +
                '<p>How confident are you that your answers above are correct?</p>' +
                '<div class="opts optrow">' + CONF_OPTS.map(function (o) {
                  return '<button type="button" class="opt" data-val="' + o[0] +
                         '">' + o[1] + '</button>';
                }).join("") + '</div>' +
              '</div>';
    }

    cuedEl.innerHTML = html;
    cuedEl.classList.add("open");
    if (FREE_RECALL) cuedEl.classList.add("sep");
  }

  cuedEl.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var block = opt.closest(".compq");
    var key = block.getAttribute("data-q");
    var val = opt.getAttribute("data-val");

    block.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("picked", b === opt);
    });

    markInteraction();
    if (state.t_first_cued === null) state.t_first_cued = Date.now() - t0;

    if (key === "__conf") {
      state.confidence = parseInt(val, 10);
    } else {
      var field = "recall_" + key;
      if (state[field] !== null && state[field] !== val) state.answer_changes += 1;
      state[field] = val;
    }

    rescore();
    report();
    reportHeight();
  });

  function rescore() {
    var answered = 0, correct = 0, forgot = 0;

    ITEMS.forEach(function (q) {
      var a = state["recall_" + q.key];
      state["recall_" + q.key + "_correct"] = a === null ? null : (a === q.correct ? 1 : 0);
      if (a !== null) {
        answered += 1;
        if (a === q.correct) correct += 1;
        if (a === "forgot") forgot += 1;
      }
    });

    state.n_answered = answered;
    state.n_correct = correct;
    state.n_dont_remember = forgot;

    /* the attribute item, in its three theoretically distinct directions */
    var attr = state.recall_attr;
    if (attr !== null) {
      var inv = ITEMS.filter(function (q) { return q.key === "attr"; })[0].invertedKey;
      state.recall_attr_inverted = attr === inv ? 1 : 0;
      state.recall_attr_unsure   = (attr === "forgot" || attr === "same") ? 1 : 0;

      /* which profile does their answer imply they chose? */
      state.remembered_profile = attr === "less" ? "efficient"
                               : attr === "more" ? "basic"
                               : null;

      if (CHAINED) {
        state.credential_held  = (state.remembered_profile === "efficient" &&
                                  CHOSEN === "efficient") ? 1 : 0;
        state.credential_false = (state.remembered_profile === "efficient" &&
                                  CHOSEN === "basic") ? 1 : 0;
        state.credential_lost  = (CHOSEN === "efficient" &&
                                  state.remembered_profile !== "efficient") ? 1 : 0;
      }
    }

    if (state.recall_attr_correct !== null && state.recall_upfront_correct !== null) {
      state.tradeoff_recalled =
        (state.recall_attr_correct === 1 && state.recall_upfront_correct === 1) ? 1 : 0;
    }
    if (state.recall_attr_correct !== null && state.recall_name_correct !== null) {
      state.meaning_without_label =
        (state.recall_attr_correct === 1 && state.recall_name_correct === 0) ? 1 : 0;
    }

    /* THE ORDINAL ACCESSIBILITY MEASURE. One scale spanning both tiers:

         1  produced at the weakest cue — nearest to spontaneous
         2  needed the product-comparison cue
         3  needed the fully cued prompt
         4  produced nothing across the gradient, but recognised the credential
            once the cued tier named it — available, not accessible
         5  did not recognise it either — not retained

       Lower is more accessible. Treat it as ordinal, not interval: the step
       from 3 to 4 is a change of retrieval mode, not one more notch of cueing.
       Provisional while `cue_level_needed` comes from the parser; recompute
       from hand codes before it carries an interaction term. */
    if (state.recall_attr_correct !== null) {
      state.accessibility_rank = state.cue_level_needed !== null
        ? state.cue_level_needed
        : (state.recall_attr_correct === 1 ? 4 : 5);
    }

    var allScoredIn = PASS_KEYS.every(function (k) { return state["recall_" + k] !== null; });
    if (allScoredIn) {
      state.passed = PASS_KEYS.every(function (k) {
        return state["recall_" + k + "_correct"] === 1;
      }) ? 1 : 0;
      if (state.confidence !== null) {
        state.confident_and_wrong = (state.confidence >= 3 && state.passed === 0) ? 1 : 0;
      }
    }

    var allAnswered = answered === ITEMS.length &&
                      (!ASK_CONFIDENCE || state.confidence !== null);
    if (allAnswered && state.t_done === null) state.t_done = Date.now() - t0;
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  if (!FREE_RECALL) showCued();

  report();
  reportHeight();
})();
</script>
</body>
</html>
