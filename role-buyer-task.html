<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Refit</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  #scenario { margin: 0 0 20px; }
  #scenario p { margin: 0 0 11px; }
  #scenario p:last-child { margin-bottom: 0; }

  .progress {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: #737b82;
    padding-bottom: 8px; border-bottom: 1px solid #e6e8eb; margin-bottom: 16px;
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dfe3e7; }
  .dot.done { background: #9fb8d1; }
  .dot.current { background: #2f6fb0; }

  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; transition: transform 0.28s ease; }
  .slide { flex: 0 0 100%; min-width: 100%; padding: 0 1px; }

  .tname { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  .tsub { font-size: 12.5px; color: #737b82; margin: 0 0 12px; }

  .opts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ocard {
    border: 1px solid #dfe3e7; border-radius: 7px; padding: 13px 14px;
    background: #fff; cursor: pointer;
  }
  .ocard:hover { border-color: #2f6fb0; }
  .ocard.picked { border-color: #2f6fb0; box-shadow: 0 0 0 1px #2f6fb0 inset; }
  .oname { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .orow { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  .olab { flex: 0 0 106px; color: #737b82; }
  .oval { color: #1f2328; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .navbtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 20px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: #2f6fb0; color: #2f6fb0; }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .navbtn.primary:hover:not(:disabled) { background: #275e97; color: #fff; }
  .navbtn.primary:disabled { background: #b7c9db; border-color: #b7c9db; color: #fff; opacity: 1; }

  #done { display: none; margin-top: 18px; font-size: 14px; color: #4a5158; }
  #done.open { display: block; }

  @media (max-width: 560px) { .opts2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scenario"></div>

  <div class="progress">
    <span id="counter"></span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="nav">
    <button type="button" class="navbtn" id="backBtn">Back</button>
    <button type="button" class="navbtn primary" id="nextBtn">Next</button>
  </div>

  <div id="done">Your answers have been recorded. Please continue.</div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PERSPECTIVE-ADOPTION PROBE — ROLE ASSIGNMENT (P2)

     WHAT THE UNDERLYING DIMENSION REALLY IS. The upstream pump task measures
     how a participant weights UPFRONT cost against LONG-RUN cost. Energy was
     only the vehicle. This probe uses durability and total cost of ownership
     instead: same orientation, no environmental content, no moral dimension
     for a participant to resist, and a surface that reads nothing like the
     personal-goal probe.

     PARAMETER MAPPING. The pipeline passes goal/own as price|environmental for
     continuity with the pump task; internally these map to upfront|longrun.
     Both the incoming value and the local objective are logged.

     WHY AN INSTITUTIONAL ROLE. The objective belongs to an organisation and is
     stated as policy — a larger self-distance than P1 (a different agent, not
     merely a different circumstance) while keeping the compliance confound
     LOWER, because executing an employer's procurement standard is a
     legitimate role rather than a personal endorsement.

     AVOIDING THE "TEST QUESTION" REGISTER. A goal plus one visibly cheaper
     option is a lookup, and a task made of lookups reads as compliance
     checking, which makes participants vigilant for the rest of a study. Four
     features work against that:

       1. A COMPETING CONSIDERATION. The refit has an eight-week deadline, so
          lead time genuinely matters. Two items place the goal-consistent
          option past that deadline, creating a real dilemma rather than an
          obvious answer. Cross-pressure is balanced — one item pressures each
          objective — so neither condition is systematically harder.

       2. VARIED GAP SIZE. One item has large differences on both dimensions;
          another has differences small enough that the objective barely bites
          and the choice reads as genuine preference.

       3. NON-REDUNDANT ATTRIBUTES. Purchase price and ten-year cost each speak
          to one objective. Showing service life as well would have made two of
          three rows point the same way and flagged the answer.

       4. THE OBJECTIVE IS EMBEDDED IN PROSE, not set apart as an instruction.
          It is information about the situation rather than a directive, and a
          less salient objective makes encoding it part of what is measured.

     CONSEQUENCE FOR SCORING. Because two items carry genuine cross-pressure,
     4/4 is no longer the expected score for an adopting participant, and a
     non-goal-consistent choice on those items is defensible rather than a
     failure. conflict_profile records each item's type in presentation order,
     so the clean item can be scored separately if the pressured ones prove too
     noisy. The congruent/incongruent contrast remains the primary comparison.

     Labels are POSITIONAL and side order is randomised per item, so the
     letters carry no information. All attributes are visible; gating would
     confound standpoint with acquisition.
     ------------------------------------------------------------------ */

  var PROBE_ID = "ROLE_BUYER";
  var DEADLINE_WEEKS = 8;

  // "crossed" — random assignment, yielding both congruent and incongruent
  // "incongruent" — always the objective opposite the participant's own
  // "congruent" — always matching the participant's own orientation
  var ASSIGNMENT_MODE = "crossed";

  /* Objective embedded mid-paragraph rather than isolated as an instruction. */
  var SCENARIOS = {
    upfront:
      "Imagine that you manage facilities for a mid-sized company that is " +
      "refitting its offices. A larger-than-expected expense earlier in the " +
      "year has left the budget tight, and the finance director has asked you " +
      "to keep the purchase price of each item as low as you can. The refit " +
      "needs to be finished before a new team arrives in eight weeks.",
    longrun:
      "Imagine that you manage facilities for a mid-sized company that is " +
      "refitting its offices. The company adopted a procurement standard this " +
      "year that judges purchases on what they cost over their whole life " +
      "rather than on purchase price, so you have been asked to keep the " +
      "ten-year cost of each item as low as you can. The refit needs to be " +
      "finished before a new team arrives in eight weeks."
  };

  /* pressure:
       "clean"        — large gaps, both options within the deadline
       "late_upfront" — the cheaper option arrives after the deadline
       "late_longrun" — the lower ten-year-cost option arrives after the deadline
       "small"        — differences small enough that the objective barely bites */
  var TRIALS = [
    { item: "Task chairs", sub: "Sixty units for the open-plan floor",
      pressure: "clean",
      a: { kind: "upfront", buy: "$9,000",  ten: "About $24,000", lead: "3 weeks",  supplier: "Current vendor" },
      b: { kind: "longrun", buy: "$16,200", ten: "About $17,700", lead: "4 weeks",  supplier: "National supplier" } },

    { item: "Flooring", sub: "Four hundred square metres across two floors",
      pressure: "late_upfront",
      a: { kind: "upfront", buy: "$12,000", ten: "About $33,000", lead: "11 weeks", supplier: "Regional supplier" },
      b: { kind: "longrun", buy: "$21,000", ten: "About $24,500", lead: "4 weeks",  supplier: "Current vendor" } },

    { item: "Desks", sub: "Sixty height-adjustable workstations",
      pressure: "late_longrun",
      a: { kind: "upfront", buy: "$18,000", ten: "About $40,000", lead: "5 weeks",  supplier: "National supplier" },
      b: { kind: "longrun", buy: "$28,800", ten: "About $30,000", lead: "12 weeks", supplier: "Regional supplier" } },

    { item: "Meeting-room partitions", sub: "Movable walls for six rooms",
      pressure: "small",
      a: { kind: "upfront", buy: "$7,500",  ten: "About $16,000", lead: "4 weeks",  supplier: "Regional supplier" },
      b: { kind: "longrun", buy: "$8,900",  ten: "About $15,200", lead: "6 weeks",  supplier: "Current vendor" } }
  ];

  /* ---------------- objective assignment ---------------- */

  function qparam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function coin() { return Math.random() < 0.5; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function toLocal(v) {
    if (v === "price" || v === "upfront") return "upfront";
    if (v === "environmental" || v === "longrun") return "longrun";
    return null;
  }
  function flip(g) { return g === "upfront" ? "longrun" : "upfront"; }

  var ownRaw = qparam("own");
  var ownGoal = toLocal(ownRaw);

  var goalRaw = qparam("goal");
  var assignedGoal = toLocal(goalRaw);
  if (assignedGoal === null) {
    if (ownGoal && ASSIGNMENT_MODE === "incongruent")    assignedGoal = flip(ownGoal);
    else if (ownGoal && ASSIGNMENT_MODE === "congruent") assignedGoal = ownGoal;
    else assignedGoal = coin() ? "upfront" : "longrun";
  }

  var congruent = ownGoal === null ? null : (assignedGoal === ownGoal ? 1 : 0);
  var order = shuffle(TRIALS);

  /* ---------------- state ---------------- */

  var t0 = Date.now();
  var state = {
    probe: PROBE_ID,
    assigned_goal: assignedGoal,
    assigned_goal_raw: goalRaw,
    own_goal: ownGoal,
    own_goal_raw: ownRaw,
    congruent: congruent,
    goal_source: goalRaw ? "url" : (ownGoal ? ASSIGNMENT_MODE : "random"),
    item_order: order.map(function (t) { return t.item; }).join(","),
    conflict_profile: order.map(function (t) { return t.pressure; }).join(","),
    side_order: null,
    choices: null,
    n_goal_consistent: 0,          // 0-4, all items
    n_goal_consistent_clean: 0,    // items with no cross-pressure — "clean" and "small"
    n_clean_items: 0,
    n_own_goal_consistent: 0,
    n_answered: 0,
    trial_dwell: null,
    n_back: 0,
    max_item_reached: 0,
    t_first_interaction: null,
    t_last_choice: null,
    finished: 0,
    t_finished: null
  };

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- scenario ---------------- */

  document.getElementById("scenario").innerHTML =
    '<p>' + SCENARIOS[assignedGoal] + '</p>' +
    '<p>For each item, choose the option you would order.</p>';

  /* ---------------- render ---------------- */

  var sideOrder = order.map(function () { return coin(); });   // true = a first
  state.side_order = sideOrder.map(function (x) { return x ? "a" : "b"; }).join(",");

  function optCard(o, label) {
    return '<div class="ocard" data-kind="' + o.kind + '">' +
             '<p class="oname">' + label + '</p>' +
             '<div class="orow"><span class="olab">Purchase price</span><span class="oval">' + o.buy + '</span></div>' +
             '<div class="orow"><span class="olab">Ten-year cost</span><span class="oval">' + o.ten + '</span></div>' +
             '<div class="orow"><span class="olab">Lead time</span><span class="oval">' + o.lead + '</span></div>' +
             '<div class="orow"><span class="olab">Supplier</span><span class="oval">' + o.supplier + '</span></div>' +
           '</div>';
  }

  document.getElementById("track").innerHTML = order.map(function (tr, i) {
    var first = sideOrder[i] ? tr.a : tr.b;
    var second = sideOrder[i] ? tr.b : tr.a;
    return '<div class="slide" data-trial="' + i + '">' +
             '<p class="tname">' + tr.item + '</p>' +
             '<p class="tsub">' + tr.sub + '</p>' +
             '<div class="opts2">' + optCard(first, "Option A") + optCard(second, "Option B") + '</div>' +
           '</div>';
  }).join("");

  document.getElementById("dots").innerHTML =
    order.map(function () { return '<span class="dot"></span>'; }).join("");

  /* ---------------- carousel ---------------- */

  var track = document.getElementById("track");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var picks = new Array(order.length).fill(null);
  var dwell = new Array(order.length).fill(0);
  var index = 0;
  var enteredAt = Date.now();

  function accrue() {
    var now = Date.now();
    dwell[index] += now - enteredAt;
    enteredAt = now;
    state.trial_dwell = dwell.join(",");
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    document.getElementById("counter").textContent =
      "Item " + (index + 1) + " of " + order.length;
    document.querySelectorAll(".dot").forEach(function (d, i) {
      d.classList.toggle("current", i === index);
      d.classList.toggle("done", i !== index && picks[i] !== null);
    });
    backBtn.disabled = index === 0;
    nextBtn.disabled = picks[index] === null;
    nextBtn.textContent = index === order.length - 1 ? "Done" : "Next";
    if (index > state.max_item_reached) state.max_item_reached = index;
    reportHeight();
  }

  function goTo(i) {
    accrue(); index = i; enteredAt = Date.now(); render(); report();
  }

  backBtn.addEventListener("click", function () {
    if (index === 0) return;
    markInteraction();
    state.n_back += 1;
    goTo(index - 1);
  });

  nextBtn.addEventListener("click", function () {
    markInteraction();
    if (index < order.length - 1) { goTo(index + 1); return; }
    accrue();
    state.finished = 1;
    state.t_finished = Date.now() - t0;
    nextBtn.disabled = true;
    backBtn.disabled = true;
    document.getElementById("done").classList.add("open");
    report();
    reportHeight();
  });

  /* ---------------- responses ---------------- */

  track.addEventListener("click", function (e) {
    var card = e.target.closest(".ocard");
    if (!card) return;

    markInteraction();
    var slide = card.closest(".slide");
    var idx = parseInt(slide.getAttribute("data-trial"), 10);

    slide.querySelectorAll(".ocard").forEach(function (c) {
      c.classList.toggle("picked", c === card);
    });
    picks[idx] = card.getAttribute("data-kind");

    var answered = 0, consistent = 0, ownConsistent = 0, clean = 0, cleanTotal = 0;
    picks.forEach(function (p, i) {
      var pressured = order[i].pressure === "late_upfront" || order[i].pressure === "late_longrun";
      if (!pressured) cleanTotal += 1;
      if (p === null) return;
      answered += 1;
      if (p === assignedGoal) {
        consistent += 1;
        if (!pressured) clean += 1;
      }
      if (ownGoal !== null && p === ownGoal) ownConsistent += 1;
    });

    state.choices = picks.join(",");
    state.n_answered = answered;
    state.n_goal_consistent = consistent;
    state.n_goal_consistent_clean = clean;
    state.n_clean_items = cleanTotal;
    state.n_own_goal_consistent = ownConsistent;
    state.t_last_choice = Date.now() - t0;

    render();
    report();
  });

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(function () { accrue(); reportHeight(); }, 1000);

  render();
  report();
  reportHeight();
})();
</script>
</body>
</html>
