<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words-in-a-Word Game — Instructions</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: #1f2328; background: #fff;
    padding: 4px 2px 18px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  h2.title { font-size: 19px; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.2px; }
  .scenario { font-size: 15px; margin: 0 0 8px; }
  .scenario p { margin: 0 0 12px; }

  .target {
    margin: 16px 0 18px; padding: 16px 15px; text-align: center;
    background: #f7f9fb; border: 1px solid #e6ebf0; border-radius: 7px;
  }
  .target .lab { font-size: 12.5px; color: #737b82; letter-spacing: 0.03em;
                 text-transform: uppercase; font-weight: 600; }
  .target .word { font-size: 27px; font-weight: 700; letter-spacing: 5px;
                  margin-top: 5px; color: #1f2328; }

  /* scoring block — sits inside the prose where the scoring mechanism belongs */
  .scorebox {
    margin: 4px 0 16px; padding: 14px 16px;
    background: #f7f9fb; border: 1px solid #e6ebf0; border-left: 3px solid #2f6fb0;
    border-radius: 6px;
  }
  .scorebox h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  table.score { border-collapse: collapse; width: 100%; max-width: 380px; margin-top: 2px; }
  table.score td { font-size: 14px; padding: 4.5px 0; border-bottom: 1px solid #e6ebf0; }
  table.score td.pts { text-align: right; font-weight: 600; width: 92px; }
  table.score tr:last-child td { border-bottom: none; }

  /* running-score mock — makes "see your score as you play" concrete */
  .progmock { margin-top: 13px; padding-top: 12px; border-top: 1px solid #e6ebf0; }
  .progcap { font-size: 12.5px; color: #737b82; margin: 0 0 7px; }
  .progbar {
    display: flex; align-items: baseline; gap: 9px;
    padding: 8px 12px; background: #fff; border: 1px solid #dfe3e7; border-radius: 6px;
  }
  .progbar .plab2 { font-size: 12.5px; color: #737b82; text-transform: uppercase;
                    letter-spacing: 0.03em; font-weight: 600; }
  .progbar .pnum { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .progbar .pclock { margin-left: auto; font-size: 13px; color: #737b82;
                     font-variant-numeric: tabular-nums; }

  /* compact rules recap, kept on screen while the items are answered */
  .rulesbox { border: 1px solid #dfe3e7; border-radius: 7px; padding: 14px 16px; margin-bottom: 4px; }
  .rulesbox h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .rulesbox h3.second { margin-top: 16px; }
  .rulesbox ul { margin: 0; padding-left: 18px; }
  .rulesbox li { font-size: 14px; margin-bottom: 6px; }

  .decision { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  .choicebtn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 18px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
  }
  .choicebtn:hover { border-color: #2f6fb0; color: #2f6fb0; background: #f2f7fc; }
  .choicebtn.primary { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .choicebtn.primary:hover { background: #2a629c; color: #fff; }
  .choicebtn[disabled] { opacity: 0.45; cursor: default; }
  .choicebtn[disabled]:hover { border-color: #c8ced4; color: #1f2328; background: #fff; }

  .ackrow { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; }
  .ackrow input { margin: 3px 0 0; width: 15px; height: 15px; flex: 0 0 auto; cursor: pointer; }
  .ackrow label { font-size: 14px; cursor: pointer; }

  #example { display: none; }
  #example.open { display: block; }
  .exintro { font-size: 15px; margin: 0 0 14px; }

  /* the items sit directly under the rules they refer to, so they need a rule
     to separate them from the material that stays visible above */
  #comp { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e6e8eb; }
  .compintro { font-size: 13px; color: #737b82; margin: 0 0 18px; }
  .compq { margin-bottom: 22px; }
  .compq > p { font-size: 14.5px; margin: 0 0 10px; }

  /* which-words-count checklist */
  .wrow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 0; border-bottom: 1px solid #f0f2f5;
  }
  .wrow:last-child { border-bottom: none; }
  .wword { flex: 0 0 118px; font-size: 15px; font-weight: 600; letter-spacing: 0.7px; }
  .wbtns { display: flex; gap: 7px; }
  .mark { flex: 0 0 auto; font-size: 12.5px; font-weight: 600; margin-left: auto; }
  .mark.ok { color: #2b7a4b; }
  .mark.no { color: #a33; }

  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .optcol { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .opt {
    font-family: inherit; font-size: 13.5px; padding: 7px 14px; border-radius: 5px;
    border: 1px solid #c8ced4; background: #fff; color: #1f2328; cursor: pointer;
    text-align: left;
  }
  .opt:hover { border-color: #2f6fb0; color: #2f6fb0; }
  .opt.picked { border-color: #2f6fb0; background: #2f6fb0; color: #fff; }
  .opt.wrongpick { border-color: #a33; background: #a33; color: #fff; }

  .feedback {
    display: none; margin: 0 0 18px; padding: 11px 14px; border-radius: 6px;
    font-size: 14px; background: #fdf3f3; border: 1px solid #f0d8d8; color: #7a2b2b;
  }
  .feedback.open { display: block; }
  .feedback.good { background: #f2f9f4; border-color: #cfe6d7; color: #245c39; }

  #done { display: none; margin-top: 20px; padding-top: 18px; border-top: 1px solid #e6e8eb; }
  #done.open { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <!-- SCREEN 1: game description + scoring. No letter set yet. -->
  <div id="intro">
    <h2 class="title">Words-in-a-Word Game</h2>
    <div class="scenario" id="introText"></div>
    <div class="scorebox" id="scoreBox"></div>
    <div class="scenario" id="introClose"></div>
    <div class="decision">
      <div class="ackrow">
        <input type="checkbox" id="ack">
        <label for="ack" id="ackLabel"></label>
      </div>
      <button type="button" class="choicebtn primary" id="continueBtn" disabled>Continue</button>
    </div>
  </div>

  <!-- SCREEN 2: worked example. Rules stay on screen above the items. -->
  <div id="example">
    <p class="exintro" id="exIntro"></p>
    <div class="target" id="targetBox"></div>
    <div class="rulesbox" id="rulesBox"></div>

    <div id="comp">
      <div class="feedback" id="feedback"></div>
      <div id="items"></div>
      <div class="decision">
        <button type="button" class="choicebtn primary" id="submitBtn" disabled>Submit</button>
      </div>
    </div>
  </div>

  <div id="done"></div>

</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     RULE-COMPREHENSION PROBE — words-in-a-word game, before play

     TWO SCREENS, MATCHING THE STUDY FLOW.

       Screen 1  the game description and the scoring table. No letter set is
                 shown yet, so nothing here is example-specific. An
                 acknowledgement checkbox gates Continue.
       Screen 2  the worked example. The letter set (PLAYGROUND) appears, the
                 rules and scoring table are RESTATED IN FULL above the items,
                 and the comprehension items sit directly beneath them.

     NO MEMORY DEMAND ON SCREEN 2. The rules recap and the scoring table are
     rendered on the same screen as the items and are never withdrawn, so
     nothing has to be carried across the page break. This is deliberate. A
     respondent who misses an item here has not forgotten a rule — it is
     directly above the question — so failure is attributable to not reading or
     not understanding rather than to retention. That is the cleaner
     comprehension construct and the fairer one: retention failures would
     otherwise be scored as comprehension failures, inflating exclusion rates
     and correlating with working memory rather than with effort.

     WHAT CO-VISIBILITY COSTS, AND WHY THE ITEMS STILL DISCRIMINATE. Open-book
     presentation puts the verbatim-lookup items near ceiling; read those as a
     floor check ("did they engage with the screen at all"). The discriminating
     power sits in the items that co-visibility does not weaken:

       scoring   — GROUND and DRAGON are the same length, so they are worth the
                   same. The pair is chosen so that one word is everyday and the
                   other rare, targeting the belief that a harder word must be
                   worth more. No sentence on screen contradicts that belief —
                   it has to be inferred from a table of lengths — so having the
                   rules visible does not give it away.
       LAP       — three letters, all of them legal. Only the four-letter
                   minimum rules it out, and "three letters is enough" is the
                   standing prior from most word games. Separates reading the
                   minimum from assuming it.

     RESPONSE LATENCY CARRIES REAL SIGNAL IN THIS LAYOUT. With the rules
     permanently available, `t_first_answer` and the interval to
     `t_first_submit` separate respondents who consulted the table from those
     who answered from the prior. A fast "they score the same" is genuine
     reading; a fast pick of the rarer word is the prior firing. Keep the timing
     fields in the analysis — open-book, they do work that accuracy alone
     cannot.

     TARGET WORD. PLAYGROUND has ten letters and no letter repeats. That matters
     for item construction: with every letter appearing exactly once, "no letter
     more times than it appears" has a clean single-word violation (GOOD needs
     two O's) that is not confounded with counting how many copies are free.

     THE MEMBERSHIP CHECKLIST IS RULE-DIAGNOSTIC. Each candidate isolates one
     constraint and is scored separately, so the data say WHICH rule was missed:

       DRAGON  counts        baseline valid, 6 letters
       LOUD    counts        baseline valid, 4 letters — exactly at the minimum
       GOOD    doesn't       letter used more often than it appears (two O's)
       LAP     doesn't       three letters, below the four-letter minimum

     Two valid and two invalid, so an "everything counts" or "nothing counts"
     response set is separable from rule knowledge — though at four items either
     blanket strategy scores 2/4 by construction, which is why the checklist is
     read alongside the multiple-choice items rather than on its own.
     LOUD sits exactly at the minimum length, so it also catches an off-by-one
     reading of that rule. Presentation order is shuffled per respondent.

     TWO RULES ARE STATED BUT NOT TESTED. The letters-must-come-from-the-set
     rule and the proper-noun rule lost their probes when PLANT and RONALD were
     removed. Both are still printed in the rules and both will still be
     enforced during play, so a respondent can enter the round holding a wrong
     model of either without the checklist registering it. To restore coverage,
     add back:

       { key: "plant",  word: "PLANT",  counts: false, rule: "letter_absent" }
       { key: "ronald", word: "RONALD", counts: false, rule: "proper_noun" }

     The per-rule state fields are generated from CANDIDATES, so re-adding a
     candidate is the only edit required.

     ATTEMPT 1 IS THE MEASUREMENT — the `a1_*` fields. Attempts 2+ are the gate,
     not the measurement: incorrect items are marked and the respondent revises,
     because someone about to play the round should enter it holding the right
     scoring model. Final-state fields exist to confirm the gate closed; with
     REQUIRE_CORRECT on they are near-constant by construction. Do not score
     comprehension from them.

     Set REQUIRE_CORRECT = false for pure measurement with no feedback and no
     second attempt, at the cost of sending some respondents into the round with
     the wrong scoring model.
     ------------------------------------------------------------------ */

  var PROBE_ID = "WORDGAME_COMP";

  /* ---------------- configuration ---------------- */

  var REQUIRE_CORRECT = true;   // gate the round on a fully correct attempt
  var MAX_ATTEMPTS = 3;         // after this the round opens regardless; flagged in data
  var TARGET = "PLAYGROUND";    // example letter set, shown on screen 2 only
  var ROUND_SECONDS = 120;      // the round ends on the clock; no points target
  var MIN_LENGTH = 4;           // words must be at least this long

  /* ---------------- scoring model (single source of truth) ----------------
     The rules table and the scoring item's correct answer are both generated
     from this, so what is displayed and what is scored cannot drift apart.
     Points depend on LENGTH ALONE — there is no penalty and no bonus for
     difficulty or rarity. A word that does not count simply earns nothing. */

  var SCORING = [
    { label: "4 letters",         min: 4, max: 4,        pts: 2 },
    { label: "5 letters",         min: 5, max: 5,        pts: 4 },
    { label: "6 letters",         min: 6, max: 6,        pts: 7 },
    { label: "7 or more letters", min: 7, max: Infinity, pts: 11 }
  ];

  function pointsFor(word) {
    var n = word.length;
    for (var i = 0; i < SCORING.length; i++) {
      if (n >= SCORING[i].min && n <= SCORING[i].max) return SCORING[i].pts;
    }
    return 0;
  }

  function plural(n) { return Math.abs(n) === 1 ? " point" : " points"; }

  var NUMWORD = { 2: "two", 3: "three", 4: "four", 5: "five", 6: "six" };
  var minWord = NUMWORD[MIN_LENGTH] || String(MIN_LENGTH);
  var minutesWord = NUMWORD[ROUND_SECONDS / 60] || String(ROUND_SECONDS / 60);

  /* ---------------- membership checklist ---------------- */

  var CANDIDATES = [
    { key: "dragon", word: "DRAGON", counts: true,  rule: "baseline" },
    { key: "good",   word: "GOOD",   counts: false, rule: "letter_repeat" },
    { key: "lap",    word: "LAP",    counts: false, rule: "min_length" },
    { key: "loud",   word: "LOUD",   counts: true,  rule: "baseline" }
  ];

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  var candidateOrder = shuffle(CANDIDATES);

  /* ---------------- scoring item ----------------
     Two words of the SAME LENGTH, so under the table above they are worth the
     same. That is the whole design. GROUND is an everyday word and DRAGON is a
     markedly rarer one, so the pair is aimed squarely at the intuition that a
     harder or less common word must be worth more — the single most likely
     wrong model of a word-game scoring rule.

     WHY IT SURVIVES CO-VISIBILITY. Nothing on screen says "points depend only
     on length" in those words; it has to be inferred from a table whose rows
     are lengths. A respondent who never looks at the table has no way to reach
     the right answer, and one who holds the rarity model will not be dislodged
     by re-reading a sentence, because no sentence contradicts them. So unlike a
     verbatim-lookup item, this does not drift to ceiling when the rules stay on
     screen.

     DRAGON also appears in the membership checklist, which is intentional: its
     validity is settled there, so this item isolates the scoring rule rather
     than re-testing membership. Both words are legal on PLAYGROUND — every
     letter of GROUND and of DRAGON appears in it exactly once.

     The key is computed from pointsFor(), not hard-coded, so re-pointing PAIR
     at two words of different lengths still grades correctly.

     WHAT THIS ITEM DOES NOT TEST. The scale is non-linear (2 / 4 / 7 / 11) and
     an equal-length pair cannot detect a respondent who assumes a flat one
     point per word or per letter — both models also answer "the same". If that
     assumption matters for your analysis, pair two words of DIFFERENT lengths
     (e.g. LOUD vs DRAGON, 2 vs 7) and the item becomes a test of the bands
     instead, at the cost of the rarity manipulation. */

  var PAIR = { a: "GROUND", b: "DRAGON" };

  var pairFirstIsA = Math.random() < 0.5;                  // display order only
  var pairOrder = pairFirstIsA ? [PAIR.a, PAIR.b] : [PAIR.b, PAIR.a];

  var PAIR_PTS_A = pointsFor(PAIR.a);
  var PAIR_PTS_B = pointsFor(PAIR.b);
  var PAIR_CORRECT = PAIR_PTS_A === PAIR_PTS_B
    ? "same"
    : (PAIR_PTS_A > PAIR_PTS_B ? "a" : "b");

  function pairOptions() {
    var wa = ["a", PAIR.a], wb = ["b", PAIR.b];
    return (pairFirstIsA ? [wa, wb] : [wb, wa]).concat([
      ["same", "They score the same number of points"],
      ["cant", "There is no way to tell from the rules"]
    ]);
  }

  var MC_ITEMS = [
    {
      key: "scoring",
      text: "Both " + pairOrder[0] + " and " + pairOrder[1] +
            " count as words. Which one scores more points?",
      opts: pairOptions(),
      correct: PAIR_CORRECT,
      layout: "col"
    },
    {
      key: "roundend",
      text: "What brings the round to an end?",
      opts: [
        ["time",    "The " + minutesWord + " minutes are up"],
        ["ten",     "You have submitted ten words"],
        ["invalid", "You submit a word that does not count"],
        ["points",  "You reach a set number of points"]
      ],
      correct: "time",
      layout: "col"
    }
  ];

  var N_SUBITEMS = CANDIDATES.length + MC_ITEMS.length;   // 4 + 2 = 6

  /* ---------------- state ---------------- */

  var t0 = Date.now();

  var state = {
    probe: PROBE_ID,
    target_word: TARGET,
    n_subitems: N_SUBITEMS,
    require_correct: REQUIRE_CORRECT ? 1 : 0,
    layout: "open_book",         // rules co-visible with the items on screen 2

    t_first_interaction: null,
    ack_checked: 0,              // ticked the acknowledgement box on screen 1
    ack_toggles: 0,
    t_ack: null,
    t_rules_read: null,          // dwell on screen 1 before continuing

    attempt: 0,                  // attempts submitted so far
    n_attempts: 0,
    feedback_shown: 0,           // times corrective marking was displayed

    pair_first: pairOrder[0],    // which of the two words was shown first
    pair_correct_key: PAIR_CORRECT,

    /* --- attempt 1: THE MEASUREMENT ---
       The per-rule fields (a1_rule_*) and the per-question fields (a1_<key>,
       a1_<key>_correct) are added below from CANDIDATES and MC_ITEMS rather
       than listed here, so the exported schema always matches whatever is
       actually asked. Adding or removing an item cannot leave a
       permanently-null column behind. */
    a1_valid_n_correct: null,    // 0-4 on the membership checklist
    a1_rule_baseline_n: null,    // 0-2 (DRAGON, LOUD)
    a1_n_correct: null,          // 0-6 across all sub-items
    a1_all_correct: null,        // passed on the first attempt
    a1_membership_clean: null,   // all 4 checklist items right
    t_first_answer: null,        // open-book: first click on any item
    t_first_submit: null,

    /* --- final state: gate bookkeeping, not a comprehension measure --- */
    final_valid_n_correct: null,
    final_n_correct: null,
    final_all_correct: null,
    hit_attempt_cap: 0,          // opened the round without ever being fully correct
    t_pass: null,

    answer_changes: 0,
    started_round: 0,
    t_start_round: null
  };

  CANDIDATES.forEach(function (c) {
    state["a1_valid_" + c.key] = null;      // "counts" | "no"
    state["valid_" + c.key] = null;
    if (c.rule !== "baseline") state["a1_rule_" + c.rule] = null;
  });

  MC_ITEMS.forEach(function (q) {
    state["a1_" + q.key] = null;
    state["a1_" + q.key + "_correct"] = null;
  });

  function markInteraction() {
    if (state.t_first_interaction === null) state.t_first_interaction = Date.now() - t0;
  }

  /* ---------------- screen 1: game description ---------------- */

  document.getElementById("introText").innerHTML =
    '<p>In this study, you will play a words-in-a-word game. You will be given a set ' +
      'of letters and your goal is to create as many valid English words as you can ' +
      'using those letters.</p>' +
    '<p>Words must be at least <strong>' + minWord + ' letters</strong> long, and each ' +
      'letter may be used only as many times as it appears in the set. Ordinary English ' +
      'words only — names of people and places do not count, and neither do ' +
      'abbreviations.</p>' +
    '<p>You will earn points for each valid word you create, with longer words earning ' +
      'more points. The round lasts <strong>' + minutesWord + ' minutes</strong>, and ' +
      'your goal is to earn as many points as you can before time runs out. You will be ' +
      'able to see your score and the time remaining as you play.</p>';

  /* the scoring mechanism, rendered from SCORING so display and scoring agree */

  function scoreTableHTML() {
    return '<table class="score"><tbody>' +
      SCORING.map(function (b) {
        return '<tr><td>' + b.label + '</td><td class="pts">' + b.pts + plural(b.pts) +
               '</td></tr>';
      }).join("") +
    '</tbody></table>';
  }

  document.getElementById("scoreBox").innerHTML =
    '<h3>How points are counted</h3>' +
    scoreTableHTML() +
    '<div class="progmock">' +
      '<p class="progcap">While you play, your score and the time left stay on screen:</p>' +
      '<div class="progbar">' +
        '<span class="plab2">Score</span>' +
        '<span class="pnum">18</span>' +
        '<span class="pclock">1:12 left</span>' +
      '</div>' +
    '</div>';

  document.getElementById("introClose").innerHTML =
    '<p>When you are ready, please check the box below and proceed to the next screen ' +
    'to begin.</p>';

  document.getElementById("ackLabel").textContent =
    "I have read the rules and I am ready to continue.";

  /* ---------------- screen 2: worked example ---------------- */

  document.getElementById("exIntro").textContent =
    "Before you begin the words-in-a-word game, we will walk you through a brief " +
    "example to help you become familiar with how the game works.";

  document.getElementById("targetBox").innerHTML =
    '<div class="lab">Your letters</div><div class="word">' + TARGET + '</div>';

  /* Full rules recap. This stays on screen above the items — they are answered
     open-book, so nothing is held in memory across the page break. */

  document.getElementById("rulesBox").innerHTML =
    '<h3>The rules, in short</h3>' +
    '<ul>' +
      '<li>Make as many words as you can out of the letters in <strong>' + TARGET +
        '</strong>.</li>' +
      '<li>You may use each letter no more times than it appears in ' + TARGET + '. ' +
        'Every letter appears once, so no letter may be used twice in the same word.</li>' +
      '<li>A word must be at least <strong>' + minWord + ' letters</strong> long.</li>' +
      '<li>Ordinary English words only. Names of people and places do not count, ' +
        'and neither do abbreviations.</li>' +
      '<li>The round lasts <strong>' + minutesWord + ' minutes</strong>. Score as many ' +
        'points as you can before time runs out.</li>' +
    '</ul>' +
    '<h3 class="second">How points are counted</h3>' +
    scoreTableHTML();

  /* ---------------- items ---------------- */

  function renderItems() {
    var html =
      '<p class="compintro">A few quick questions about the game. The rules and the ' +
        'scoring table stay on screen above — look back at them as often as you like.</p>' +
      '<div class="compq" data-q="membership">' +
        '<p>For each word below, would it count in a round played on <strong>' +
          TARGET + '</strong>?</p>' +
        candidateOrder.map(function (c) {
          return '<div class="wrow" data-word="' + c.key + '">' +
                   '<span class="wword">' + c.word + '</span>' +
                   '<span class="wbtns">' +
                     '<button type="button" class="opt" data-val="counts">Counts</button>' +
                     '<button type="button" class="opt" data-val="no">Does not count</button>' +
                   '</span>' +
                   '<span class="mark"></span>' +
                 '</div>';
        }).join("") +
      '</div>' +
      MC_ITEMS.map(function (q) {
        return '<div class="compq" data-q="' + q.key + '">' +
                 '<p>' + q.text + '</p>' +
                 '<div class="' + (q.layout === "row" ? "opts" : "optcol") + '">' +
                   q.opts.map(function (o) {
                     return '<button type="button" class="opt" data-val="' + o[0] + '">' +
                            o[1] + '</button>';
                   }).join("") +
                 '</div>' +
               '</div>';
      }).join("");
    document.getElementById("items").innerHTML = html;
  }

  var answers = {};   // live answers; revisions overwrite

  /* ---------------- acknowledgement gate ---------------- */

  document.getElementById("ack").addEventListener("change", function () {
    markInteraction();
    state.ack_toggles += 1;
    state.ack_checked = this.checked ? 1 : 0;
    if (this.checked && state.t_ack === null) state.t_ack = Date.now() - t0;
    document.getElementById("continueBtn").disabled = !this.checked;
    report();
    reportHeight();
  });

  document.getElementById("continueBtn").addEventListener("click", function () {
    if (!document.getElementById("ack").checked) return;
    markInteraction();
    state.t_rules_read = Date.now() - t0;
    document.getElementById("intro").style.display = "none";
    renderItems();
    document.getElementById("example").classList.add("open");
    window.scrollTo(0, 0);
    report();
    reportHeight();
  });

  document.getElementById("items").addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (!opt) return;

    var row = opt.closest(".wrow");
    var block = opt.closest(".compq");
    var key = row ? row.getAttribute("data-word") : block.getAttribute("data-q");
    var val = opt.getAttribute("data-val");
    var scope = row || block;

    if (state.t_first_answer === null) state.t_first_answer = Date.now() - t0;
    if (answers[key] !== undefined && answers[key] !== val) state.answer_changes += 1;
    answers[key] = val;

    scope.querySelectorAll(".opt").forEach(function (b) {
      b.classList.remove("wrongpick");
      b.classList.toggle("picked", b === opt);
    });
    if (row) row.querySelector(".mark").textContent = "";

    updateSubmitState();
    report();
    reportHeight();
  });

  function allAnswered() {
    var ok = CANDIDATES.every(function (c) { return answers[c.key] !== undefined; });
    return ok && MC_ITEMS.every(function (q) { return answers[q.key] !== undefined; });
  }

  function updateSubmitState() {
    document.getElementById("submitBtn").disabled = !allAnswered();
  }

  /* ---------------- submit / grade ---------------- */

  document.getElementById("submitBtn").addEventListener("click", function () {
    if (!allAnswered()) return;

    state.attempt += 1;
    state.n_attempts = state.attempt;
    var first = state.attempt === 1;

    var membershipCorrect = 0, baselineCorrect = 0;
    CANDIDATES.forEach(function (c) {
      var want = c.counts ? "counts" : "no";
      var got = answers[c.key];
      var right = got === want;
      state["valid_" + c.key] = got;
      if (right) membershipCorrect += 1;
      if (first) {
        state["a1_valid_" + c.key] = got;
        if (c.rule === "baseline") { if (right) baselineCorrect += 1; }
        else state["a1_rule_" + c.rule] = right ? 1 : 0;
      }
    });

    var mcCorrect = 0;
    MC_ITEMS.forEach(function (q) {
      var right = answers[q.key] === q.correct;
      if (right) mcCorrect += 1;
      if (first) {
        state["a1_" + q.key] = answers[q.key];
        state["a1_" + q.key + "_correct"] = right ? 1 : 0;
      }
    });

    var total = membershipCorrect + mcCorrect;

    if (first) {
      state.a1_rule_baseline_n = baselineCorrect;
      state.a1_valid_n_correct = membershipCorrect;
      state.a1_n_correct = total;
      state.a1_all_correct = total === N_SUBITEMS ? 1 : 0;
      state.a1_membership_clean = membershipCorrect === CANDIDATES.length ? 1 : 0;
      state.t_first_submit = Date.now() - t0;
    }

    state.final_valid_n_correct = membershipCorrect;
    state.final_n_correct = total;
    state.final_all_correct = total === N_SUBITEMS ? 1 : 0;

    if (total === N_SUBITEMS || !REQUIRE_CORRECT || state.attempt >= MAX_ATTEMPTS) {
      if (total !== N_SUBITEMS && REQUIRE_CORRECT) state.hit_attempt_cap = 1;
      state.t_pass = Date.now() - t0;
      openRound(total === N_SUBITEMS);
    } else {
      showCorrections();
    }

    report();
    reportHeight();
  });

  /* ---------------- corrective feedback ----------------
     Marks which sub-items were wrong without revealing the right answer. The
     rules are already on screen, so nothing needs to be restored — the retry is
     a re-read of material that never left. Withholding the answer keeps the
     second attempt a re-read rather than a two-alternative elimination. */

  function showCorrections() {
    CANDIDATES.forEach(function (c) {
      var row = document.querySelector('.wrow[data-word="' + c.key + '"]');
      var want = c.counts ? "counts" : "no";
      var mark = row.querySelector(".mark");
      if (answers[c.key] === want) {
        mark.className = "mark ok";
        mark.textContent = "correct";
      } else {
        mark.className = "mark no";
        mark.textContent = "not right";
        row.querySelectorAll(".opt.picked").forEach(function (b) {
          b.classList.add("wrongpick");
        });
      }
    });

    MC_ITEMS.forEach(function (q) {
      var block = document.querySelector('.compq[data-q="' + q.key + '"]');
      if (answers[q.key] !== q.correct) {
        block.querySelectorAll(".opt.picked").forEach(function (b) {
          b.classList.add("wrongpick");
        });
      }
    });

    var fb = document.getElementById("feedback");
    fb.className = "feedback open";
    fb.innerHTML = "Not quite — the answers marked in red are not right. " +
                   "The rules are above; have another look and change those answers.";

    state.feedback_shown += 1;
    window.scrollTo(0, 0);
  }

  /* ---------------- round opens ---------------- */

  function openRound(clean) {
    document.getElementById("example").style.display = "none";
    document.getElementById("intro").style.display = "none";

    var done = document.getElementById("done");
    done.innerHTML =
      '<div class="feedback good open" style="margin-bottom:16px">' +
        (clean ? "That is right — you have the rules."
               : "Thanks. The rules stay on screen during the round.") +
      '</div>' +
      '<div class="target"><div class="lab">Your letters</div>' +
        '<div class="word">' + TARGET + '</div></div>' +
      '<button type="button" class="choicebtn primary" id="startBtn">Start the round</button>';
    done.classList.add("open");

    document.getElementById("startBtn").addEventListener("click", function () {
      state.started_round = 1;
      state.t_start_round = Date.now() - t0;
      report();
      try {
        window.parent.postMessage(
          { source: "probe", probe: PROBE_ID, event: "ready", data: state }, "*");
      } catch (err) {}
      document.getElementById("startBtn").disabled = true;
      document.getElementById("startBtn").textContent = "Starting…";
      reportHeight();
    });

    window.scrollTo(0, 0);
  }

  /* ---------------- reporting ---------------- */

  function report() {
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, data: state }, "*");
    } catch (err) {}
  }

  var lastHeight = 0, ro = null;
  function reportHeight() {
    var h = document.body.scrollHeight + 24;
    if (h === lastHeight) return;
    lastHeight = h;
    try {
      window.parent.postMessage({ source: "probe", probe: PROBE_ID, height: h }, "*");
    } catch (err) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (window.ResizeObserver) { ro = new ResizeObserver(reportHeight); ro.observe(document.body); }
  setInterval(reportHeight, 500);

  report();
  reportHeight();
})();
</script>
</body>
</html>
